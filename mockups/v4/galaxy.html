  // ---------------------------------------------------------------------
  // LAYOUT. Each project is its own galaxy in a void of its own. Centres sit
  // on a loose shell, each project taking the slot nearest its embedding
  // direction, so related work lands nearby. Stars are generated once from
  // the seed; per frame they are only turned and projected.
  // ---------------------------------------------------------------------
  const KEYS = Object.keys(META);
  const NK = KEYS.length;
  const KINDS = ['tight', 'loose', 'barred', 'tight', 'elliptical', 'loose', 'barred', 'tight', 'elliptical', 'loose', 'barred', 'tight'];
  const TIGHT = { tight: 4.2, loose: 2.2, barred: 2.8, elliptical: 0 };

  const count = {}, dirSum = {};
  CHUNKS.forEach(c => {
    count[c.project] = (count[c.project] || 0) + 1;
    const a = dirSum[c.project] || (dirSum[c.project] = [0, 0, 0]);
    a[0] += c.pos[0]; a[1] += c.pos[1]; a[2] += c.pos[2];
  });

  const shell = [];
  for (let i = 0; i < NK; i++) {
    const y = 1 - 2 * (i + 0.5) / NK, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
    shell.push(unit([Math.cos(th) * r, y, Math.sin(th) * r]));
  }
  const taken = new Array(NK).fill(false);
  const CENTER = {};
  KEYS.forEach(k => {
    const d = unit(dirSum[k]);
    let best = -1, bd = -Infinity;
    shell.forEach((s, j) => {
      const dd = s[0] * d[0] + s[1] * d[1] + s[2] * d[2];
      if (!taken[j] && dd > bd) { bd = dd; best = j; }
    });
    taken[best] = true;
    CENTER[k] = shell[best].map(v => v * (2.3 + 0.7 * rnd()));
  });

  // Galaxies: bulge (bucket 3), arm stars (1, 2), halo (0). Each galaxy
  // gets a seeded morphology, tilt, spin, palette and star field.
  const GAL = {};
  KEYS.forEach((k, idx) => {
    const kind = KINDS[idx % KINDS.length];
    const elliptical = kind === 'elliptical';
    const n = count[k];
    const R = 0.14 + 0.03 * n;
    const arms = elliptical ? 1 : kind === 'tight' ? 2 + Math.floor(rnd() * 3) : 2;
    const tw = TIGHT[kind];
    const armAng = (f, a) => a * TAU / arms + tw * Math.log(1 + 3 * f);

    // Random disc orientation (the galaxy's tilt).
    const uz = rnd() * 2 - 1, ph = rnd() * TAU, sq = Math.sqrt(1 - uz * uz);
    const N = [sq * Math.cos(ph), sq * Math.sin(ph), uz];
    const E1 = unit(cross(N, Math.abs(N[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    const E2 = cross(N, E1);

    const Ns = 2000 + 500 * Math.min(n, 4);
    const nBulge = Math.round(Ns * (elliptical ? 0.7 : 0.12));
    const nHalo = Math.round(Ns * (elliptical ? 0.3 : 0.18));
    const nArm = elliptical ? 0 : Ns - nBulge - nHalo;
    const bk = [[], [], [], []];
    const put = (b, x, y, z) => bk[b].push(x, y, z);
    for (let i = 0; i < nBulge; i++) {
      const s = elliptical ? 0.32 : 0.09;
      put(elliptical && rnd() < 0.4 ? 2 : 3, gauss() * s * R, gauss() * s * R * (elliptical ? 0.8 : 1), gauss() * s * R * 0.6);
    }
    for (let i = 0; i < nHalo; i++) put(0, gauss() * 0.45 * R, gauss() * 0.45 * R, gauss() * 0.3 * R);
    for (let i = 0; i < nArm; i++) {
      if (kind === 'barred' && rnd() < 0.25) {
        put(2, (2 * rnd() - 1) * 0.5 * R, gauss() * 0.03 * R, gauss() * 0.01 * R);
        continue;
      }
      const f = 0.1 + 0.9 * Math.pow(rnd(), 0.8);
      const th = armAng(f, Math.floor(rnd() * arms)) + gauss() * (0.06 + 0.05 * f);
      const r = R * f * (1 + 0.05 * gauss());
      put(rnd() < 0.45 ? 2 : 1, r * Math.cos(th), r * Math.sin(th), gauss() * 0.012 * R);
    }

    // Dust lanes sit on the inner edge of each arm.
    const dust = [];
    if (!elliptical) {
      for (let i = 0; i < 140; i++) {
        const f = 0.25 + 0.7 * rnd();
        const th = armAng(f, Math.floor(rnd() * arms)) - 0.14;
        dust.push(R * f * Math.cos(th), R * f * Math.sin(th), gauss() * 0.004 * R);
      }
    }

    const X = [], bStart = [0];
    bk.forEach(arr => { for (let i = 0; i < arr.length; i++) X.push(arr[i]); bStart.push(X.length / 3); });

    // Chunks become brighter stars on the arms, in their stored order.
    const chunkIdx = [];
    let j = 0;
    CHUNKS.forEach((c, i) => {
      if (c.project !== k) return;
      const f = 0.3 + 0.6 * ((Math.floor(j / arms) + 0.5) / Math.ceil(n / arms));
      const th = elliptical ? j * 2.4 : armAng(f, j % arms), r = R * f;
      c.local = [r * Math.cos(th), r * Math.sin(th), 0.01 * R * gauss()];
      chunkIdx.push(i);
      j++;
    });

    // Portrait candidates: the stars nearest the core (bulge and inner arms).
    const Xf = new Float32Array(X), Nst = Xf.length / 3;
    const rad2 = q => Xf[3 * q] ** 2 + Xf[3 * q + 1] ** 2 + Xf[3 * q + 2] ** 2;
    const inner = Int32Array.from(Array.from({ length: Nst }, (_, q) => q)
      .sort((a, b) => rad2(a) - rad2(b)));

    const core = CORE_PAL[Math.floor(rnd() * CORE_PAL.length)];
    const arm = ARM_PAL[Math.floor(rnd() * ARM_PAL.length)];
    GAL[k] = {
      key: k, kind, R, N, E1, E2, A: [0, 0, 0], B: [0, 0, 0],
      core: CENTER[k],
      phase: rnd() * TAU,
      omega: (rnd() < 0.5 ? -1 : 1) * (0.05 + 0.06 * rnd()),   // rad/s, own axis
      delay: rnd(),
      bcol: [arm, mix(arm, core, 0.35), mix(core, arm, 0.45), core],
      ccol: mix(core, WHITE, 0.5),
      X: Xf, bStart, Ns: Nst, inner,
      // Halftone portrait (filled by buildPortrait once the image is read).
      pidx: new Int32Array(0), pslot: new Int32Array(Nst).fill(-1), pTheme: null,
      cols: 0, rows: 0, pw: 0, ph: 0, fAvg: 0, lastWant: false,
      tu: new Float32Array(0), tv: new Float32Array(0), sv: new Float32Array(0),
      fe: new Float32Array(0), fv: new Float32Array(0), fw: new Float32Array(0), fd: new Float32Array(0),
      D: new Float32Array(dust), nDust: dust.length / 3,
      chunkIdx,
      gi: 0, alpha: 0, acc: 0, dim: 0, lit: 0, bboxLogged: false,
      vis: false, sx: 0, sy: 0, k: 1, px: 0
    };
  });

  // Embedding centroid per project (real data), for cosine labels.
  const EMB = {};
  KEYS.forEach(k => { EMB[k] = dirSum[k].map(v => v / count[k]); });

  const nearProjects = {};
  KEYS.forEach(k => {
    nearProjects[k] = KEYS.filter(o => o !== k)
      .sort((a, b) => dist(CENTER[k], CENTER[a]) - dist(CENTER[k], CENTER[b]))
      .slice(0, 2);
  });

  // Distant background starfield (orthographic, rotates with the scene).
  const BG = [];
  for (let i = 0; i < 420; i++) {
    const u = rnd() * 2 - 1, ph = rnd() * TAU, s = Math.sqrt(1 - u * u);
    BG.push([s * Math.cos(ph), u, s * Math.sin(ph), 0.08 + 0.22 * rnd()]);
  }

  const root = document.documentElement;
  const cv = document.getElementById('cloud');
  const ctx = cv.getContext('2d');
  const themeBtn = document.getElementById('themeBtn');
  const detail = document.getElementById('detail');
  const backBtn = document.getElementById('backBtn');
  const dCat = document.getElementById('dCat');
  const dSub = document.getElementById('dSub');
  const dTitle = document.getElementById('dTitle');
  const dStats = document.getElementById('dStats');
  const dDesc = document.getElementById('dDesc');
  const dTech = document.getElementById('dTech');
  const dLinks = document.getElementById('dLinks');
  const scrubWrap = document.getElementById('scrubWrap');
  const scCanvas = document.getElementById('scrubCanvas');
  const sctx = scCanvas.getContext('2d');

  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMq.matches;
  reduceMq.addEventListener('change', e => { reduce = e.matches; });

  // ---------------------------------------------------------------------
  // THEME
  // ---------------------------------------------------------------------
  const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  let dark = false;
  let pal = PAL.light;
  function storedTheme() {
    try { return localStorage.getItem('theme'); } catch (e) { return null; }
  }
  function setTheme(isDark, persist) {
    dark = isDark;
    pal = dark ? PAL.dark : PAL.light;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    if (persist) { try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} }
    if (selected) drawScrub();
  }
  themeBtn.addEventListener('click', () => setTheme(!dark, true));
  darkMq.addEventListener('change', e => { if (!storedTheme()) setTheme(e.matches, false); });

  // ---------------------------------------------------------------------
  // CANVAS SIZE
  // ---------------------------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // STATE, CAMERA AND PROJECTION
  // ---------------------------------------------------------------------
  const CAM = 7;          // camera distance, world units
  const ZIN = 10;         // zoom multiplier when flown into a galaxy
  const OVER = 0.13;      // overview scale, fraction of min(W, H) per unit
  const INTRO_S = 2.2;    // galaxy fade-in length, seconds
  const ZERO = [0, 0, 0];
  const t0 = performance.now();
  let last = t0;
  let t = 0;               // seconds, drives spin
  let angY = 0.6, angX = 0.22;
  let spin = 1;            // multiplier on scene rotation speed
  let zt = 0;              // 0 overview, 1 inside the selected galaxy
  let userZoom = 1;        // wheel zoom
  let userTilt = 0;        // vertical drag tilt
  let velY = 0, velX = 0;  // drag inertia (rad/s)
  let panelT = 0;          // 0 closed, 1 open
  let sun = -1;            // chunk index of the solar system open inside `selected`, or -1
  let zs = 0;              // 0 galaxy level, 1 solar level (eased)
  let portraitOn = true;   // halftone portrait held inside a galaxy (toggle: P)
  let hoverPlanet = -1;    // planet under the pointer at the solar level
  let sunSX = 0, sunSY = 0;   // sun screen position this frame
  const sunW = [0, 0, 0];     // sun world position (camera target at the solar level)
  let PWd = 0, PHd = 0;       // halftone portrait size on screen, set per frame
  const focus = [0, 0, 0];
  let selected = null;     // galaxy (project key) flown into and open
  let hovered = null;      // galaxy key under the pointer
  let hoverIdx = -1;       // chunk index under the pointer (inside only)
  const pointer = { x: -1, y: -1, on: false, touch: false };
  let cA = 1, sA = 0, cB = 1, sB = 0;   // scene rotation this frame
  const FR = [0, 0, 0];                  // rotated focus point
  let CX = 0, CY = 0, SC = 1;            // screen centre and scale
  const P = [0, 0, 0];                   // projection output: x, y, perspective factor

  function rotPoint(p, out) {
    const x1 = cA * p[0] + sA * p[2], z1 = -sA * p[0] + cA * p[2];
    out[0] = x1; out[1] = cB * p[1] - sB * z1; out[2] = sB * p[1] + cB * z1;
    return out;
  }
  function project(wx, wy, wz) {
    const x1 = cA * wx + sA * wz, z1 = -sA * wx + cA * wz;
    const y1 = cB * wy - sB * z1, z2 = sB * wy + cB * z1;
    const dep = CAM - (z2 - FR[2]);
    if (dep < 0.3) return false;
    const k = CAM / dep;
    P[0] = CX + (x1 - FR[0]) * k * SC;
    P[1] = CY - (y1 - FR[1]) * k * SC;
    P[2] = k;
    return true;
  }
  // Galaxy-local point to screen.
  function toScreen(g, x, y, z) {
    return project(
      g.core[0] + x * g.A[0] + y * g.B[0] + z * g.N[0],
      g.core[1] + x * g.A[1] + y * g.B[1] + z * g.N[1],
      g.core[2] + x * g.A[2] + y * g.B[2] + z * g.N[2]
    );
  }

  // What is under the pointer: a galaxy in the overview, a chunk when inside.
  function pick(x, y, rr) {
    if (selected) {
      if (zt < 0.5 || sun >= 0) return null;
      let best = -1, bd = Infinity;
      GAL[selected].chunkIdx.forEach(i => {
        const c = CHUNKS[i];
        if (!c.vis) return;
        const d = Math.hypot(c.sx - x, c.sy - y);
        if (d < Math.max(rr, 5) && d < bd) { bd = d; best = i; }
      });
      return best >= 0 ? { k: selected, i: best } : null;
    }
    // Search hits first: a matching star flies into its galaxy.
    let hk = null, hd = Infinity;
    hits.forEach(h => {
      const c = CHUNKS[h.i];
      if (!c.vis) return;
      const d = Math.hypot(c.sx - x, c.sy - y);
      if (d < Math.max(rr, 6) && d < hd) { hd = d; hk = c.project; }
    });
    if (hk) return { k: hk, i: -1 };
    let bk = null, bd = Infinity;
    KEYS.forEach(k => {
      const g = GAL[k];
      if (!g.vis) return;
      const d = Math.hypot(g.sx - x, g.sy - y);
      if (d < Math.max(rr, g.px + 6) && d < bd) { bd = d; bk = k; }
    });
    return bk ? { k: bk, i: -1 } : null;
  }

  // ---------------------------------------------------------------------
  // POINTER ON THE SKY (hover, drag to orbit, scroll to zoom)
  // ---------------------------------------------------------------------
  cv.addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.on = true; pointer.touch = e.pointerType === 'touch';
  });
  cv.addEventListener('pointerleave', () => { pointer.on = false; });

  // Drag to rotate (with inertia); a press that barely moves counts as a click.
  const drag = { on: false, x0: 0, y0: 0, lx: 0, ly: 0, moved: false };
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    drag.on = true; drag.moved = false;
    drag.x0 = drag.lx = e.clientX; drag.y0 = drag.ly = e.clientY;
    velY = velX = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (!drag.on) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) drag.moved = true;
    if (!drag.moved) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    angY += dx * 0.006; userTilt = clamp(userTilt + dy * 0.006, -1.2, 1.2);
    velY = dx * 0.006 * 60; velX = dy * 0.006 * 60;
    cv.classList.add('grabbing');
  });
  const endDrag = e => {
    if (!drag.on) return;
    drag.on = false;
    cv.classList.remove('grabbing');
    if (drag.moved) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.touch = e.pointerType === 'touch';
    const rr = pointer.touch ? 22 : 10;
    if (selected && sun >= 0) {
      // Solar level: a click on empty space steps back to the galaxy.
      if (hoverPlanet < 0 && !sunHit(pointer.x, pointer.y)) exitSun();
    } else {
      const hit = pick(pointer.x, pointer.y, rr);
      if (hit && hit.i >= 0) enterSun(hit.i);            // chunk star: fly to it, solar level
      else if (hit) { if (selected !== hit.k) openProject(hit.k); }
      else if (selected) closeProject();
    }
    if (pointer.touch) pointer.on = false;
  };
  function sunHit(x, y) { return Math.hypot(x - sunSX, y - sunSY) < 26; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', () => { drag.on = false; cv.classList.remove('grabbing'); });

  // Scroll to zoom.
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    userZoom = clamp(userZoom * Math.exp(-e.deltaY * 0.0015), 0.6, 2.5);
  }, { passive: false });

  // ---------------------------------------------------------------------
  // SEARCH (keyword retrieval for now; swap for a real embedding later)
  // ---------------------------------------------------------------------
  const STOP = new Set('a an and the of to in on for with by is are i my me at as or it from that this what who how do does'.split(' '));
  const tok = s => s.toLowerCase().split(/[^a-z0-9+#.]+/).filter(w => w.length > 1 && !STOP.has(w));
  const DOCS = CHUNKS.map(c => tok([c.text, META[c.project].title, META[c.project].tech.join(' ')].join(' ')).join(' '));
  let hits = [];                 // [{i, score}], top 5 chunks
  let hitSet = new Set();        // chunk indices in hits
  const hitGal = new Set();      // galaxy keys holding a hit
  const qWorld = [0, 0, 0];      // smoothed query marker in the void (galaxy space)
  const qEmb = [0, 0, 0];        // score-weighted embedding, for cosine labels
  let qT = 0;                    // query visibility ease
  const qInput = document.getElementById('q');
  function runQuery() {
    const qs = tok(qInput.value);
    hits = qs.length ? DOCS.map((d, i) => {
      const m = qs.filter(w => d.includes(w)).length;
      return { i, score: m / qs.length };
    }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 5) : [];
    hitSet = new Set(hits.map(h => h.i));
    hitGal.clear();
    hits.forEach(h => hitGal.add(CHUNKS[h.i].project));
  }
  qInput.addEventListener('input', runQuery);
  qInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { qInput.value = ''; runQuery(); qInput.blur(); }
  });
  const cosine = (a, b) => {
    const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    return d / ((Math.hypot(a[0], a[1], a[2]) * Math.hypot(b[0], b[1], b[2])) || 1);
  };

  // ---------------------------------------------------------------------
  // HOVER PEEK: a live page, a video, or a screenshot. Projects that
  // animate inside their galaxy get no peek card, only the hover label.
  // ---------------------------------------------------------------------
  const IMG = '../../img/';
  const PEEK = {
    league:    { live: 'https://augustzhang1.github.io/LeagueVODreview/review/NA1_5650873814?p=1', img: 'league.jpg' },
    minecraft: { video: 'minecraft.mp4', img: 'minecraft.jpg' },   // add img/minecraft.mp4 to enable
    sinai:     { img: 'sinai.jpg', fit: 'contain' },              // logo: contained, never cropped
    senseway:  { img: 'senseway.png', fit: 'contain' }
  };
  const peek = document.getElementById('peek');
  const peekImg = document.getElementById('peekImg');
  const peekVid = document.getElementById('peekVid');
  let peekFrame = null, peekKey = null, vidOk = {};
  function showPeek(k) {
    if (k === peekKey) return;
    peekKey = k;
    [peekImg, peekVid, peekFrame].forEach(e => e && e.classList.remove('show'));
    peekVid.pause();
    if (!k || !PEEK[k]) { peekKey = null; peek.classList.remove('on'); return; }
    const m = PEEK[k];
    if (m.live) {
      // Created once and kept, so the live page doesn't reload on every hover.
      if (!peekFrame) {
        peekFrame = document.createElement('iframe');
        peekFrame.src = m.live; peekFrame.tabIndex = -1; peekFrame.loading = 'eager';
        peek.appendChild(peekFrame);

    } else if (m.video && vidOk[k] !== false) {

        peekVid.poster = IMG + m.img;
        peekVid.src = IMG + m.video;
        peekVid.onerror = () => { vidOk[k] = false; if (peekKey === k) { peekKey = null; showPeek(k); } };
      }
      peekVid.classList.add('show');

  function placePeek(x, y) {

  // ---------------------------------------------------------------------
  // GUARD: a non-finite value is clamped to 0 once, with a console warning.
  // ---------------------------------------------------------------------
  const warned = {};
  function guard(v, where) {
    if (Number.isFinite(v)) return v;
    if (!warned[where]) { warned[where] = true; console.warn('galaxy.html: non-finite ' + where); }
    return 0;
  }

  // ---------------------------------------------------------------------
  // DEEP FIELD: distant smudge galaxies and three starfield layers at
  // different parallax. Rendered to an offscreen canvas, redrawn only when
  // the view has rotated by a visible step.
  // ---------------------------------------------------------------------
  const LAYERS = [
    { n: 420, f: 0.18, size: 0.7, a: 0.55 },
    { n: 170, f: 0.35, size: 0.9, a: 0.8 },
    { n: 45, f: 0.55, size: 1.3, a: 1.0 }
  ].map(L => {
    const pts = [];
    for (let i = 0; i < L.n; i++) {
      const u = rnd() * 2 - 1, ph = rnd() * TAU, s = Math.sqrt(1 - u * u);
      pts.push([s * Math.cos(ph), u, s * Math.sin(ph)]);
    }
    return Object.assign(L, { pts });
  });
  const DEEP = [];
  for (let i = 0; i < 220; i++) {
    const u = rnd() * 2 - 1, ph = rnd() * TAU, s = Math.sqrt(1 - u * u);
    const n = 22 + Math.floor(rnd() * 18), dots = new Float32Array(n * 2);
    for (let j = 0; j < n; j++) { dots[2 * j] = gauss() * 0.5; dots[2 * j + 1] = gauss() * 0.5; }
    DEEP.push({
      d: [s * Math.cos(ph), u, s * Math.sin(ph)],
      size: 0.008 + 0.02 * rnd() * rnd(), ratio: 0.35 + 0.6 * rnd(), tilt: rnd() * Math.PI,
      a: 0.08 + 0.18 * rnd(), dots, n
    });
  }
  const deepC = document.createElement('canvas');
  const dctx = deepC.getContext('2d');
  let deepKey = '';
  function renderDeep() {
    if (deepC.width !== cv.width || deepC.height !== cv.height) { deepC.width = cv.width; deepC.height = cv.height; }
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.clearRect(0, 0, deepC.width, deepC.height);
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const R0 = Math.max(W, H) * 0.7;
    const base = dark ? BG_COL : [22, 28, 42];
    const cxD = W / 2, cyD = H / 2;
    // Starfield layers: each rotates a little less than the last, for parallax.
    LAYERS.forEach(L => {
      const cy = Math.cos(angY * L.f), sy = Math.sin(angY * L.f);
      const cb = Math.cos(angX * L.f), sb = Math.sin(angX * L.f);
      dctx.fillStyle = rgba(base, L.a * (dark ? 1 : 0.5));
      L.pts.forEach(p => {
        const x1 = cy * p[0] + sy * p[2], z1 = -sy * p[0] + cy * p[2];
        const y1 = cb * p[1] - sb * z1;
        dctx.fillRect(cxD + x1 * R0, cyD - y1 * R0, L.size, L.size);
      });
    });
    // Smudge galaxies: a few dozen faint dots each.
    const cyG = Math.cos(angY * 0.25), syG = Math.sin(angY * 0.25);
    const cbG = Math.cos(angX * 0.25), sbG = Math.sin(angX * 0.25);
    DEEP.forEach(G => {
      const p = G.d;
      const x1 = cyG * p[0] + syG * p[2], z1 = -syG * p[0] + cyG * p[2];
      const y1 = cbG * p[1] - sbG * z1;
      const cx = cxD + x1 * R0, cy2 = cyD - y1 * R0;
      if (cx < -60 || cx > W + 60 || cy2 < -60 || cy2 > H + 60) return;
      const depth = clamp(0.4 + 0.6 * z1, 0.2, 1);
      dctx.fillStyle = rgba(base, G.a * depth * (dark ? 1 : 0.5));
      const sz = G.size * R0, ct = Math.cos(G.tilt), st = Math.sin(G.tilt);
      for (let j = 0; j < G.n; j++) {
        const gx = G.dots[2 * j], gy = G.dots[2 * j + 1];
        dctx.fillRect(cx + sz * (gx * ct - gy * st * G.ratio), cy2 + sz * (gx * st + gy * ct * G.ratio), 1, 1);
      }
    });
  }

  // ---------------------------------------------------------------------
  // HALFTONE PORTRAIT. Each project's screenshot (or its logo, or its title
  // as text when the image cannot be read) becomes a luminance grid; the
  // darkest/brightest cells become dots, assigned to the galaxy's inner stars.
  // ---------------------------------------------------------------------
  const GCOLS = 60;
  const GRID = {};   // key -> { cols, rows, lum: Float32Array }

  function storeGrid(key, src, sw, sh, fit) {
    const ar = sw > 0 && sh > 0 ? sh / sw : 0.625;
    const cols = GCOLS;
    const rows = clamp(Math.round(cols * ar), 38, 64);
    const c = document.createElement('canvas');
    c.width = cols; c.height = rows;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    if (fit === 'contain') {
      // The whole logo, centred with about 12% padding. The padding stays transparent.
      const s = Math.min(cols * 0.76 / sw, rows * 0.76 / sh), dw = sw * s, dh = sh * s;
      g.drawImage(src, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    } else {
      g.drawImage(src, 0, 0, cols, rows);
    }
    const data = g.getImageData(0, 0, cols, rows).data;
    const lum = new Float32Array(cols * rows), al = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) {
      lum[i] = (0.2126 * data[i * 4] + 0.7152 * data[i * 4 + 1] + 0.0722 * data[i * 4 + 2]) / 255;
      al[i] = data[i * 4 + 3] / 255;
    }
    GRID[key] = { cols, rows, lum, al };
    console.log('galaxy.html: halftone grid ' + key + ' ' + cols + 'x' + rows + ' (' + (src.naturalWidth || sw) + 'x' + (src.naturalHeight || sh) + ' source)');
  }
  // Fallback: the project title as text, drawn to a canvas and sampled the same way.
  function titleGrid(key) {
    try {
      const c = document.createElement('canvas');
      c.width = 600; c.height = 400;
      const g = c.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, 600, 400);
      g.fillStyle = '#000000';
      g.font = '600 52px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      const lines = [];
      let ln = '';
      META[key].title.split(' ').forEach(w => {
        const tryLn = ln ? ln + ' ' + w : w;
        if (g.measureText(tryLn).width > 500 && ln) { lines.push(ln); ln = w; } else ln = tryLn;
      });
      lines.push(ln);
      const lh = 64, y0 = 200 - (lines.length - 1) * lh / 2;
      lines.forEach((l, n) => g.fillText(l, 300, y0 + n * lh));
      storeGrid(key, c, 600, 400);
    } catch (e) { /* no portrait for this project */ }
    buildPortrait(key);
  }
  function loadPortrait(k) {
    // Only minecraft, league, sinai and senseway get a halftone portrait. The rest animate
    // inside their galaxy instead.
    if (!PORTRAIT_KEYS.includes(k)) return;
    const file = PEEK[k].logo || PEEK[k].img;
    if (!file) { titleGrid(k); return; }
    const img = new Image();
    img.onload = () => {
      try { storeGrid(k, img, img.naturalWidth || img.width, img.naturalHeight || img.height, PEEK[k].fit); }
      catch (e) { titleGrid(k); return; }   // unreadable (e.g. opened from file://)
      buildPortrait(k);
    };
    img.onerror = () => titleGrid(k);
    img.src = IMG + file;
  }

  // Cells that carry ink (light theme) or light (dark theme), darkest first,
  // assigned to the galaxy's inner stars. Rebuilt when the theme changes.
  function buildPortrait(k) {
    const g = GAL[k], grid = GRID[k];
    if (!grid) return;
    // Ink per cell (light on dark, dark on light), weighted by opacity and stretched over the
    // full range so faint images still read. Every cell gets a dot; the faintest are tiny.
    const raw = new Float32Array(grid.lum.length);
    let lo = Infinity, hi = -Infinity;
    for (let c = 0; c < raw.length; c++) {
      raw[c] = (dark ? grid.lum[c] : 1 - grid.lum[c]) * grid.al[c];
      lo = Math.min(lo, raw[c]); hi = Math.max(hi, raw[c]);
    }
    const span = hi - lo || 1;
    const cand = [];
    for (let c = 0; c < raw.length; c++) cand.push({ c, v: (raw[c] - lo) / span });
    cand.sort((a, b) => b.v - a.v);
    const K = Math.min(g.inner.length, cand.length);
    g.pTheme = dark;
    g.cols = grid.cols; g.rows = grid.rows;
    g.pidx = g.inner.slice(0, K);
    g.pslot.fill(-1);
    g.tu = new Float32Array(K); g.tv = new Float32Array(K); g.sv = new Float32Array(K);
    g.fe = new Float32Array(K); g.fv = new Float32Array(K); g.fw = new Float32Array(K); g.fd = new Float32Array(K);
    for (let s = 0; s < K; s++) {
      const col = cand[s].c % grid.cols, row = (cand[s].c / grid.cols) | 0;
      g.tu[s] = (col + 0.5) / grid.cols - 0.5;
      g.tv[s] = (row + 0.5) / grid.rows - 0.5;
      g.sv[s] = cand[s].v;
      g.fd[s] = rnd() * 0.9;                 // stagger: each dot starts its spring at its own time
      g.pslot[g.pidx[s]] = s;
    }
    g.lastWant = false;
  }
  // Staggered critically damped spring, 0..1 per dot (halftone.html decode).
  function updatePortrait(g, dt, want) {
    const K = g.fe.length;
    if (!K) return;
    if (g.lastWant !== want) {
      g.lastWant = want;
      for (let s = 0; s < K; s++) g.fw[s] = g.fd[s];
    }
    const target = want ? 1 : 0;
    let sum = 0;
    for (let s = 0; s < K; s++) {
      if (reduce) { g.fe[s] = target; g.fv[s] = 0; }
      else if (g.fw[s] > 0) g.fw[s] -= dt;
      else {
        const w = 7;
        g.fv[s] += (w * w * (target - g.fe[s]) - 2 * w * g.fv[s]) * dt;
        g.fe[s] = clamp(g.fe[s] + g.fv[s] * dt, 0, 1);
      }
      sum += g.fe[s];
    }
    g.fAvg = sum / K;
  }

  // ---------------------------------------------------------------------
  // SOLAR SYSTEM. One sun per chunk, one planet per key term in its text.
  // ---------------------------------------------------------------------
  function hash01(s, salt) {
    let h = 2166136261 ^ salt;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  }
  // Terms: tech from the project that the chunk mentions, then numbers with a
  // unit or sign (e.g. 200K+, 90%), then the rest of the project's tech. 2 to 5.
  function termsFor(c) {
    const m = META[c.project];
    const low = c.text.toLowerCase();
    const matched = m.tech.filter(t => low.includes(t.toLowerCase()));
    const metrics = [];
    (c.text.match(/\d[\d,.]*\s?(?:%|[KMB]\+?|\+)?/g) || []).forEach(x => {
      const v = x.trim().replace(/[.,]+$/, '');
      if (v.length >= 2 && /[%+KMB,]/.test(v) && !metrics.includes(v)) metrics.push(v);
    });
    const rest = m.tech.filter(t => !matched.includes(t));
    if (rest.length) { const r = (hash01(c.text, 7) * rest.length) | 0; rest.push(...rest.splice(0, r)); }
    const pool = [...matched, ...metrics, ...rest];
    const n = clamp(matched.length + metrics.length, 2, 5);
    const out = pool.slice(0, n);
    [m.cat, m.label].forEach(x => { if (out.length < 2 && !out.includes(x)) out.push(x); });
    return out;
  }
  CHUNKS.forEach(c => { c.terms = termsFor(c); });

  // Planet ellipses around the sun (screen space, camera-facing).
  function solarPlanets(c, cx, cy, minWH) {
    return c.terms.map((term, j) => {
      const h1 = hash01(term, 1), h2 = hash01(term, 2), h3 = hash01(term, 3);
      const a = minWH * (0.14 + 0.085 * j) * zs;
      const b = a * (0.45 + 0.4 * h1);
      const tilt = (h2 - 0.5) * 1.1;
      const speed = (0.5 / (0.7 + j * 0.5)) * (0.75 + 0.5 * h1) * (reduce ? 0 : 1);
      const ang = h3 * TAU + speed * t;
      const lx = a * Math.cos(ang), ly = b * Math.sin(ang);
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      return { term, a, b, tilt, r: 2 + 1.5 * h2, x: cx + lx * ct - ly * st, y: cy + lx * st + ly * ct };
    });
  }

  // ---------------------------------------------------------------------
  // BREADCRUMB. Universe / galaxy / solar system, each crumb clickable.
  // ---------------------------------------------------------------------
  const crumbsEl = document.getElementById('crumbs');
  let crumbKey = '';
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '...' : s);
  function updateCrumbs() {
    const key = selected + '|' + sun;
    if (key === crumbKey) return;
    crumbKey = key;
    crumbsEl.innerHTML = '';
    crumbsEl.hidden = !selected;
    if (!selected) return;
    const items = [['Universe', closeProject], [META[selected].label, exitSun]];
    if (sun >= 0) items.push([clip(CHUNKS[sun].text, 42), null]);
    items.forEach(([label, fn], i) => {
      if (i) { const sep = document.createElement('span'); sep.textContent = '/'; sep.className = 'sep'; crumbsEl.appendChild(sep); }
      const b = document.createElement('button');
