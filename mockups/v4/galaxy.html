  // ---------------------------------------------------------------------
  // IN-GALAXY ANIMATIONS. Nine projects animate inside their own galaxy in
  // place of a halftone portrait. Flat dots in the galaxy palette, with the
  // accent for key moments, drawn in galaxy-radius units around the core.
  // Time only runs while you are inside. Reduced motion shows a static end state.
  // ---------------------------------------------------------------------
  const ANIM_KEYS = ['league', 'minecraft', 'snake', 'rag', 'housing', 'arbitrage', 'audiobook', 'ark-eagle', 'medihub', 'arkproject', 'jobapply', 'sinai', 'senseway'];
  const PORTRAIT_KEYS = ['minecraft', 'league', 'sinai', 'senseway'];
  const VA = [160, 196, 255], VB = [255, 224, 176];   // galaxy arm and core colours
  const MONO = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const vtone = c => (dark ? c : mix(c, INK, 0.5));
  const ease3 = x => { const u = clamp(x); return 1 - Math.pow(1 - u, 3); };
  const hsh = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
  // Flat helpers. "A" variants tone the galaxy colour for the light theme; "C" variants use the colour as given.
  const dotA = (c, x, y, r, col, a) => { if (a < 0.01) return; c.fillStyle = rgba(vtone(col), clamp(a)); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  const dotC = (c, x, y, r, col, a) => { if (a < 0.01) return; c.fillStyle = rgba(col, clamp(a)); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  const ringA = (c, x, y, r, col, a, lw = 1) => { if (a < 0.01) return; c.strokeStyle = rgba(vtone(col), clamp(a)); c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); };
  const ringC = (c, x, y, r, col, a, lw = 1) => { if (a < 0.01) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); };
  const arcC = (c, x, y, r, a0, a1, col, a, lw = 1) => { if (a < 0.01 || a1 <= a0) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); };
  const lineC = (c, x0, y0, x1, y1, col, a, lw = 1) => { if (a < 0.01) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); };
  const txtC = (c, s, x, y, col, a) => { if (a < 0.01) return; c.font = MONO; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = rgba(col, clamp(a)); c.fillText(s, x, y); };

  // Snake of bright stars slithering along the arms, eating stars and growing.
  function snakeA(rng) {
    const FOOD = [];
    for (let i = 0; i < 22; i++) {
      const f = 0.2 + 0.72 * (i / 21), ang = (i % 2) * Math.PI + 3.2 * f + 0.25 * (rng() - 0.5);
      FOOD.push({ x: f * Math.cos(ang), y: f * Math.sin(ang), on: true, k: 1 });
    }
    let hx = -0.5, hy = 0.25, vx = 0, vy = 0, tgt = null, len = 6, sample = 0, respawn = 0;
    const trail = [[hx, hy]];
    const nearest = () => {
      let best = null, bd = Infinity;
      FOOD.forEach(f => { if (!f.on) return; const d = Math.hypot(f.x - hx, f.y - hy); if (d < bd) { bd = d; best = f; } });
      return best;
    };
    return {
      update(dt) {
        FOOD.forEach(f => { f.k += ((f.on ? 1 : 0) - f.k) * Math.min(1, dt * 3); });
        if (!tgt || !tgt.on) tgt = nearest();
        if (!tgt) { respawn += dt; if (respawn > 2.5) { FOOD.forEach(f => { f.on = true; }); respawn = 0; } return; }
        const dx = tgt.x - hx, dy = tgt.y - hy, d = Math.hypot(dx, dy) || 1, sp = 0.3;
        vx += (dx / d * sp - vx) * Math.min(1, dt * 2.5); vy += (dy / d * sp - vy) * Math.min(1, dt * 2.5);
        hx += vx * dt; hy += vy * dt;
        if (Math.hypot(tgt.x - hx, tgt.y - hy) < 0.04) { tgt.on = false; len = Math.min(len + 1, 14); }
        sample += dt;
        if (sample > 0.03) { sample = 0; trail.unshift([hx, hy]); if (trail.length > 300) trail.length = 300; }
      },
      draw(c, cx, cy, R, a) {
        FOOD.forEach(f => { if (f.k > 0.02) dotA(c, cx + f.x * R, cy + f.y * R, 1.6, VB, a * 0.85 * f.k); });
        dotA(c, cx + hx * R, cy + hy * R, 2.8, VB, a);
        for (let s = 1; s < len; s++) {
          const p = trail[Math.min(trail.length - 1, s * 2)];
          if (p) dotA(c, cx + p[0] * R, cy + p[1] * R, 2.1 - s * 0.05, VA, a * (0.95 - s * 0.045));
        }
      }
    };
  }

  // Retrieval probe: a radar sweep finds planets, ranks the top five by cosine, and repeats.
  function ragA(rng) {
    const LOOP = 12, SWEEP = 0.72 * LOOP;
    const P = [];
    for (let i = 0; i < 8; i++) P.push({ a: (i / 8) * TAU + 0.35 * (rng() - 0.5), r: 0.35 + 0.5 * rng(), sc: 0.3 + 0.65 * rng(), f: 0, m: rng() * TAU });
    let T = 0;
    return {
      update(dt) {
        T += dt;
        const tt = T % LOOP, ang = Math.min(TAU, (tt / SWEEP) * TAU);
        P.forEach(p => {
          const show = tt < LOOP * 0.9 && ang >= p.a ? 1 : 0;
          p.f += (show - p.f) * Math.min(1, dt * 4);
        });
      },
      draw(c, cx, cy, R, a) {
        const tt = T % LOOP, ang = Math.min(TAU, (tt / SWEEP) * TAU);
        if (tt < SWEEP) {
          for (let k = 0; k < 6; k++) {
            const aa = ang - k * 0.05;
            lineC(c, cx, cy, cx + Math.cos(aa) * R, cy + Math.sin(aa) * R, vtone(VA), a * 0.5 * (1 - k / 6));
          }
        }
        P.forEach(p => {
          if (p.f < 0.02) return;
          const x = cx + Math.cos(p.a) * p.r * R, y = cy + Math.sin(p.a) * p.r * R;
          dotA(c, x, y, 2.4, VB, a * p.f);
          const m = p.m + T * 2.2;
          dotA(c, x + Math.cos(m) * 7, y + Math.sin(m) * 7, 1.2, VA, a * p.f * 0.8);
        });
        const h = clamp((tt - SWEEP) / 0.6) * clamp((LOOP * 0.92 - tt) / 0.6);
        if (h > 0.01) {
          P.slice().sort((x, y) => y.sc - x.sc).slice(0, 5).forEach(p => {
            const x = cx + Math.cos(p.a) * p.r * R, y = cy + Math.sin(p.a) * p.r * R;
            lineC(c, cx, cy, x, y, pal.accent, a * h * 0.6);
            txtC(c, p.sc.toFixed(2), x + 14, y - 8, pal.accent, a * h);
          });
        }
      }
    };
  }

  // Houses sort themselves by price into a skyline, a regression line draws through them, then they relax.
  function housingA(rng) {
    const N = 26, H = [];
    for (let i = 0; i < N; i++) {
      const f = 0.25 + 0.7 * rng(), ang = (i % 2) * Math.PI + 3.2 * f + 0.2 * (rng() - 0.5);
      H.push({ sx: f * Math.cos(ang), sy: f * Math.sin(ang), price: 0.15 + 0.85 * rng(), rank: 0 });
    }
    H.map((h, i) => i).sort((a, b) => H[a].price - H[b].price).forEach((hi, r) => { H[hi].rank = r; });
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    H.forEach(h => { const x = h.rank / (N - 1); sx += x; sy += h.price; sxx += x * x; sxy += x * h.price; });
    const m = (N * sxy - sx * sy) / (N * sxx - sx * sx), b = (sy - m * sx) / N;
    const LOOP = 13, BASE = 0.6;
    const colX = r => -0.85 + 1.7 * (r / (N - 1));
    const topY = h => BASE - h.price * 1.2;
    let T = 0;
    return {
      update(dt) { T += dt; },
      draw(c, cx, cy, R, a) {
        const tt = T % LOOP;
        lineC(c, cx + colX(0) * R, cy + BASE * R, cx + colX(1) * R, cy + BASE * R, pal.line, a * 0.12);
        H.forEach((h, i) => {
          const p = ease3((tt - 2 - i * 0.04) / 2.2) * (1 - ease3((tt - 10 - i * 0.03) / 2.2));
          const x = h.sx + (colX(h.rank) - h.sx) * p, y = h.sy + (topY(h) - h.sy) * p;
          dotA(c, cx + x * R, cy + y * R, 2.1, VA, a * (0.5 + 0.4 * p));
        });
        const f = ease3((tt - 5) / 3);
        if (f > 0) {
          const xe = colX(0) + (colX(1) - colX(0)) * f;
          lineC(c, cx + colX(0) * R, cy + (BASE - b * 1.2) * R, cx + xe * R, cy + (BASE - (m * f + b) * 1.2) * R, pal.accent, a * 0.9, 1.5);
        }
      }
    };
  }

  // Volunteer satellites on seven orbits; one drops out and a replacement flies in from the arms.
  function eagleA(rng) {
    const RINGS = 7, SL = 4, ringR = d => 0.18 + 0.1 * d;
    const spd = d => (d % 2 ? 1 : -1) * (0.05 + 0.04 * hsh(d + 5));
    const slotA = (d, s) => s * TAU / SL + hsh(d * 10 + s) * 0.5;
    const slots = [];
    for (let d = 0; d < RINGS; d++) for (let s = 0; s < SL; s++) slots.push({ d, s, drop: -1, rep: -1, flash: -9, p: 0 });
    let T = 0, nextDrop = 3.2;
    return {
      update(dt) {
        T += dt;
        if (T >= nextDrop) {
          const cand = slots.filter(sl => sl.drop < 0);
          if (cand.length) { const sl = cand[(rng() * cand.length) | 0]; sl.drop = T; sl.rep = T + 1.8; }
          nextDrop = T + 4.5;
        }
        slots.forEach(sl => {
          if (sl.rep >= 0 && T >= sl.rep) {
            sl.p = clamp((T - sl.rep) / 2.2);
            if (sl.p >= 1) { sl.drop = -1; sl.rep = -1; sl.flash = T; sl.p = 0; }
          }
        });
      },
      draw(c, cx, cy, R, a) {
        for (let d = 0; d < RINGS; d++) ringA(c, cx, cy, ringR(d) * R, pal.line, a * 0.07);
        slots.forEach(sl => {
          const ang = slotA(sl.d, sl.s) + spd(sl.d) * T, r0 = ringR(sl.d);
          if (sl.drop >= 0 && T < sl.drop + 1.6) {
            // dropping: dims and drifts outward
            const q = ease3((T - sl.drop) / 1.6), r = r0 + 0.2 * q;
            dotA(c, cx + Math.cos(ang) * r * R, cy + Math.sin(ang) * r * R, 2.2, VA, a * (1 - q));
          } else if (sl.drop >= 0) {
            // replacement: flies in from the arms and docks
            if (sl.rep >= 0 && T >= sl.rep) {
              const q = ease3(sl.p), fx = Math.cos(ang + 1.2) * 1.05, fy = Math.sin(ang + 1.2) * 1.05;
              const tx = Math.cos(ang) * r0, ty = Math.sin(ang) * r0;
              dotC(c, cx + (fx + (tx - fx) * q) * R, cy + (fy + (ty - fy) * q) * R, 2.6, pal.accent, a);
            }
          } else {
            const fl = T - sl.flash;
            dotA(c, cx + Math.cos(ang) * r0 * R, cy + Math.sin(ang) * r0 * R, 2.2, VA, a * 0.9);
            if (fl < 0.9) ringC(c, cx + Math.cos(ang) * r0 * R, cy + Math.sin(ang) * r0 * R, 3 + 6 * fl, pal.accent, a * (1 - fl / 0.9));
          }
        });
      }
    };
  }

  // A station with numbered docking bays; patient ships dock, one leaves, a bay frees, specialist bays take only specialists.
  function medihubA(rng) {
    const BAYS = 8, bayA = i => -Math.PI / 2 + i * TAU / BAYS, bayR = 0.3;
    const SPEC = i => i === 0 || i === 4;
    const bay = Array.from({ length: BAYS }, () => ({ ship: null, flash: -9 }));
    const ships = [];
    let T = 0, spawnAt = 1.0;
    return {
      update(dt) {
        T += dt;
        if (T >= spawnAt) {
          spawnAt = T + 1.5 + rng() * 0.8;
          const spec = rng() < 0.3;
          const free = [];
          for (let i = 0; i < BAYS; i++) if (!ships.some(s => s.bay === i && !s.gone) && (!spec || SPEC(i))) free.push(i);
          if (free.length) {
            const i = free[(rng() * free.length) | 0];
            ships.push({ spec, bay: i, t0: T, dock: T + 2.2, undock: T + 5.7 + rng() * 3, a0: rng() * TAU, gone: false });
          }
        }
        ships.forEach(s => {
          if (!s.gone && T >= s.dock && !bay[s.bay].ship) bay[s.bay].ship = s;
          if (!s.gone && T >= s.undock) { s.gone = true; bay[s.bay].ship = null; bay[s.bay].flash = T; }
        });
        for (let i = ships.length - 1; i >= 0; i--) if (ships[i].gone && T > ships[i].undock + 1.6) ships.splice(i, 1);
      },
      draw(c, cx, cy, R, a) {
        ringA(c, cx, cy, bayR * R, pal.line, a * 0.1);
        dotA(c, cx, cy, 3.2, VB, a * 0.9);
        for (let i = 0; i < BAYS; i++) {
          const ang = bayA(i), bx = cx + Math.cos(ang) * bayR * R, by = cy + Math.sin(ang) * bayR * R;
          const fl = T - bay[i].flash;
          if (fl < 1.2) ringC(c, bx, by, 6, pal.accent, a * (1 - fl / 1.2));
          dotA(c, bx, by, 2.2, SPEC(i) ? VB : VA, a * (bay[i].ship ? 0.9 : 0.25));
        }
        ships.forEach(s => {
          const sc = s.spec ? VB : VA;
          if (s.gone) {
            const q = clamp((T - s.undock) / 1.6), r = bayR + 0.8 * q, ang = bayA(s.bay);
            dotA(c, cx + Math.cos(ang) * r * R, cy + Math.sin(ang) * r * R, 2.2, sc, a * (1 - q));
          } else if (T >= s.t0 && T < s.dock) {
            const q = ease3((T - s.t0) / (s.dock - s.t0)), r = 1.05 + (bayR - 1.05) * q;
            const ang = s.a0 + (bayA(s.bay) - s.a0) * q;
            dotA(c, cx + Math.cos(ang) * r * R, cy + Math.sin(ang) * r * R, 2.4, sc, a);
          }
        });
      }
    };
  }

  // Fridge ingredients drift in, accrete and merge into a new small planet that settles into orbit.
  function arkprojectA(rng) {
    const LOOP = 14, N = 5, clr = 0.42;
    const ING = Array.from({ length: N }, (_, i) => ({ a0: rng() * TAU, r0: 0.95 + 0.1 * rng(), delay: 0.5 * i + rng() * 0.4, sz: 1.5 + 1.1 * rng(), col: i % 2 ? VB : VA }));
    let T = 0;
    return {
      update(dt) { T += dt; },
      draw(c, cx, cy, R, a) {
        const cyc = Math.floor(T / LOOP), tt = T % LOOP;
        const ca = hsh(cyc * 7 + 1) * TAU, rot = hsh(cyc * 3 + 2) * TAU;
        const clx = Math.cos(ca) * clr, cly = Math.sin(ca) * clr;
        let merged = 0;
        ING.forEach(m => {
          const p = ease3((tt - m.delay) / 3.2), th = m.a0 + rot;
          if (p >= 0.98) { merged++; return; }
          const sx = Math.cos(th) * m.r0, sy = Math.sin(th) * m.r0;
          dotA(c, cx + (sx + (clx - sx) * p) * R, cy + (sy + (cly - sy) * p) * R, m.sz * (1 - 0.3 * p), m.col, a * (0.5 + 0.5 * p));
        });
        if (merged > 0) dotA(c, cx + clx * R, cy + cly * R, 1 + 3 * merged / N, VB, a * 0.9);
        const pf = ease3((tt - 7.2) / 1.6);
        if (pf > 0.01) {
          const ang2 = ca + (tt - 7.2) * 0.25 * pf, rr = clr + (0.36 - clr) * pf;
          ringA(c, cx, cy, rr * R, pal.line, a * 0.06 * pf);
          const px = cx + Math.cos(ang2) * rr * R, py = cy + Math.sin(ang2) * rr * R;
          dotA(c, px, py, 3.6 * pf + 1.2, VB, a * pf);
          if (pf > 0.9) ringC(c, px, py, 7, pal.accent, a * 0.4 * (1 - (pf - 0.9) * 10));
        }
      }
    };
  }

  // Ingredient fleet: a scan beam ranks nine companies; probes go to the best four and dock, hold or bounce back.
  function jobA(rng) {
    const ST = 9, LOOP = 14, SCAN = 3.2, SR = 0.9;
    const st = Array.from({ length: ST }, (_, i) => ({ a: (i / ST) * TAU + 0.15 * (rng() - 0.5), sc: 0.25 + 0.75 * rng() }));
    const top = st.map((s, i) => i).sort((x, y) => st[y].sc - st[x].sc).slice(0, 4);
    const OUT = ['accept', 'pending', 'reject', 'accept'];
    let T = 0;
    return {
      update(dt) { T += dt; },
      draw(c, cx, cy, R, a) {
        const tt = T % LOOP, beam = Math.min(TAU, (tt / SCAN) * TAU);
        if (tt < SCAN) lineC(c, cx, cy, cx + Math.cos(beam) * SR * R, cy + Math.sin(beam) * SR * R, vtone(VA), a * 0.35);
        st.forEach(s => {
          const x = cx + Math.cos(s.a) * SR * R, y = cy + Math.sin(s.a) * SR * R;
          const seen = tt >= SCAN || beam >= s.a ? 1 : 0;
          dotA(c, x, y, 2.4, VA, a * (0.2 + 0.6 * s.sc * seen));
        });
        top.forEach((si, j) => {
          const s = st[si], L = SCAN + 0.5 + j * 0.8, fly = 1.8;
          if (tt < L) return;
          const x1 = cx + Math.cos(s.a) * SR * R, y1 = cy + Math.sin(s.a) * SR * R;
          const p = (tt - L) / fly;
          if (p < 1) { const q = ease3(p); dotA(c, cx + (x1 - cx) * q, cy + (y1 - cy) * q, 2.2, VB, a); return; }
          const since = tt - L - fly;
          if (OUT[j] === 'accept') {
            dotA(c, x1, y1, 2.2, VB, a);
            const q = clamp(since / 0.9);
            ringC(c, x1, y1, 3 + 10 * q, pal.accent, a * (1 - q));
          } else if (OUT[j] === 'pending') {
            const ang = s.a + since * 1.4;
            dotA(c, x1 + Math.cos(ang) * 9, y1 + Math.sin(ang) * 9, 2.2, VB, a);
          } else {
            const q = clamp(since / 1.4), e = ease3(q), perp = s.a + Math.PI / 2, bow = Math.sin(Math.PI * e) * 0.15 * R;
            dotA(c, x1 + (cx - x1) * e + Math.cos(perp) * bow, y1 + (cy - y1) * e + Math.sin(perp) * bow, 2.2, VA, a * (1 - q * 0.5));
          }
        });
      }
    };
  }

  // Two bookmakers' best odds drift; the implied probability ring overlaps past 100% until a real arbitrage appears.
  function arbA(rng) {
    const NB = 4, BASE = 1.92, AMP = 0.11, SR = 0.82;
    const pa = [], pb = [];
    for (let i = 0; i < NB; i++) { pa.push(rng() * TAU); pb.push(rng() * TAU); }
    const station = i => -Math.PI / 2 + i * TAU / NB + Math.PI / 4;
    const oa = [], ob = [];
    let T = 0, S = 1, bestA = 0, bestB = 0, iA = 0, iB = 0, arbOn = false, arbT0 = -9;
    const odds = () => {
      for (let i = 0; i < NB; i++) {
        oa[i] = BASE + AMP * Math.sin(0.35 * T + pa[i]);
        ob[i] = BASE + AMP * Math.sin(0.31 * T + pb[i]);
      }
      bestA = Math.max(...oa); bestB = Math.max(...ob);
      iA = oa.indexOf(bestA); iB = ob.indexOf(bestB);
      S = 1 / bestA + 1 / bestB;
    };
    odds();
    return {
      update(dt) {
        T += dt; odds();
        const arb = S < 1;
        if (arb && !arbOn) { arbOn = true; arbT0 = T; }
        if (!arb) arbOn = false;
      },
      draw(c, cx, cy, R, a) {
        const sx = i => cx + Math.cos(station(i)) * SR * R, sy = i => cy + Math.sin(station(i)) * SR * R;
        for (let i = 0; i < NB; i++) {
          const best = i === iA || i === iB;
          lineC(c, sx(i), sy(i), cx, cy, VA, a * (best ? 0.35 : 0.1));
          dotA(c, sx(i), sy(i), 2.4 + (best ? 1 : 0), VB, a * (0.5 + 0.4 * Math.sin(T * 2 + i)));
          txtC(c, oa[i].toFixed(2), sx(i) + Math.cos(station(i)) * 14, sy(i) + Math.sin(station(i)) * 14, vtone(VA), a * 0.7);
        }
        // Gauge: the combined implied probability 1/oddsA + 1/oddsB as an arc.
        const gr = 0.13 * R;
        ringC(c, cx, cy, gr, pal.line, a * 0.08);
        if (S >= 1) {
          arcC(c, cx, cy, gr, -Math.PI / 2, -Math.PI / 2 + TAU, VA, a * 0.8, 3);
          arcC(c, cx, cy, gr, -Math.PI / 2, -Math.PI / 2 + (S - 1) * TAU, VB, a * 0.9, 3);
        } else {
          arcC(c, cx, cy, gr, -Math.PI / 2, -Math.PI / 2 + S * TAU, VA, a * 0.8, 3);
          arcC(c, cx, cy, gr, -Math.PI / 2 + S * TAU, -Math.PI / 2 + TAU, pal.accent, a * (0.6 + 0.4 * Math.sin(T * 6)), 4);
          txtC(c, (S * 100).toFixed(1) + '%', cx, cy + gr + 12, pal.accent, a);
        }
        // Stake packets: out to the two books, back as one larger packet.
        const pq = T - arbT0;
        if (arbT0 > -9 && pq < 2.6) {
          if (pq < 1.2) {
            const q = ease3(pq / 1.2);
            [iA, iB].forEach(i => dotC(c, cx + (sx(i) - cx) * q, cy + (sy(i) - cy) * q, 2.6, pal.accent, a));
          } else {
            const q = ease3((pq - 1.2) / 1.4);
            dotC(c, sx(iA) + (cx - sx(iA)) * q, sy(iA) + (cy - sy(iA)) * q, 4.2, pal.accent, a);
          }
        }
      }
    };
  }

  // A book of stars: lines of text peel off, stream along an arm, become a waveform; chapter beacons; a voice ring.
  function audioA() {
    const BOOK = Math.PI * 0.82, BR = 0.75, SPI = 2.6, LN = 7, EVERY = 1.25, DUR = 4.2;
    const bx = Math.cos(BOOK) * BR, by = Math.sin(BOOK) * BR;
    const armAt = q => { const r = BR * (1 - q), th = BOOK + SPI * q; return [Math.cos(th) * r, Math.sin(th) * r]; };
    const waveAt = (j, t) => {
      const r = 0.12 + 0.55 * (j / (LN - 1)), th = BOOK + Math.PI, off = Math.sin(j * 0.9 + t * 5) * 0.05;
      return [Math.cos(th) * r + Math.cos(th + Math.PI / 2) * off, Math.sin(th) * r + Math.sin(th + Math.PI / 2) * off];
    };
    const pageEdge = [];
    for (let L = 0; L < 3; L++) {
      const ox = bx + L * 0.012, oy = by - L * 0.012, w = 0.13, h = 0.18;
      for (let i = 0; i < 6; i++) {
        const u = -w / 2 + w * i / 6, v = -h / 2 + h * i / 6;
        pageEdge.push([ox + u, oy - h / 2], [ox + u, oy + h / 2], [ox - w / 2, oy + v], [ox + w / 2, oy + v]);
      }
    }
    let T = 0, nextAt = 0.5, count = 0;
    const lines = [];
    return {
      update(dt) {
        T += dt;
        if (T >= nextAt) { lines.push({ t0: T, idx: count++ }); nextAt = T + EVERY; }
        while (lines.length && T - lines[0].t0 > DUR) lines.shift();
      },
      draw(c, cx, cy, R, a) {
        pageEdge.forEach(([x, y]) => dotA(c, cx + x * R, cy + y * R, 1.2, VA, a * 0.35));
        lines.forEach(L => {
          const p = (T - L.t0) / DUR;
          if (p < 0.8) {
            const [x, y] = armAt(ease3(p / 0.8));
            for (let j = 0; j < LN; j++) dotA(c, cx + (x + (j - 3) * 0.02) * R, cy + y * R, 1.4, VA, a * 0.8 * ease3(p / 0.15));
          } else {
            const m = ease3((p - 0.8) / 0.2), [x0, y0] = armAt(1);
            for (let j = 0; j < LN; j++) {
              const [wx, wy] = waveAt(j, T);
              const x = x0 + (j - 3) * 0.02 + (wx - (x0 + (j - 3) * 0.02)) * m, y = y0 + (wy - y0) * m;
              dotA(c, cx + x * R, cy + y * R, 1.5, VB, a * 0.9);
            }
          }
          if (L.idx % 5 === 0 && p < 0.25) dotC(c, cx + bx * R, cy + (by - 0.12) * R, 2.8, pal.accent, a * (1 - p / 0.25));
        });
        const active = Math.floor(T / 2.5) % 28;
        for (let i = 0; i < 28; i++) {
          const th = (i / 28) * TAU, on = i === active;
          dotA(c, cx + Math.cos(th) * 0.11 * R, cy + Math.sin(th) * 0.11 * R, on ? 2.2 : 1.1, on ? VB : VA, a * (on ? 1 : 0.22));
        }
      }
    };
  }

  const ANIM_BUILD = { snake: snakeA, rag: ragA, housing: housingA, 'ark-eagle': eagleA, medihub: medihubA, arkproject: arkprojectA, jobapply: jobA, arbitrage: arbA, audiobook: () => audioA() };
  const ANIMS = {};
  // API handed to each anims/<key>.js plugin. Screen-space; R is the galaxy radius in px.
  function makeApi(k, rng) {
    const g = GAL[k];
    let sx = new Float32Array(0), sy = new Float32Array(0), sb = new Uint8Array(0), sFrame = -1;
    const bucketOf = i => { let b = 0; while (b < 3 && i >= g.bStart[b + 1]) b++; return b; };
    return {
      key: k, rng, TAU, clamp, mix, rgba, ease3, mono: MONO,
      meta: META[k],
      chunks: CHUNKS.filter(c => c.project === k && c.text),
      dark: () => dark,
      accent: () => pal.accent,
      ink: INK,
      // Galaxy star colours, faint to bright (4 x [r,g,b]), already toned for the theme.
      colors: () => g.bcol.map(c => (dark ? c : mix(c, INK, 0.55))),
      // Halftone grid of the project image/logo, or null: { cols, rows, lum, al } (0..1 per cell).
      grid: () => GRID[k] || null,
      // This frame's screen positions of the galaxy's stars, innermost first (up to max).
      // Returns { n, x, y, b } where b is the brightness bucket 0..3.
      stars(max = 1500) {
        if (sFrame === frameNo && sx.length >= Math.min(max, g.inner.length)) return { n: Math.min(max, g.inner.length), x: sx, y: sy, b: sb };
        const n = Math.min(max, g.inner.length);
        if (sx.length < n) { sx = new Float32Array(n); sy = new Float32Array(n); sb = new Uint8Array(n); }
        for (let j = 0; j < n; j++) {
          const i = g.inner[j], q = 3 * i;
          if (toScreen(g, g.X[q], g.X[q + 1], g.X[q + 2])) { sx[j] = P[0]; sy[j] = P[1]; } else { sx[j] = -1e4; sy[j] = -1e4; }
          sb[j] = bucketOf(i);
        }
        sFrame = frameNo;
        return { n, x: sx, y: sy, b: sb };
      },
      dot: dotC, ring: ringC, arc: arcC, line: lineC, text: txtC
    };
  }

  // Built on first use. Reduced motion runs the animation forward once, then holds that static end state.
  function animFor(k) {
    if (k in ANIMS) return ANIMS[k];
    const rng = mulberry32(101 + ANIM_KEYS.indexOf(k) * 977);
    // Plugin in anims/<key>.js wins; otherwise the built-in version (if any).
    const plug = window.GALAXY_ANIMS[k];
    const an = plug ? plug(makeApi(k, rng)) : ANIM_BUILD[k] ? ANIM_BUILD[k](rng) : null;
    if (!an) return null;
    if (reduce) for (let i = 0; i < 300; i++) an.update(0.04);
    return (ANIMS[k] = an);
  }

  // ---------------------------------------------------------------------
  // LEVELS AND PANEL. Universe > galaxy (selected) > solar system (sun).
  // Opening a galaxy flies the camera in; closing flies back out.
  // ---------------------------------------------------------------------
  function openProject(k) {
    if (selected !== k) sun = -1;
    selected = k;
    fillPanel(k);
    detail.classList.add('open');
    detail.scrollTop = 0;
  }
  function closeProject() {
    selected = null;
    sun = -1;
    detail.classList.remove('open');
  }
  function enterSun(i) { if (selected) sun = i; }
  function exitSun() { sun = -1; }
  // Back and Esc go up one level.
  function goUp() {
    if (sun >= 0) exitSun();
    else if (selected) closeProject();
  }
  // Arrow keys at the solar level step between the galaxy's chunk stars.
  function stepSun(d) {
    const idx = GAL[selected].chunkIdx;
    const j = idx.indexOf(sun);
    sun = idx[(j + d + idx.length) % idx.length];
  }
  function fillPanel(k) {
    const m = META[k];
    dCat.textContent = m.cat;
    dSub.textContent = m.sub || '';
    dSub.hidden = !m.sub;
    dTitle.textContent = m.title;
    dStats.innerHTML = m.stats.map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`).join('');
    dStats.hidden = !m.stats.length;
    dDesc.textContent = m.desc;
    dTech.innerHTML = m.tech.map(x => `<li>${x}</li>`).join('');
    dLinks.innerHTML = m.links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join('');
    scrubWrap.hidden = !m.scrub;
    if (m.scrub) {
      scrubIdx = 30;
      drawScrub();
    }
  }
  backBtn.addEventListener('click', goUp);
  window.addEventListener('keydown', e => {
    const typing = e.target === qInput;
    if ((e.key === 'p' || e.key === 'P') && selected && !typing) { portraitOn = !portraitOn; return; }
    if (!selected) return;
    if (e.key === 'Escape') { if (!typing) goUp(); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target !== scCanvas && !typing) {
      e.preventDefault();
      const step = e.key === 'ArrowRight' ? 1 : -1;
      if (sun >= 0) stepSun(step);
      else openProject(KEYS[(KEYS.indexOf(selected) + step + KEYS.length) % KEYS.length]);
    }
  });

  // Illustrative win-probability series (31 samples over 30 minutes).
  const SERIES = (() => {
    const r = mulberry32(42);
    const out = [];
    let p = 0.5;
    for (let i = 0; i <= 60; i++) {
      out.push(p);
      p += (r() - 0.5) * 0.14 + (i > 40 ? 0.012 : -0.002);
      p = clamp(p, 0.03, 0.97);
    }
    return out;
  })();

  // ---------------------------------------------------------------------
  // WIN-PROBABILITY SCRUBBER (LeagueVODreview)
  // ---------------------------------------------------------------------
  let scrubIdx = 30;
  let scrubDrag = false;
  function drawScrub() {
    const w = scCanvas.clientWidth, h = scCanvas.clientHeight;
    if (!w || !h) return;
    scCanvas.width = Math.round(w * DPR);
    scCanvas.height = Math.round(h * DPR);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, w, h);

    const top = 26, bot = h - 8;
    const X = i => (i / (SERIES.length - 1)) * w;
    const Y = p => top + (1 - p) * (bot - top);

    sctx.setLineDash([2, 3]);
    sctx.strokeStyle = rgba(pal.line, 0.22);
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, Y(0.5)); sctx.lineTo(w, Y(0.5)); sctx.stroke();
    sctx.setLineDash([]);

    sctx.strokeStyle = rgba(pal.line, 0.85);
    sctx.lineWidth = 1.5;
    sctx.lineJoin = 'round';
    sctx.beginPath();
    SERIES.forEach((p, i) => (i ? sctx.lineTo(X(i), Y(p)) : sctx.moveTo(X(i), Y(p))));
    sctx.stroke();

    const mx = X(scrubIdx), my = Y(SERIES[scrubIdx]);
    sctx.lineWidth = 1;
    sctx.strokeStyle = rgba(pal.line, 0.25);
    sctx.beginPath(); sctx.moveTo(mx, top - 6); sctx.lineTo(mx, bot); sctx.stroke();
    sctx.fillStyle = rgba(pal.accent, 1);
    sctx.beginPath(); sctx.arc(mx, my, 4, 0, Math.PI * 2); sctx.fill();

    sctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = rgba(pal.line, 0.6);
    sctx.textBaseline = 'top';
    sctx.textAlign = 'left';
    sctx.fillText(Math.round(SERIES[scrubIdx] * 100) + '%', 0, 2);
    sctx.textAlign = 'right';
    sctx.fillText('min ' + (scrubIdx / 2).toFixed(1), w, 2);
  }
  function setScrubFromEvent(e) {
    const r = scCanvas.getBoundingClientRect();
    const f = clamp((e.clientX - r.left) / r.width);
    scrubIdx = Math.round(f * (SERIES.length - 1));
    drawScrub();
  }
  scCanvas.addEventListener('pointerdown', e => {
    scrubDrag = true;
    scCanvas.setPointerCapture(e.pointerId);
    setScrubFromEvent(e);
  });
  scCanvas.addEventListener('pointermove', e => { if (scrubDrag) setScrubFromEvent(e); });
  const endScrubDrag = () => { scrubDrag = false; };
  scCanvas.addEventListener('pointerup', endScrubDrag);
  scCanvas.addEventListener('pointercancel', endScrubDrag);
  scCanvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      scrubIdx = clamp(scrubIdx + (e.key === 'ArrowRight' ? 1 : -1), 0, SERIES.length - 1);
      drawScrub();
    }
  });

  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // DRAW
  // ---------------------------------------------------------------------
  const toneC = c => (dark ? c : mix(c, INK, 0.55));
  // Screen position of a world point, or null if it is behind the camera.
  function pr(x, y, z) { return project(x, y, z) ? [P[0], P[1]] : null; }
  // Galaxy-local point to world.
  function localToWorld(g, loc, out) {
    for (let a = 0; a < 3; a++) out[a] = g.core[a] + loc[0] * g.A[a] + loc[1] * g.B[a] + loc[2] * g.N[a];
    return out;
  }
  function wrapLines(txt, maxW) {
    const words = txt.split(' '), lines = [];
    let ln = '';
    words.forEach(wd => {
      const tryLn = ln ? ln + ' ' + wd : wd;
      if (ctx.measureText(tryLn).width > maxW && ln) { lines.push(ln); ln = wd; } else ln = tryLn;
    });
    lines.push(ln);
    return lines;
  }

  // Deep field: cached offscreen canvas, redrawn only on a visible rotation step.
  function drawDeep() {
    const key = Math.round(angY * 50) + '|' + Math.round(angX * 50) + '|' + W + '|' + H + '|' + dark + '|' + cv.width;
    if (key !== deepKey) { deepKey = key; renderDeep(); }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1 - 0.35 * zt;
    ctx.drawImage(deepC, 0, 0);
    ctx.restore();
  }

  // Thin axes through the scene origin. Hidden once you are inside a galaxy.
  function drawAxes(al) {
    if (al < 0.005) return;
    ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']].forEach(([ax, ay, az, nm]) => {
      const a = pr(-ax * 3.2, -ay * 3.2, -az * 3.2), b = pr(ax * 3.2, ay * 3.2, az * 3.2);
      const l = pr(ax * 3.0, ay * 3.0, az * 3.0);
      if (!a || !b || !l) return;
      ctx.strokeStyle = rgba(pal.line, 0.07 * al);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      ctx.fillStyle = rgba(pal.line, 0.25 * al);
      ctx.fillText(nm, l[0], l[1]);
    });
  }

  // Arrow from o to e, with a small head at e.
  function arrow(o, e, col, al) {
    const dx = e[0] - o[0], dy = e[1] - o[1], L = Math.hypot(dx, dy);
    if (L < 8) return;
    const ux = dx / L, uy = dy / L;
    ctx.strokeStyle = rgba(col, al);
    ctx.beginPath();
    ctx.moveTo(o[0], o[1]); ctx.lineTo(e[0], e[1]);
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[0] - ux * 6 - uy * 3, e[1] - uy * 6 + ux * 3);
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[0] - ux * 6 + uy * 3, e[1] - uy * 6 - ux * 3);
    ctx.stroke();
  }

  function drawGalaxy(g) {
    if (!g.vis) return;
    const ga = guard(g.alpha, 'galaxy alpha');
    if (ga < 0.01) return;
    const tint = c => toneC(mix(c, pal.accent, g.acc * 0.35));
    const bcol = g.bcol.map(tint);
    const BA = [0.28, 0.5, 0.75, 0.92];
    const BS = [0.9, 1.0, 1.35, 1.8];
    // Level of detail: fewer stars when the galaxy is small on screen.
    const target = clamp(g.px * g.px * 0.5, 120, g.Ns);
    const stride = Math.max(1, Math.round(g.Ns / target));
    const dStride = Math.max(1, Math.round(g.nDust / Math.max(20, target * 0.25)));
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';

    // Soft core glow (dark theme only).
    if (dark && g.px > 3) {
      const rad = g.px * 0.5;
      const grd = ctx.createRadialGradient(g.sx, g.sy, 0, g.sx, g.sy, rad);
      grd.addColorStop(0, rgba(bcol[3], 0.5 * ga));
      grd.addColorStop(0.35, rgba(bcol[3], 0.14 * ga));
      grd.addColorStop(1, rgba(bcol[3], 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(g.sx, g.sy, rad, 0, TAU); ctx.fill();
    }
    // While the portrait is formed, the spiral behind it dims.
    const anD = g.key === selected && ANIMS[g.key] ? clamp(ANIMS[g.key].spiralDim || 0) : 0;
    const spir = ga * (1 - 0.7 * Math.min(1, g.fAvg * 2)) * (1 - anD);

    // Halo behind a forming portrait, centred on it.
    if (dark && g.fAvg > 0.02) {
      const rad = Math.max(PWd, PHd) * 0.62;
      const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, rad);
      grd.addColorStop(0, rgba(bcol[3], 0.16 * g.fAvg * ga));
      grd.addColorStop(0.5, rgba(bcol[3], 0.05 * g.fAvg * ga));
      grd.addColorStop(1, rgba(bcol[3], 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(CX, CY, rad, 0, TAU); ctx.fill();
    }

    // Dust lanes, one batched fill.
    ctx.fillStyle = rgba(pal.dust, pal.dustA * spir);
    for (let i = 0; i < g.nDust; i += dStride) {
      if (!toScreen(g, g.D[3 * i], g.D[3 * i + 1], g.D[3 * i + 2])) continue;
      ctx.fillRect(P[0], P[1], 1.2, 1.2);
    }

    // Arm, bulge and halo stars, one fill per brightness bucket.
    // Stars forming the portrait are drawn in their own pass below.
    const X = g.X;
    const hasP = g.fe.length > 0;
    for (let b = 0; b < 4; b++) {
      ctx.fillStyle = rgba(bcol[b], BA[b] * spir * (dark ? 1 : 0.9));
      const s1 = g.bStart[b + 1];
      for (let i = g.bStart[b]; i < s1; i += stride) {
        if (hasP && g.pslot[i] >= 0 && g.fe[g.pslot[i]] > 0.02) continue;
        const q = 3 * i;
        if (!toScreen(g, X[q], X[q + 1], X[q + 2])) continue;
        const sx = P[0], sy = P[1];
        if (sx < -2 || sx > W + 2 || sy < -2 || sy > H + 2) continue;
        const s = BS[b] * clamp(P[2], 0.7, 1.4);
        ctx.fillRect(sx, sy, s, s);
      }
    }

    // Portrait dots: each stolen star swirls from the spiral onto its cell of the
    // flat, camera-facing grid. Round dots sized by luminance; batched by formation level.
    if (hasP && g.fAvg > 0.0005 && PWd > 0) {
      const cw = PWd / g.cols, ch = PHd / g.rows;
      const batch = [[], [], [], [], []];   // [x, y, r] triples, index = formation level 1..4
      for (let s = 0; s < g.fe.length; s++) {
        const fe = g.fe[s];
        if (fe <= 0.02) continue;
        const q = 3 * g.pidx[s];
        if (!toScreen(g, X[q], X[q + 1], X[q + 2])) continue;
        const ex = CX + g.tu[s] * PWd, ey = CY + g.tv[s] * PHd;
        let x = P[0] + (ex - P[0]) * fe, y = P[1] + (ey - P[1]) * fe;
        // A swirl around the portrait centre while it forms.
        const ang = 0.9 * Math.sin(Math.PI * fe), rx = x - CX, ry = y - CY;
        x = CX + rx * Math.cos(ang) - ry * Math.sin(ang);
        y = CY + rx * Math.sin(ang) + ry * Math.cos(ang);
        const r = Math.max(0.5, 0.5 * Math.min(cw, ch) * (0.2 + 0.8 * g.sv[s]));
        const lvl = Math.min(4, Math.max(1, Math.ceil(fe * 4)));
        batch[lvl].push(x, y, r);
      }
      // Log the formed portrait's on-screen box once, so it can be checked.
      const b4 = batch[4];
      if (!g.bboxLogged && g.fAvg > 0.98 && b4.length) {
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (let j = 0; j < b4.length; j += 3) {
          x0 = Math.min(x0, b4[j]); x1 = Math.max(x1, b4[j]);
          y0 = Math.min(y0, b4[j + 1]); y1 = Math.max(y1, b4[j + 1]);
        }
        g.bboxLogged = true;
        console.log('galaxy.html: portrait ' + g.key + ' on screen x ' + x0.toFixed(0) + '..' + x1.toFixed(0) +
          ', y ' + y0.toFixed(0) + '..' + y1.toFixed(0) + ' (viewport ' + W + 'x' + H + '), ' + (b4.length / 3) + ' dots; grid x ' +
          (CX - PWd / 2).toFixed(0) + '..' + (CX + PWd / 2).toFixed(0) + ', y ' + (CY - PHd / 2).toFixed(0) + '..' + (CY + PHd / 2).toFixed(0));
      }
      ctx.fillStyle = rgba(bcol[3], 1);
      for (let lvl = 1; lvl <= 4; lvl++) {
        const bt = batch[lvl];
        if (!bt.length) continue;
        ctx.globalAlpha = ga * lvl / 4;
        ctx.beginPath();
        for (let j = 0; j < bt.length; j += 3) {
          ctx.moveTo(bt[j] + bt[j + 2], bt[j + 1]);
          ctx.arc(bt[j], bt[j + 1], bt[j + 2], 0, TAU);
        }
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Chunks: slightly larger, distinct stars on the arms. Hover and search hits take the accent.
    const cFill = rgba(tint(g.ccol), 0.95 * ga);
    g.chunkIdx.forEach(i => {
      if (i === sun) return;   // the sun is drawn over its own star
      const c = CHUNKS[i];
      if (!toScreen(g, c.local[0], c.local[1], c.local[2])) return;
      const hot = hoverIdx === i;
      const hitStar = !hot && qT > 0.01 && hitSet.has(i);
      ctx.fillStyle = hot || hitStar ? rgba(pal.accent, ga) : cFill;
      const r = (hot ? 2.6 : hitStar ? 2.2 : 1.5) * clamp(P[2], 0.7, 1.4);
      ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, TAU); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
  }

  // The solar system of the open chunk: a sun, orbits, planets and a caption.
  function drawSolar(g, c, planets, hovP) {
    const k = zs;
    const sx = sunSX, sy = sunSY;
    const Rs = Math.min(W, H) * 0.022;
    const sunC = toneC(g.bcol[3]);
    const pc = toneC(g.ccol);
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    ctx.lineWidth = 1;
    let maxB = 0;
    planets.forEach(p => {
      maxB = Math.max(maxB, p.b);
      ctx.strokeStyle = rgba(pal.line, 0.1 * k);
      ctx.beginPath(); ctx.ellipse(sx, sy, p.a, p.b, p.tilt, 0, TAU); ctx.stroke();
    });
    if (dark) {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, Rs * 6);
      grd.addColorStop(0, rgba(sunC, 0.45 * k));
      grd.addColorStop(0.25, rgba(sunC, 0.12 * k));
      grd.addColorStop(1, rgba(sunC, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, Rs * 6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = rgba(sunC, k);
    ctx.beginPath(); ctx.arc(sx, sy, Rs, 0, TAU); ctx.fill();
    planets.forEach((p, j) => {
      const hot = j === hovP;
      ctx.fillStyle = hot ? rgba(pal.accent, k) : rgba(pc, 0.9 * k);
      ctx.beginPath(); ctx.arc(p.x, p.y, hot ? p.r * 1.6 : p.r, 0, TAU); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';

    ctx.textBaseline = 'alphabetic';
    if (hovP >= 0) {
      const p = planets[hovP];
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = rgba(pal.accent, k);
      ctx.fillText(p.term, p.x + 10, p.y - 8);
    }
    // Caption: the chunk text, small, below the orbits.
    ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(pal.line, 0.7 * k);
    wrapLines(c.text, 340).slice(0, 4).forEach((l, n) => ctx.fillText(l, sx, sy + maxB + 30 + n * 16));
  }

  // ---------------------------------------------------------------------
  // FRAME
  // ---------------------------------------------------------------------
  // Test mode: ?open=<key> flies straight into a galaxy; ?dtmax=0.7 lets time advance
  // properly when the browser throttles frames (automated, unfocused windows).
  const QS = new URLSearchParams(location.search);
  const DTMAX = +QS.get('dtmax') || 0.05;
  let frameNo = 0;
  function frame(now) {
    frameNo++;
    const dt = Math.min(DTMAX, (now - last) / 1000);
    last = now;
    t += dt;
    const elapsed = (now - t0) / 1000;
    const sm = rate => (reduce ? 1 : 1 - Math.exp(-dt * rate));

    // Transitions: fly in/out to a galaxy, then to its solar system; panel; spin.
    spin += ((selected ? 0.12 : 1) - spin) * sm(3);
    zt += ((selected ? 1 : 0) - zt) * sm(3.5);
    zs += ((sun >= 0 ? 1 : 0) - zs) * sm(4);
    panelT += ((selected ? 1 : 0) - panelT) * sm(5);

    // Scene rotation: slow spin, drag inertia, slight tilt sway.
    if (!reduce && !drag.on) angY += dt * 0.07 * spin;
    if (!drag.on) {
      angY += velY * dt; userTilt = clamp(userTilt + velX * dt, -1.2, 1.2);
      const f = Math.exp(-dt * 3); velY *= f; velX *= f;
    }
    angX = (reduce ? 0.22 : 0.22 + 0.05 * Math.sin(t * 0.11)) + userTilt;
    const offX = reduce ? 0 : 0.02 * Math.sin(t * 0.19);
    const offY = reduce ? 0 : 0.015 * Math.sin(t * 0.13 + 1.1);
    cA = Math.cos(angY); sA = Math.sin(angY);
    cB = Math.cos(angX); sB = Math.sin(angX);

    // Each galaxy's spin basis and fade-in.
    KEYS.forEach(k => {
      const g = GAL[k];
      const sp = g.phase + (reduce ? 0 : g.omega * t);
      const cs = Math.cos(sp), sn = Math.sin(sp);
      for (let a = 0; a < 3; a++) {
        g.A[a] = cs * g.E1[a] + sn * g.E2[a];
        g.B[a] = cs * g.E2[a] - sn * g.E1[a];
      }
      g.gi = reduce ? 1 : easeOut(clamp((elapsed - g.delay) / INTRO_S));
    });

    // Camera target: the sun if one is open, else the selected galaxy's core, else the origin.
    let ft = ZERO;
    if (selected) {
      const g = GAL[selected];
      ft = sun >= 0 ? localToWorld(g, CHUNKS[sun].local, sunW) : g.core;
    }
    for (let a = 0; a < 3; a++) focus[a] += (ft[a] - focus[a]) * sm(sun >= 0 ? 4 : 3.5);
    rotPoint(focus, FR);

    // Home: the centre of the free area left of the panel (desktop), or the upper part (mobile).
    // The camera focus lands exactly here, so the galaxy and its portrait sit centred.
    const desk = W > 720;
    const homeY = desk ? (96 + H) / 2 : (96 + H * 0.44) / 2;
    // Zoom so a flown-into galaxy fills about 72% of the smaller side, but never past the
    // header or the bottom edge (the room above and below the core).
    const room = Math.min(homeY - 96, H - homeY) - 16;
    const zCap = selected ? room / (GAL[selected].R * OVER * Math.min(W, H)) : Infinity;
    const zTarget = selected ? Math.max(3, Math.min(clamp(0.36 / (GAL[selected].R * OVER), 6, 22), zCap)) : 1;
    SC = Math.min(W, H) * OVER * userZoom * (1 + (zTarget - 1) * zt) * (1 + 3 * zs);
    const sway = 1 - zt;   // no drift once inside a galaxy
    const homeX = desk ? (W - 400) / 2 : W / 2;
    CX = W / 2 + (homeX - W / 2) * panelT + offX * SC * sway;
    CY = H / 2 + (homeY - H / 2) * panelT - offY * SC * sway;

    // Galaxy screen centres and on-screen test.
    KEYS.forEach(k => {
      const g = GAL[k];
      const ok = project(g.core[0], g.core[1], g.core[2]);
      if (ok) { g.sx = P[0]; g.sy = P[1]; g.k = P[2]; g.px = g.R * P[2] * SC; }
      g.vis = ok && g.k < 4 && g.px > 0.6 && g.gi > 0.01 &&
        Math.abs(g.sx - W / 2) < W / 2 + g.px && Math.abs(g.sy - H / 2) < H / 2 + g.px;
    });

    // Every chunk star's screen position (hover, search hits, arrows).
    CHUNKS.forEach(c => {
      const g = GAL[c.project];
      c.vis = g.gi > 0.01 && toScreen(g, c.local[0], c.local[1], c.local[2]);
      if (c.vis) { c.sx = P[0]; c.sy = P[1]; }
    });

    // Halftone portrait: a flat, camera-facing grid on the home centre, about 45% of the
    // viewport wide on desktop. Formed for the selected galaxy at the galaxy level, unless toggled off.
    {
      const sg = selected ? GAL[selected] : null;
      const cols = sg && sg.cols ? sg.cols : 60, rows = sg && sg.rows ? sg.rows : 38;
      const maxH = desk ? H - 180 : H * 0.44 - 150;
      PWd = Math.min(desk ? 0.45 * W : 0.8 * W, maxH * cols / rows);
      PHd = PWd * rows / cols;
    }
    KEYS.forEach(k => {
      const g = GAL[k];
      if (k === selected && g.pTheme !== dark) buildPortrait(k);
      updatePortrait(g, dt, false);
    });

    // Solar system: planets for the open chunk.
    let planets = [];
    hoverPlanet = -1;
    if (selected && sun >= 0 && zs > 0.01) {
      const sp = pr(sunW[0], sunW[1], sunW[2]);
      if (sp) {
        sunSX = sp[0]; sunSY = sp[1];
        planets = solarPlanets(CHUNKS[sun], sunSX, sunSY, Math.min(W, H));
        if (pointer.on) {
          planets.forEach((p, j) => {
            if (hoverPlanet < 0 && Math.hypot(p.x - pointer.x, p.y - pointer.y) < p.r + 7) hoverPlanet = j;
          });
        }
      }
    }

    // Hover: galaxy, search hit or chunk; a planet when at the solar level.
    const hit = pointer.on && hoverPlanet < 0 ? pick(pointer.x, pointer.y, pointer.touch ? 22 : 10) : null;
    hovered = hit ? hit.k : (hoverPlanet >= 0 ? selected : null);
    hoverIdx = hit ? hit.i : -1;
    cv.classList.toggle('pointer', !!hit || hoverPlanet >= 0);
    // A hover peek beside a galaxy in the overview only.
    const peekOn = hovered && !selected && !drag.on;
    showPeek(peekOn ? hovered : null);
    if (peekOn) placePeek(GAL[hovered].sx, GAL[hovered].sy);

    const active = hovered || selected;
    const querying = !active && hits.length > 0;

    // Query marker eases toward the score-weighted centre of its hit galaxies.
    qT += ((querying ? 1 : 0) - qT) * sm(6);
    if (hits.length) {
      const tw = hits.reduce((s, h) => s + h.score, 0);
      const tgtW = [0, 0, 0], tgtE = [0, 0, 0];
      hits.forEach(h => {
        const c = CHUNKS[h.i], w = h.score / tw, core = GAL[c.project].core;
        for (let a = 0; a < 3; a++) { tgtW[a] += core[a] * w; tgtE[a] += c.pos[a] * w; }
      });
      for (let a = 0; a < 3; a++) {
        qWorld[a] += (tgtW[a] - qWorld[a]) * sm(6);
        qEmb[a] += (tgtE[a] - qEmb[a]) * sm(6);
      }
    }

    // Per-galaxy eases. Every field here is initialised in part4; guard() catches the rest.
    KEYS.forEach(k => {
      const g = GAL[k];
      const hitK = querying && hitGal.has(k);
      const dimT = k === selected && sun >= 0 ? 0.5
        : (active && active !== k) || (querying && !hitK) ? 1 : 0;
      g.acc += ((active === k ? 1 : 0) - g.acc) * sm(12);
      g.dim += (dimT - g.dim) * sm(10);
      g.lit += ((hitK ? 1 : 0) - g.lit) * sm(6);
      // Inside a galaxy the other project galaxies fade out (the deep field stays).
      const others = k === selected ? 1 : 1 - 0.97 * zt;
      g.alpha = guard(g.gi * (1 - 0.6 * g.dim) * (1 + 0.5 * g.lit) * others, 'galaxy alpha');
    });
    updateCrumbs();

    // Draw: deep field, axes, arrows, galaxies, solar system, hover lines, query, labels.
    ctx.clearRect(0, 0, W, H);
    drawDeep();
    // Axes and origin arrows belong to the universe level: hidden inside a galaxy.
    drawAxes(selected ? 0 : 0.09 * (1 - zt));

    const O = pr(0, 0, 0);
    ctx.lineWidth = 1;
    if (O && active && !selected) {
      const g = GAL[active];
      if (g.vis) {
        const dx = g.sx - O[0], dy = g.sy - O[1], L = Math.hypot(dx, dy) || 1;
        const end = [g.sx - dx / L * (g.px + 2), g.sy - dy / L * (g.px + 2)];
        arrow(O, end, pal.accent, 0.5 * g.gi);
      }
    }
    if (O && qT > 0.01 && sun < 0) {
      hits.forEach(h => {
        const c = CHUNKS[h.i];
        if (c.vis) arrow(O, [c.sx, c.sy], pal.accent, 0.28 * qT);
      });
    }

    KEYS.filter(k => GAL[k].vis)
      .sort((a, b) => GAL[a].k - GAL[b].k)
      .forEach(k => drawGalaxy(GAL[k]));

    // In-galaxy animation, in place of the portrait for these projects. Time runs only inside.
    if (selected && ANIM_KEYS.includes(selected) && zt > 0.02) {
      const an = animFor(selected);
      if (an) {
        if (!reduce) an.update(dt * (zt > 0.9 ? 1 : 0));
        an.draw(ctx, CX, CY, GAL[selected].R * SC, zt * (1 - zs));
      }
    }

    if (planets.length) drawSolar(GAL[selected], CHUNKS[sun], planets, hoverPlanet);

    const mono = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';

    // Hover: faint lines to the 2 nearest galaxies, each with a cosine.
    if (hovered && !selected) {
      const g = GAL[hovered];
      if (g.vis) {
        nearProjects[hovered].forEach(nk => {
          const n2 = GAL[nk];
          if (!n2.vis) return;
          ctx.strokeStyle = rgba(pal.accent, 0.35 * g.gi);
          ctx.beginPath(); ctx.moveTo(g.sx, g.sy); ctx.lineTo(n2.sx, n2.sy); ctx.stroke();
          ctx.fillStyle = rgba(pal.accent, 0.85 * g.gi);
          ctx.fillText(cosine(EMB[hovered], EMB[nk]).toFixed(2), (g.sx + n2.sx) / 2, (g.sy + n2.sy) / 2 - 8);
        });
      }
    }

    // Query marker in the void, with lines and cosines to its hit stars.
    if (qT > 0.01 && hits.length && sun < 0) {
      const q = pr(qWorld[0], qWorld[1], qWorld[2]);
      if (q) {
        hits.forEach(h => {
          const c = CHUNKS[h.i];
          if (!c.vis) return;
          ctx.strokeStyle = rgba(pal.accent, 0.5 * qT);
          ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(c.sx, c.sy); ctx.stroke();
          ctx.fillStyle = rgba(pal.accent, 0.85 * qT);
          ctx.fillText(cosine(qEmb, c.pos).toFixed(2), (q[0] + c.sx) / 2, (q[1] + c.sy) / 2 - 8);
        });
        ctx.strokeStyle = rgba(pal.accent, qT);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, TAU); ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    // Hover label at the galaxy and galaxy levels: project name, plus the chunk text over a chunk.
    if (hovered && sun < 0) {
      const inside = hoverIdx >= 0;
      const ax = inside ? CHUNKS[hoverIdx].sx : GAL[hovered].sx;
      const ay = inside ? CHUNKS[hoverIdx].sy : GAL[hovered].sy;
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      const label = META[hovered].label;
      const w = ctx.measureText(label).width;
      let lx = ax + 12;
      if (lx + w > W - 12) lx = ax - 12 - w;
      ctx.fillStyle = rgba(pal.line, 0.95);
      ctx.fillText(label, lx, ay - 12);
      const txt = inside ? CHUNKS[hoverIdx].text : '';
      if (txt) {
        ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const lines = wrapLines(txt, 260);
        const tw = Math.max(...lines.map(l => ctx.measureText(l).width));
        let tx = ax + 12;
        if (tx + tw > W - 12) tx = ax - 12 - tw;
        ctx.fillStyle = rgba(pal.line, 0.6);
        lines.slice(0, 4).forEach((l, n) => ctx.fillText(l, tx, ay + 8 + n * 16));
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------------
  window.addEventListener('resize', () => {
    resize();
    if (selected) drawScrub();
  });
  KEYS.forEach(loadPortrait);
  if (QS.get('open') && META[QS.get('open')]) setTimeout(() => openProject(QS.get('open')), 100);
  window.__galaxy = { open: openProject, close: closeProject };
  const stored = storedTheme();
  setTheme(stored ? stored === 'dark' : darkMq.matches, false);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
