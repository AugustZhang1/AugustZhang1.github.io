    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
  }
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a).toFixed(3)})`;
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

  const PAL = {
    light: { dot: [93, 111, 143], accent: [224, 96, 63], line: [22, 28, 42], edge: 0.12 },
    dark:  { dot: [143, 163, 196], accent: [255, 138, 102], line: [201, 212, 230], edge: 0.14 }
  };

  // ---------------------------------------------------------------------
  // INDEXES: members per project, centroids, neighbours, hairline edges
  // ---------------------------------------------------------------------
  // Tighten: pull each chunk toward its project centre, and projects toward the middle.
  (() => {
    const acc = {};
    CHUNKS.forEach(c => {
      const a = acc[c.project] || (acc[c.project] = [0, 0, 0, 0]);
      a[0] += c.pos[0]; a[1] += c.pos[1]; a[2] += c.pos[2]; a[3]++;
    });
    // Spread project centres through the volume (not on a hollow ring):
    // keep each direction, remap distance from centre by rank.
    const keys = Object.keys(acc);
    const cen = {};
    keys.forEach(k => { cen[k] = acc[k].slice(0, 3).map(v => v / acc[k][3]); });
    const len = v => Math.hypot(v[0], v[1], v[2]) || 1;
    keys.slice().sort((a, b) => len(cen[a]) - len(cen[b])).forEach((k, i, arr) => {
      const r = 0.12 + 0.6 * Math.pow(i / (arr.length - 1), 0.8);
      const l = len(cen[k]);
      cen[k] = cen[k].map(v => (v / l) * r);
    });

    CHUNKS.forEach(c => {
      const a = acc[c.project];
      const m = a.slice(0, 3).map(v => v / a[3]);
      let off = c.pos.map((v, i) => v - m[i]);
      const ol = len(off);
      const want = 0.07 + 0.05 * rnd();
      off = ol < 1e-3 ? [gauss(), gauss(), gauss()].map(v => v * want * 0.6) : off.map(v => (v / ol) * want);
      c.pos = cen[c.project].map((v, i) => v + off[i]);
    });

    keys.forEach(k => CHUNKS.push({ id: k + '-main', project: k, main: true, text: '', pos: cen[k] }));

  // Point colour by domain of work.

    sinai: 'web', medihub: 'web', 'ark-eagle': 'web', arkproject: 'web',
    minecraft: 'gen', audiobook: 'gen'

  const DOM_COL = {
    dark:  { ml: [157, 180, 255], rt: [127, 209, 199], web: [199, 168, 240], gen: [232, 210, 154] },
    light: { ml: [77, 99, 184],   rt: [47, 138, 128],  web: [125, 91, 176],  gen: [165, 131, 47] }
  };
  const dotCol = k => DOM_COL[root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'][DOMAIN[k]] || pal.dot;

  const KEYS = Object.keys(META);
  const N = CHUNKS.length;
  const members = {};
  KEYS.forEach(k => { members[k] = []; });
  CHUNKS.forEach((c, i) => members[c.project].push(i));

  const centroid = {};
  KEYS.forEach(k => {
    const s = [0, 0, 0];
    members[k].forEach(i => { for (let a = 0; a < 3; a++) s[a] += CHUNKS[i].pos[a]; });
    centroid[k] = s.map(v => v / members[k].length);

  const nearProjects = {};
  KEYS.forEach(k => {
    nearProjects[k] = KEYS.filter(o => o !== k)
      .sort((a, b) => dist(centroid[k], centroid[a]) - dist(centroid[k], centroid[b]))

  });

  const edges = [];
  const seenEdge = new Set();
  const addEdge = (i, j) => {

  };
  const mainIdx = {};

  CHUNKS.forEach((c, i) => {

    CHUNKS.map((o, j) => [dist(c.pos, o.pos), j])
      .filter(([, j]) => j !== i && CHUNKS[j].main)
      .sort((a, b) => a[0] - b[0])
      .slice(0, 2)
      .forEach(([, j]) => addEdge(i, j));
  });

  // Per-point animation state.
  const pts = CHUNKS.map(c => ({
    from: [gauss() * 0.03, gauss() * 0.03, gauss() * 0.03],
    delay: rnd() * 0.2,
    size: c.main ? 1.8 : 0.45 + rnd() * 0.25,

  // Illustrative win-probability series (31 samples over 30 minutes).
  const SERIES = (() => {
    const r = mulberry32(42);

    let p = 0.5;
    for (let i = 0; i <= 60; i++) {
      out.push(p);

  })();

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  // CANVAS SIZE

  let W = 0, H = 0, DPR = 1;

  // ---------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------
  const ZOOM = 5;
  const CAM = 4.2;
  const INTRO_S = 1.3;
  const t0 = performance.now();
  let last = t0;
  let t = 0;               // seconds, drives drift
  let angY = 0.6, angX = 0.22;
  let spin = 1;            // multiplier on rotation speed
  let zoom = 1;
  let userZoom = 1;        // wheel zoom
  let userTilt = 0;        // vertical drag tilt
  let velY = 0, velX = 0;  // drag inertia (rad/s)
  let panelT = 0;          // 0 closed, 1 open
  const focus = [0, 0, 0];
  let selected = null;     // project key whose detail is open

  // ---------------------------------------------------------------------
  // PROJECTION + HIT TEST
  // ---------------------------------------------------------------------
  function hitTest(x, y, slop) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < S.length; i++) {
      const s = S[i];
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < Math.max(slop, s.rad0 + slop * 0.6) && d < bd) { bd = d; best = i; }
    }
    return best;
  }

  // ---------------------------------------------------------------------
  // PANEL

  function openProject(k) {

  }
  function closeProject() {
    selected = null;
    detail.classList.remove('open');
  }
  function fillPanel(k) {
    const m = META[k];

    dSub.textContent = m.sub || '';
    dSub.hidden = !m.sub;
    dTitle.textContent = m.title;
    dStats.innerHTML = m.stats.map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`).join('');
    dStats.hidden = !m.stats.length;
    dDesc.textContent = m.desc;
    dTech.innerHTML = m.tech.map(x => `<li>${x}</li>`).join('');
    dLinks.innerHTML = m.links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join('');

    }
  }
  backBtn.addEventListener('click', closeProject);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && selected) closeProject();
  });

  // ---------------------------------------------------------------------
  // WIN-PROBABILITY SCRUBBER (LeagueVODreview)
  // ---------------------------------------------------------------------
  let scrubIdx = 30;
  let scrubDrag = false;
  function drawScrub() {
    const w = scCanvas.clientWidth, h = scCanvas.clientHeight;
    if (!w || !h) return;
    scCanvas.width = Math.round(w * DPR);
    scCanvas.height = Math.round(h * DPR);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, w, h);

    const top = 26, bot = h - 8;
    const X = i => (i / (SERIES.length - 1)) * w;
    const Y = p => top + (1 - p) * (bot - top);

    sctx.setLineDash([2, 3]);
    sctx.strokeStyle = rgba(pal.line, 0.22);
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, Y(0.5)); sctx.lineTo(w, Y(0.5)); sctx.stroke();
    sctx.setLineDash([]);

    sctx.strokeStyle = rgba(pal.line, 0.85);
    sctx.lineWidth = 1.5;
    sctx.lineJoin = 'round';
    sctx.beginPath();
    SERIES.forEach((p, i) => (i ? sctx.lineTo(X(i), Y(p)) : sctx.moveTo(X(i), Y(p))));
    sctx.stroke();

    const mx = X(scrubIdx), my = Y(SERIES[scrubIdx]);
    sctx.lineWidth = 1;
    sctx.strokeStyle = rgba(pal.line, 0.25);
    sctx.beginPath(); sctx.moveTo(mx, top - 6); sctx.lineTo(mx, bot); sctx.stroke();
    sctx.fillStyle = rgba(pal.accent, 1);
    sctx.beginPath(); sctx.arc(mx, my, 4, 0, Math.PI * 2); sctx.fill();

    sctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = rgba(pal.line, 0.6);
    sctx.textBaseline = 'top';
    sctx.textAlign = 'left';
    sctx.fillText(Math.round(SERIES[scrubIdx] * 100) + '%', 0, 2);
    sctx.textAlign = 'right';
    sctx.fillText('min ' + (scrubIdx / 2).toFixed(1), w, 2);
  }
  function setScrubFromEvent(e) {
    const r = scCanvas.getBoundingClientRect();
    const f = clamp((e.clientX - r.left) / r.width);
    scrubIdx = Math.round(f * (SERIES.length - 1));
    drawScrub();
  }

    scrubDrag = true;
    scCanvas.setPointerCapture(e.pointerId);
    setScrubFromEvent(e);
  });
  scCanvas.addEventListener('pointermove', e => { if (scrubDrag) setScrubFromEvent(e); });

  scCanvas.addEventListener('pointerup', endScrubDrag);
  scCanvas.addEventListener('pointercancel', endScrubDrag);
  scCanvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      scrubIdx = clamp(scrubIdx + (e.key === 'ArrowRight' ? 1 : -1), 0, SERIES.length - 1);
      drawScrub();
    }
  });

  // ---------------------------------------------------------------------
  // POINTER ON THE CLOUD (mouse hover, tap = hover + click)
  // ---------------------------------------------------------------------
  cv.addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.on = true; pointer.touch = e.pointerType === 'touch';
  });
  cv.addEventListener('pointerleave', () => { pointer.on = false; });

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    drag.on = true; drag.moved = false;

    velY = velX = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (!drag.on) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) drag.moved = true;
    if (!drag.moved) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    angY += dx * 0.006; userTilt = clamp(userTilt + dy * 0.006, -1.2, 1.2);
    velY = dx * 0.006 * 60; velX = dy * 0.006 * 60;
    cv.classList.add('grabbing');
  });
  const endDrag = e => {
    if (!drag.on) return;
    drag.on = false;
    cv.classList.remove('grabbing');
    if (drag.moved) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.touch = e.pointerType === 'touch';
    const i = hitTest(pointer.x, pointer.y, pointer.touch ? 22 : 10);
    if (i >= 0) openProject(CHUNKS[i].project);

    if (pointer.touch) pointer.on = false;
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', () => { drag.on = false; cv.classList.remove('grabbing'); });

  // ---------------------------------------------------------------------
  // QUERY (keyword retrieval for now; swap for a real embedding later)
  // ---------------------------------------------------------------------
  const STOP = new Set('a an and the of to in on for with by is are i my me at as or it from that this what who how do does'.split(' '));
  const tok = s => s.toLowerCase().split(/[^a-z0-9+#.]+/).filter(w => w.length > 1 && !STOP.has(w));
  const DOCS = CHUNKS.map(c => c.main ? null :
    tok([c.text, META[c.project].title, META[c.project].tech.join(' ')].join(' ')).join(' '));
  let hits = [];           // [{i, score}]
  const qPos = [0, 0, 0];  // smoothed query point
  let qT = 0;              // query visibility ease
  const qInput = document.getElementById('q');
  function runQuery() {
    const qs = tok(qInput.value);
    if (!qs.length) { hits = []; return; }
    hits = DOCS.map((d, i) => {
      if (!d) return { i, score: 0 };
      const m = qs.filter(w => d.includes(w)).length;
      return { i, score: m / qs.length };
    }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);
  }
  qInput.addEventListener('input', runQuery);
  qInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { qInput.value = ''; runQuery(); qInput.blur(); }
  });
  const cosine = (a, b) => {
    const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    return d / ((Math.hypot(...a) * Math.hypot(...b)) || 1);
  };

  // ---------------------------------------------------------------------
  // HOVER PREVIEW: a live page, a video, or a screenshot per project
  // ---------------------------------------------------------------------
  const IMG = '../../img/';
  const PEEK = {
    league:      { live: 'https://augustzhang1.github.io/LeagueVODreview/review/NA1_5650873814?p=1', img: 'league.jpg' },
    minecraft:   { video: 'minecraft.mp4', img: 'minecraft.jpg' },   // add img/minecraft.mp4 to enable
    arbitrage:   { img: 'odds.jpg' },
    rag:         { img: 'rag.jpg' },
    audiobook:   { img: 'audiobook.jpg' },
    'ark-eagle': { img: 'scheduler.jpg' },
    arkproject:  { img: 'recipe.jpg' },
    medihub:     { img: 'medihub.jpg' },
    snake:       { img: 'snakegame.PNG' },
    housing:     { img: 'house.jpg' },
    sinai:       { img: 'sinai.jpg' },
    senseway:    { img: 'senseway.png' }
  };
  const peek = document.getElementById('peek');
  const peekImg = document.getElementById('peekImg');
  const peekVid = document.getElementById('peekVid');
  let peekFrame = null, peekKey = null, vidOk = {};
  function showPeek(k) {
    if (k === peekKey) return;
    peekKey = k;
    [peekImg, peekVid, peekFrame].forEach(e => e && e.classList.remove('show'));
    peekVid.pause();
    if (!k || !PEEK[k]) { peek.classList.remove('on'); return; }
    const m = PEEK[k];
    if (m.live) {
      // Created once and kept, so the live page doesn't reload on every hover.
      if (!peekFrame) {
        peekFrame = document.createElement('iframe');
        peekFrame.src = m.live; peekFrame.tabIndex = -1; peekFrame.loading = 'eager';
        peek.appendChild(peekFrame);
      }
      peekFrame.classList.add('show');
    } else if (m.video && vidOk[k] !== false) {
      if (!peekVid.src.endsWith(m.video)) {
        peekVid.poster = IMG + m.img;
        peekVid.src = IMG + m.video;
        peekVid.onerror = () => { vidOk[k] = false; if (peekKey === k) { peekKey = null; showPeek(k); } };
      }
      peekVid.classList.add('show');
      peekVid.play().catch(() => {});
    } else {
      peekImg.src = IMG + m.img;
      peekImg.classList.add('show');
    }
    peek.classList.add('on');
  }
  function placePeek(x, y) {
    const w = peek.offsetWidth, h = peek.offsetHeight;
    let px = x - w - 24, py = y - h / 2;
    if (px < 16) px = x + 24;
    if (px + w > W - 16) px = W - w - 16;
    py = clamp(py, 96, H - h - 80);
    peek.style.transform = `translate(${Math.round(px)}px, ${Math.round(py)}px)`;
  }

  // Scroll to zoom.
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    userZoom = clamp(userZoom * Math.exp(-e.deltaY * 0.0015), 0.6, 2.5);
  }, { passive: false });

  // ---------------------------------------------------------------------
  // FRAME
  // ---------------------------------------------------------------------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    const sm = rate => (reduce ? 1 : 1 - Math.exp(-dt * rate));

    // Smooth state transitions.
    spin += ((selected ? 0.12 : 1) - spin) * sm(3);
    zoom += ((selected ? ZOOM : 1) - zoom) * sm(5);
    panelT += ((selected ? 1 : 0) - panelT) * sm(5);
    const ft = selected ? centroid[selected] : [0, 0, 0];
    for (let a = 0; a < 3; a++) focus[a] += (ft[a] - focus[a]) * sm(5);
    const zt = (zoom - 1) / (ZOOM - 1);

    // Rotation, slow tilt and drift.
    if (!reduce && !drag.on) angY += dt * 0.07 * spin;
    if (!drag.on) {
      angY += velY * dt; userTilt = clamp(userTilt + velX * dt, -1.2, 1.2);
      const f = Math.exp(-dt * 3); velY *= f; velX *= f;
    }
    angX = (reduce ? 0.22 : 0.22 + 0.05 * Math.sin(t * 0.11)) + userTilt;
    const offX = reduce ? 0 : 0.025 * Math.sin(t * 0.19);
    const offY = reduce ? 0 : 0.018 * Math.sin(t * 0.13 + 1.1);

    const cA = Math.cos(angY), sA = Math.sin(angY);
    const cB = Math.cos(angX), sB = Math.sin(angX);
    const rot = p => {
      const x1 = cA * p[0] + sA * p[2];
      const z1 = -sA * p[0] + cA * p[2];
      return [x1, cB * p[1] - sB * z1, sB * p[1] + cB * z1];
    };
    const fR = rot(focus);

    const Sc = Math.min(W, H) * 0.36 * userZoom;
    const desk = W > 720;
    const cx = W / 2 - (desk ? panelT * 188 : 0) + offX * Sc;
    const cy = H / 2 - (desk ? 0 : panelT * H * 0.2) - offY * Sc;

    // Project any world point to the screen.
    const P = w => {
      const q = rot(w), k = CAM / (CAM - q[2]);
      return [cx + (q[0] - fR[0]) * k * Sc * zoom, cy - (q[1] - fR[1]) * k * Sc * zoom];
    };

    const elapsed = (now - t0) / 1000;
    S = CHUNKS.map((c, i) => {
      const p = pts[i];
      const u = reduce ? 1 : easeOut(clamp((elapsed - p.delay) / INTRO_S));
      const q = rot([
        p.from[0] + (c.pos[0] - p.from[0]) * u,
        p.from[1] + (c.pos[1] - p.from[1]) * u,
        p.from[2] + (c.pos[2] - p.from[2]) * u
      ]);
      const k = CAM / (CAM - q[2]);
      const d = clamp((q[2] + 1) / 2);
      return {
        x: cx + (q[0] - fR[0]) * k * Sc * zoom,
        y: cy - (q[1] - fR[1]) * k * Sc * zoom,
        z: q[2],
        d,
        rad0: (3.2 + 2.8 * d) * p.size * Math.min(k, 1.3) * (1 + 0.4 * zt)
      };
    });

    // Hover from pointer position (mouse only; touch hovers via tap).
    hoverIdx = pointer.on ? hitTest(pointer.x, pointer.y, pointer.touch ? 22 : 10) : -1;
    hovered = hoverIdx >= 0 ? CHUNKS[hoverIdx].project : null;
    cv.classList.toggle('pointer', hoverIdx >= 0);
    const peekOn = hovered && !selected && !drag.on;
    showPeek(peekOn ? hovered : null);
    if (peekOn) { const m = S[mainIdx[hovered]]; placePeek(m.x, m.y); }

    const active = hovered || selected;
    const hitSet = new Set(hits.map(h => h.i));
    const querying = !active && hits.length > 0;

    // Query point eases toward the score-weighted mean of its hits.
    qT += ((querying ? 1 : 0) - qT) * sm(6);
    if (hits.length) {
      const tw = hits.reduce((s, h) => s + h.score, 0);
      const tgt = [0, 1, 2].map(a => hits.reduce((s, h) => s + CHUNKS[h.i].pos[a] * h.score, 0) / tw);
      for (let a = 0; a < 3; a++) qPos[a] += (tgt[a] - qPos[a]) * sm(6);
    }

    // Per-point accent and dim eases.
    CHUNKS.forEach((c, i) => {
      const p = pts[i];
      const isA = active ? c.project === active : querying && hitSet.has(i);
      const isD = (!!active || querying) && !isA;
      p.acc += ((isA ? 1 : 0) - p.acc) * sm(12);
      p.dim += ((isD ? 1 : 0) - p.dim) * sm(10);
    });

    // Draw.
    ctx.clearRect(0, 0, W, H);
    const introEdge = reduce ? 1 : easeOut(clamp(elapsed / 1.8));

    ctx.lineWidth = 1;
    const mono = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    const O = P([0, 0, 0]);

    // Axes through the origin.
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']].forEach(([ax, ay, az, nm]) => {
      const a = P([-ax * 0.9, -ay * 0.9, -az * 0.9]), b = P([ax * 0.9, ay * 0.9, az * 0.9]);
      ctx.strokeStyle = rgba(pal.line, 0.09 * introEdge);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      const l = P([ax, ay, az]);
      ctx.fillStyle = rgba(pal.line, 0.3 * introEdge);
      ctx.fillText(nm, l[0], l[1]);
    });

    // Vectors from the origin for whatever is in focus.
    const arrowIdx = active ? members[active] : (querying ? hits.map(h => h.i) : []);
    arrowIdx.forEach(i => {
      const s = S[i];
      const dx = s.x - O[0], dy = s.y - O[1], L = Math.hypot(dx, dy);
      if (L < 8) return;
      const ux = dx / L, uy = dy / L;
      const ex = s.x - ux * (s.rad0 + 2), ey = s.y - uy * (s.rad0 + 2);
      ctx.strokeStyle = rgba(pal.accent, (CHUNKS[i].main ? 0.5 : 0.28) * introEdge);
      ctx.beginPath();
      ctx.moveTo(O[0], O[1]); ctx.lineTo(ex, ey);
      ctx.moveTo(ex, ey); ctx.lineTo(ex - ux * 6 - uy * 3, ey - uy * 6 + ux * 3);
      ctx.moveTo(ex, ey); ctx.lineTo(ex - ux * 6 + uy * 3, ey - uy * 6 - ux * 3);
      ctx.stroke();
    });

    edges.forEach(([i, j]) => {
      const a = S[i], b = S[j];
      const pi = CHUNKS[i].project, pj = CHUNKS[j].project;
      let col = pal.line, al = pal.edge;
      if (active) {
        if (pi === active && pj === active) { col = pal.accent; al = 0.6; }
        else if (pi === active || pj === active) { col = pal.accent; al = 0.4; }
        else { al = 0.04; }
      } else if (querying) {
        al = 0.05;
      }
      al *= (0.45 + 0.55 * ((a.d + b.d) / 2)) * introEdge;
      ctx.strokeStyle = rgba(col, al);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    });

    // Centroids of projects, used for neighbour hairlines.
    const cS = {};
    KEYS.forEach(k => {
      let sx = 0, sy = 0;
      members[k].forEach(i => { sx += S[i].x; sy += S[i].y; });
      cS[k] = [sx / members[k].length, sy / members[k].length];
    });
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    if (active) {
      nearProjects[active].forEach(nk => {
        const a = cS[active], b = cS[nk];
        ctx.strokeStyle = rgba(pal.accent, 0.4 * introEdge);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.fillStyle = rgba(pal.accent, 0.85 * introEdge);
        ctx.fillText(cosine(centroid[active], centroid[nk]).toFixed(2), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 8);
      });
    }

    // Query point and its retrieved chunks.
    if (qT > 0.01 && hits.length) {
      const q = P(qPos);
      hits.forEach(h => {
        const s = S[h.i];
        ctx.strokeStyle = rgba(pal.accent, 0.5 * qT);
        ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(s.x, s.y); ctx.stroke();
        ctx.fillStyle = rgba(pal.accent, 0.85 * qT);
        ctx.fillText(cosine(qPos, CHUNKS[h.i].pos).toFixed(2), (q[0] + s.x) / 2, (q[1] + s.y) / 2 - 8);
      });
      ctx.strokeStyle = rgba(pal.accent, qT);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }

    const order = S.map((s, i) => i).sort((a, b) => S[a].z - S[b].z);
    order.forEach(i => {
      const s = S[i], p = pts[i];
      const x = (0.3 + 0.6 * s.d) * (1 - 0.8 * p.dim);
      const a = x + (0.95 - x) * p.acc;
      const r = s.rad0 * (1 + 0.25 * p.acc);
      ctx.fillStyle = rgba(mix(dotCol(CHUNKS[i].project), pal.accent, p.acc), a);
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
    });

    if (hoverIdx >= 0) {
      const s = S[hoverIdx];
      const label = META[hovered].label;
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      const w = ctx.measureText(label).width;
      let lx = s.x + 12;
      if (lx + w > W - 12) lx = s.x - 12 - w;
      ctx.fillStyle = rgba(pal.line, 0.95);
      ctx.fillText(label, lx, s.y - 12);
      // Detail points also show the chunk they hold.
      const txt = CHUNKS[hoverIdx].text;
      if (txt) {
        ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const words = txt.split(' '), lines = [];
        let ln = '';
        words.forEach(wd => {
          const tryLn = ln ? ln + ' ' + wd : wd;
          if (ctx.measureText(tryLn).width > 260 && ln) { lines.push(ln); ln = wd; } else ln = tryLn;
        });
        lines.push(ln);
        const tw = Math.max(...lines.map(l => ctx.measureText(l).width));
        let tx = s.x + 12;
        if (tx + tw > W - 12) tx = s.x - 12 - tw;
        ctx.fillStyle = rgba(pal.line, 0.6);
        lines.slice(0, 4).forEach((l, n) => ctx.fillText(l, tx, s.y + 8 + n * 16));
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------------
  window.addEventListener('resize', () => {
    resize();
    if (selected) drawScrub();
  });
  const stored = storedTheme();
  setTheme(stored ? stored === 'dark' : darkMq.matches, false);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
