    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;

      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  const inBox = (x, y, b) => x >= b.sx0 && x <= b.sx0 + b.sw && y >= b.sy0 && y <= b.sy0 + b.sh;

  // Monochrome ink on paper (light) or light ink on ink (dark). The accent is the only colour.
  const PAL = {
    light: { ink: [27, 29, 34],    accent: [229, 70, 47], paper: [232, 230, 225], edge: 0.12 },
    dark:  { ink: [220, 217, 210], accent: [255, 90, 60], paper: [20, 21, 24],    edge: 0.14 }
  };
  let pal = PAL.light;

  // ---------------------------------------------------------------------
  // INDEXES: members per project, centroids, neighbours, hairline edges
  // ---------------------------------------------------------------------
  // Tighten: pull each chunk toward its project centre, and projects toward the middle.
  (() => {
    const acc = {};
    CHUNKS.forEach(c => {
      const a = acc[c.project] || (acc[c.project] = [0, 0, 0, 0]);
      a[0] += c.pos[0]; a[1] += c.pos[1]; a[2] += c.pos[2]; a[3]++;
    });
    // Spread project centres through the volume (not on a hollow ring):
    // keep each direction, remap distance from centre by rank.
    const keys = Object.keys(acc);
    const cen = {};
    keys.forEach(k => { cen[k] = acc[k].slice(0, 3).map(v => v / acc[k][3]); });
    const len = v => Math.hypot(v[0], v[1], v[2]) || 1;
    keys.slice().sort((a, b) => len(cen[a]) - len(cen[b])).forEach((k, i, arr) => {
      const r = 0.12 + 0.6 * Math.pow(i / (arr.length - 1), 0.8);
      const l = len(cen[k]);
      cen[k] = cen[k].map(v => (v / l) * r);
    });
    // Detail points orbit their project at a small, visible distance.
    CHUNKS.forEach(c => {
      const a = acc[c.project];
      const m = a.slice(0, 3).map(v => v / a[3]);
      let off = c.pos.map((v, i) => v - m[i]);
      const ol = len(off);
      const want = 0.07 + 0.05 * rnd();
      off = ol < 1e-3 ? [gauss(), gauss(), gauss()].map(v => v * want * 0.6) : off.map(v => (v / ol) * want);
      c.pos = cen[c.project].map((v, i) => v + off[i]);
    });
    // One main point per project, at its centre.
    keys.forEach(k => CHUNKS.push({ id: k + '-main', project: k, main: true, text: '', pos: cen[k] }));
  })();

  const KEYS = Object.keys(META);
  const NK = KEYS.length;
  const KI = {};
  KEYS.forEach((k, i) => { KI[k] = i; });
  const members = {};
  KEYS.forEach(k => { members[k] = []; });
  CHUNKS.forEach((c, i) => members[c.project].push(i));

  const centroid = {};
  KEYS.forEach(k => {
    const s = [0, 0, 0];
    members[k].forEach(i => { for (let a = 0; a < 3; a++) s[a] += CHUNKS[i].pos[a]; });
    centroid[k] = s.map(v => v / members[k].length);
  });
  const nearProjects = {};
  KEYS.forEach(k => {
    nearProjects[k] = KEYS.filter(o => o !== k)
      .sort((a, b) => dist(centroid[k], centroid[a]) - dist(centroid[k], centroid[b]))
      .slice(0, 2);
  });

  const edges = [];
  const seenEdge = new Set();
  const addEdge = (i, j) => {
    const key = i < j ? i + ':' + j : j + ':' + i;
    if (!seenEdge.has(key)) { seenEdge.add(key); edges.push([i, j]); }
  };

  CHUNKS.forEach((c, i) => { if (c.main) mainIdx[c.project] = i; });
  // Each detail links to its main point; each main point links to its 2 nearest mains.
  CHUNKS.forEach((c, i) => {
    if (!c.main) { addEdge(i, mainIdx[c.project]); return; }
    CHUNKS.map((o, j) => [dist(c.pos, o.pos), j])
      .filter(([, j]) => j !== i && CHUNKS[j].main)
      .sort((a, b) => a[0] - b[0])
      .slice(0, 2)
      .forEach(([, j]) => addEdge(i, j));
  });

  // Per-point animation state.
  const pts = CHUNKS.map(c => ({

    delay: rnd() * 0.2,
    size: c.main ? 1.8 : 0.45 + rnd() * 0.25,

    const r = mulberry32(42);

    let p = 0.5;
    for (let i = 0; i <= 60; i++) {
      out.push(p);

  const fr = new Float32Array(NP), fa = new Float32Array(NP);   // transition start (radius, alpha)
  const px = new Float32Array(NP), py = new Float32Array(NP);   // rendered position

  const ix = new Float32Array(NP), iy = new Float32Array(NP);   // idle screen position this frame

  const dm = new Float32Array(NP);            // dim amount (0..1)
  const dR = new Float32Array(NP), dA = new Float32Array(NP);   // draw radius, alpha

  // ---------------------------------------------------------------------
  // HALFTONE GRIDS: one luminance grid per project, read once on load
  // ---------------------------------------------------------------------
  const IMG = '../../img/';
  const SHOTS = {
    league: 'league.jpg', minecraft: 'minecraft.jpg', arbitrage: 'odds.jpg', rag: 'rag.jpg',
    audiobook: 'audiobook.jpg', 'ark-eagle': 'scheduler.jpg', arkproject: 'recipe.jpg',
    medihub: 'medihub.jpg', snake: 'snakegame.PNG', housing: 'house.jpg', sinai: 'sinai.jpg',

  const GRID = {};   // key -> { cols, rows, lum: Float32Array }

  function storeGrid(key, src, sw, sh) {
    const ar = sw > 0 && sh > 0 ? sh / sw : 0.625;
    const cols = GCOLS;
    const rows = clamp(Math.round(cols * ar), 20, 64);
    const c = document.createElement('canvas');
    c.width = cols; c.height = rows;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, cols, rows);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, cols, rows);
    const data = g.getImageData(0, 0, cols, rows).data;

      });
      lines.push(ln);
      const lh = 64, y0 = 200 - (lines.length - 1) * lh / 2;
      lines.forEach((l, n) => g.fillText(l, 300, y0 + n * lh));

    } catch (e) { /* no print for this project */ }
  }
  function loadGrids() {
    KEYS.forEach(key => {
      if (!SHOTS[key]) { titleGrid(key); return; }

      img.onload = () => {

  const INTRO_S = 1.3;

  let t = 0;               // seconds, drives drift

  let spin = 1;            // multiplier on rotation speed

  let userTilt = 0;        // vertical drag tilt

  let panelT = 0;          // 0 closed, 1 open

  let hoverIdx = -1;       // chunk index under pointer

  // ---------------------------------------------------------------------
  // PROJECTION + HIT TEST
  // ---------------------------------------------------------------------
  function hitTest(x, y, slop) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < S.length; i++) {
      const s = S[i];
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < Math.max(slop, s.rad0 + slop * 0.6) && d < bd) { bd = d; best = i; }
    }
    return best;
  }

  // ---------------------------------------------------------------------

  }
  function closeProject() {
    selected = null;

    dCat.textContent = m.cat;

  // ---------------------------------------------------------------------
  // WIN-PROBABILITY SCRUBBER (LeagueVODreview)
  // ---------------------------------------------------------------------
  let scrubIdx = 30;
  let scrubDrag = false;
  function drawScrub() {
    const w = scCanvas.clientWidth, h = scCanvas.clientHeight;
    if (!w || !h) return;
    scCanvas.width = Math.round(w * DPR);
    scCanvas.height = Math.round(h * DPR);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, w, h);

    const top = 26, bot = h - 8;
    const X = i => (i / (SERIES.length - 1)) * w;
    const Y = p => top + (1 - p) * (bot - top);

    sctx.setLineDash([2, 3]);
    sctx.strokeStyle = rgba(pal.ink, 0.22);
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, Y(0.5)); sctx.lineTo(w, Y(0.5)); sctx.stroke();
    sctx.setLineDash([]);

    sctx.strokeStyle = rgba(pal.ink, 0.85);
    sctx.lineWidth = 1.5;
    sctx.lineJoin = 'round';
    sctx.beginPath();
    SERIES.forEach((p, i) => (i ? sctx.lineTo(X(i), Y(p)) : sctx.moveTo(X(i), Y(p))));
    sctx.stroke();

    const mx = X(scrubIdx), my = Y(SERIES[scrubIdx]);
    sctx.lineWidth = 1;
    sctx.strokeStyle = rgba(pal.ink, 0.25);
    sctx.beginPath(); sctx.moveTo(mx, top - 6); sctx.lineTo(mx, bot); sctx.stroke();
    sctx.fillStyle = rgba(pal.accent, 1);
    sctx.beginPath(); sctx.arc(mx, my, 4, 0, Math.PI * 2); sctx.fill();

    sctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = rgba(pal.ink, 0.6);
    sctx.textBaseline = 'top';
    sctx.textAlign = 'left';
    sctx.fillText(Math.round(SERIES[scrubIdx] * 100) + '%', 0, 2);
    sctx.textAlign = 'right';
    sctx.fillText('min ' + (scrubIdx / 2).toFixed(1), w, 2);
  }

    const r = scCanvas.getBoundingClientRect();

  scCanvas.addEventListener('pointercancel', endScrubDrag);
  scCanvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {

      drawScrub();
    }
  });

  // ---------------------------------------------------------------------
  // POINTER ON THE CLOUD (mouse hover, tap = hover + click)

  cv.addEventListener('pointermove', e => {

    drag.x0 = drag.lx = e.clientX; drag.y0 = drag.ly = e.clientY;
    velY = velX = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (!drag.on) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) drag.moved = true;
    if (!drag.moved) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    angY += dx * 0.006; userTilt = clamp(userTilt + dy * 0.006, -1.2, 1.2);
    velY = dx * 0.006 * 60; velX = dy * 0.006 * 60;
    cv.classList.add('grabbing');
  });

    if (!drag.on) return;
    drag.on = false;

    pointer.touch = e.pointerType === 'touch';

  cv.addEventListener('pointercancel', () => { drag.on = false; cv.classList.remove('grabbing'); });

  // ---------------------------------------------------------------------
  // QUERY (keyword retrieval for now; swap for a real embedding later)
  // ---------------------------------------------------------------------
  const STOP = new Set('a an and the of to in on for with by is are i my me at as or it from that this what who how do does'.split(' '));
  const tok = s => s.toLowerCase().split(/[^a-z0-9+#.]+/).filter(w => w.length > 1 && !STOP.has(w));
  const DOCS = CHUNKS.map(c => c.main ? null :
    tok([c.text, META[c.project].title, META[c.project].tech.join(' ')].join(' ')).join(' '));
  let hits = [];           // [{i, score}]
  const qPos = [0, 0, 0];  // smoothed query point
  let qT = 0;              // query visibility ease
  const qInput = document.getElementById('q');
  function runQuery() {
    const qs = tok(qInput.value);
    if (!qs.length) { hits = []; return; }
    hits = DOCS.map((d, i) => {
      if (!d) return { i, score: 0 };
      const m = qs.filter(w => d.includes(w)).length;
      return { i, score: m / qs.length };
    }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);

  qInput.addEventListener('keydown', e => {

  const cosine = (a, b) => {
    const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    return d / ((Math.hypot(...a) * Math.hypot(...b)) || 1);
  };

  // ---------------------------------------------------------------------
  // HALFTONE PRINT
  // A flat, camera-facing sheet with one dot per grid cell. Dot radius
  // follows darkness (light theme: ink on paper) or brightness (dark theme).
  // ---------------------------------------------------------------------
  const PAD = 14, LABEL_H = 30;

  // Sheet box for a print. Click: left of the detail panel (55% of the
  // viewport on desktop). Hover: 300px beside the main point, kept clear
  // of the header and the search box.
  function printBox(np) {
    const aspect = np.cols / np.rows;
    const mobile = W <= 720;
    let w, h, sw, sh, sx0, sy0;
    if (np.mode === 'click') {
      if (!mobile) {
        const right = W - 36 - 340 - 40;      // sheet right edge: gap before the panel
        const top = 112, bottom = H - 36;
        const maxW = Math.min(0.55 * W, right - 24) - 2 * PAD;
        const maxH = bottom - top - 2 * PAD - LABEL_H;
        w = maxW; h = w / aspect;
        if (h > maxH) { h = maxH; w = h * aspect; }
        sw = w + 2 * PAD; sh = h + 2 * PAD + LABEL_H;
        sx0 = right - sw; sy0 = top;
      } else {
        const top = 96, bottom = H * 0.44;
        const maxW = W - 32 - 2 * PAD;
        const maxH = bottom - top - 2 * PAD - LABEL_H;
        w = maxW; h = w / aspect;
        if (h > maxH) { h = maxH; w = h * aspect; }
        sw = w + 2 * PAD; sh = h + 2 * PAD + LABEL_H;
        sx0 = (W - sw) / 2; sy0 = top;
      }
    } else {
      w = Math.min(300, W * 0.6 - 2 * PAD);
      h = w / aspect;
      if (h > H * 0.5) { h = H * 0.5; w = h * aspect; }
      sw = w + 2 * PAD; sh = h + 2 * PAD + LABEL_H;
      const topMin = mobile ? 150 : 96;
      sx0 = np.ax < W / 2 ? np.ax + 56 : np.ax - 56 - sw;
      sx0 = clamp(sx0, 16, Math.max(16, W - 16 - sw));
      sy0 = clamp(np.ay - sh / 2, topMin, Math.max(topMin, H - 96 - sh));
    }
    return { w, h, sw, sh, sx0, sy0, x0: sx0 + PAD, y0: sy0 + PAD };
  }

  function layoutPrint(np) {
    const b = printBox(np);
    np.box = b;
    const cw = b.w / np.cols, ch = b.h / np.rows;
    for (let s = 0; s < np.K; s++) {
      const idx = np.sI[s];
      const c = idx % np.cols, r = (idx / np.cols) | 0;
      np.sx[s] = b.x0 + (c + 0.5) * cw;
      np.sy[s] = b.y0 + (r + 0.5) * ch;
      np.sr[s] = Math.max(0.25, 0.5 * Math.min(cw, ch) * Math.sqrt(np.sv[s]));
    }
  }

  const DMAX = () => Math.max(120, Math.hypot(W, H) * 0.5);

  // Give a particle a new target. The rendered position becomes the new
  // start, so nothing snaps. Waits briefly (by distance) so it ripples.
  function retarget(i, s, np) {
    fx[i] = px[i]; fy[i] = py[i]; fr[i] = rr[i]; fa[i] = ra[i];
    const tx = s >= 0 ? np.sx[s] : ix[i];
    const ty = s >= 0 ? np.sy[s] : iy[i];
    const d = Math.hypot(tx - px[i], ty - py[i]);
    slot[i] = s;
    ex[i] = reduce ? 1 : 0;
    ev[i] = 0;
    wt[i] = reduce ? 0 : 0.3 * Math.min(1, d / DMAX()) + rnd() * 0.06;
  }

  function startDecode(key, mode) {
    const g = GRID[key];
    const dark = pal === PAL.dark;

    // Cells that carry ink (light) or light (dark), darkest first.
    const idxs = [], vs = [];
    for (let c = 0; c < g.lum.length; c++) {
      const v = clamp(((dark ? g.lum[c] : 1 - g.lum[c]) - 0.05) * 1.1);
      if (v > 0.04) { idxs.push(c); vs.push(v); }
    }
    const order = idxs.map((_, j) => j).sort((a, b) => vs[b] - vs[a]).slice(0, MAX_DOTS);
    const K = order.length;
    const np = {
      key, mode, cols: g.cols, rows: g.rows, K,
      sI: new Int32Array(K), sv: new Float32Array(K),
      sx: new Float32Array(K), sy: new Float32Array(K), sr: new Float32Array(K),
      box: null, ax: 0, ay: 0
    };
    order.forEach((j, s) => { np.sI[s] = idxs[j]; np.sv[s] = vs[j]; });
    if (mode === 'hover') { np.ax = S[mainIdx[key]].x; np.ay = S[mainIdx[key]].y; }
    layoutPrint(np);

    // Dust for the print: the project's own first, then the nearest dust from elsewhere.
    const kk = KI[key];
    const sel = [];
    for (let i = 0; i < NP && sel.length < K; i++) if (prj[i] === kk) sel.push(i);
    if (sel.length < K) {
      const c0 = cenW[kk];
      const rest = [], cost = new Float32Array(NP);
      for (let i = 0; i < NP; i++) {
        if (prj[i] === kk) continue;
        rest.push(i);
        cost[i] = (hx[i] - c0[0]) ** 2 + (hy[i] - c0[1]) ** 2 + (hz[i] - c0[2]) ** 2;
      }
      rest.sort((a, b) => cost[a] - cost[b]);
      for (let j = 0; sel.length < K && j < rest.length; j++) sel.push(rest[j]);
    }

    // Pair dust and dots left to right, so the flight reads as a sweep.
    const byX = sel.slice().sort((a, b) => px[a] - px[b]);
    const slotOrder = Array.from({ length: K }, (_, s) => s).sort((a, b) => np.sx[a] - np.sx[b]);
    const next = new Int32Array(NP).fill(-1);
    for (let j = 0; j < K; j++) next[byX[j]] = slotOrder[j];

    print = np;
    sheetP = np;
    for (let i = 0; i < NP; i++) {
      if (next[i] >= 0 || slot[i] >= 0 || ex[i] < 1) retarget(i, next[i], np);
    }
  }

  function endDecode() {
    for (let i = 0; i < NP; i++) {
      if (slot[i] >= 0 || ex[i] < 1) retarget(i, -1, null);
    }
    print = null;
  }

  // Halftone images, read once. Each project gets a grid of luminance values.
  const grainCanvas = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const im = g.createImageData(128, 128);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      im.data[i] = v; im.data[i + 1] = v; im.data[i + 2] = v; im.data[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return c;
  })();
  grainEl.style.backgroundImage = `url(${grainCanvas.toDataURL()})`;

  // ---------------------------------------------------------------------
  // FRAME
  // ---------------------------------------------------------------------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    const sm = rate => (reduce ? 1 : 1 - Math.exp(-dt * rate));

    spin += ((selected ? 0.12 : 1) - spin) * sm(3);
    panelT += ((selected ? 1 : 0) - panelT) * sm(5);

    // Rotation, slow tilt and drift.
    if (!reduce && !drag.on) angY += dt * 0.07 * spin;
    if (!drag.on) {
      angY += velY * dt; userTilt = clamp(userTilt + velX * dt, -1.2, 1.2);
      const f = Math.exp(-dt * 3); velY *= f; velX *= f;
    }
    angX = (reduce ? 0.22 : 0.22 + 0.05 * Math.sin(t * 0.11)) + userTilt;
    const offX = reduce ? 0 : 0.025 * Math.sin(t * 0.19);
    const offY = reduce ? 0 : 0.018 * Math.sin(t * 0.13 + 1.1);

    const cA = Math.cos(angY), sA = Math.sin(angY);
    const cB = Math.cos(angX), sB = Math.sin(angX);
    const rot = p => {
      const x1 = cA * p[0] + sA * p[2];
      const z1 = -sA * p[0] + cA * p[2];
      return [x1, cB * p[1] - sB * z1, sB * p[1] + cB * z1];
    };

    const Sc = Math.min(W, H) * 0.36 * userZoom;
    const desk = W > 720;
    const cx = W / 2 + offX * Sc;
    const cy = H / 2 - (desk ? 0 : panelT * H * 0.2) - offY * Sc;
    const elapsed = (now - t0) / 1000;
    const P = w => {
      const q = rot(w), k = CAM / (CAM - q[2]);
      return [cx + q[0] * k * Sc, cy - q[1] * k * Sc];
    };

    // Chunk points.
    S = CHUNKS.map((c, i) => {
      const p = pts[i];
      const u = reduce ? 1 : easeOut(clamp((elapsed - p.delay) / INTRO_S));
      const q = rot([
        p.from[0] + (c.pos[0] - p.from[0]) * u,
        p.from[1] + (c.pos[1] - p.from[1]) * u,
        p.from[2] + (c.pos[2] - p.from[2]) * u
      ]);
      const k = CAM / (CAM - q[2]);
      const d = clamp((q[2] + 1) / 2);
      return {
        x: cx + q[0] * k * Sc,
        y: cy - q[1] * k * Sc,
        z: q[2],
        d,
        rad0: (3.2 + 2.8 * d) * p.size * Math.min(k, 1.3)
      };
    });

    // Ink dust: where each particle sits in the cloud this frame.
    for (let i = 0; i < NP; i++) {
      const u = reduce ? 1 : easeOut(clamp((elapsed - dd[i]) / INTRO_S));
      const wob = reduce ? 0 : 0.012;
      const x = hx[i] * u + wob * Math.sin(t * 0.31 + wph[i]);
      const y = hy[i] * u + wob * Math.cos(t * 0.27 + wph[i] * 1.3);
      const z = hz[i] * u + wob * Math.sin(t * 0.23 + wph[i] * 0.7);
      const x1 = cA * x + sA * z, z1 = -sA * x + cA * z;
      const y1 = cB * y - sB * z1, z2 = sB * y + cB * z1;
      const k = CAM / (CAM - z2);
      const d = clamp((z2 + 1) / 2);
      ix[i] = cx + x1 * k * Sc;
      iy[i] = cy - y1 * k * Sc;
      ir[i] = (0.45 + 0.7 * d) * sz[i] * Math.min(k, 1.3);
      ia[i] = 0.2 + 0.6 * d;
    }

    // Hover, then decide which project the print shows.
    hoverIdx = pointer.on ? hitTest(pointer.x, pointer.y, pointer.touch ? 22 : 10) : -1;
    hovered = hoverIdx >= 0 ? CHUNKS[hoverIdx].project : null;
    cv.classList.toggle('pointer', hoverIdx >= 0);
    const active = hovered || selected;

    const wantKey = selected || (drag.on ? null : hovered);
    const wantMode = selected ? 'click' : 'hover';
    if (!wantKey || !GRID[wantKey]) {
      if (print) endDecode();
    } else if (!print || print.key !== wantKey || print.mode !== wantMode) {
      startDecode(wantKey, wantMode);
    }
    if (print) sheetP = print;
    sheetA += ((print ? 1 : 0) - sheetA) * sm(4);

    // Dust transitions: stagger, then a critically damped spring to 1.
    const kDim = sm(6);
    const B = sheetA > 0.01 && sheetP ? sheetP.box : null;
    for (let i = 0; i < NP; i++) {
      if (wt[i] > 0) wt[i] -= dt;
      else if (ex[i] < 1) {
        const w = 7;
        ev[i] += (w * w * (1 - ex[i]) - 2 * w * ev[i]) * dt;
        ex[i] = Math.min(1, ex[i] + ev[i] * dt);
        if (ex[i] > 0.999) { ex[i] = 1; ev[i] = 0; }
      }
      const e = ex[i], s = slot[i];
      let tx, ty, tr, ta;
      if (s >= 0) { tx = print.sx[s]; ty = print.sy[s]; tr = print.sr[s]; ta = 0.95; }
      else { tx = ix[i]; ty = iy[i]; tr = ir[i]; ta = ia[i]; }
      const x = fx[i] + (tx - fx[i]) * e;
      const y = fy[i] + (ty - fy[i]) * e;
      px[i] = x; py[i] = y;
      rr[i] = fr[i] + (tr - fr[i]) * e;
      ra[i] = fa[i] + (ta - fa[i]) * e;
      dm[i] += ((s < 0 && print ? 1 : 0) - dm[i]) * kDim;
      let al = ra[i] * (1 - 0.8 * dm[i]);
      if (s < 0 && B && inBox(x, y, B)) al *= 1 - 0.95 * sheetA;   // dust stays off the paper
      dA[i] = al;
      dR[i] = rr[i];
    }

    // Per-point accent and dim eases.
    const hitSet = new Set(hits.map(h => h.i));
    const querying = !active && hits.length > 0;
    qT += ((querying ? 1 : 0) - qT) * sm(6);
    if (hits.length) {
      const tw = hits.reduce((s, h) => s + h.score, 0);
      const tgt = [0, 1, 2].map(a => hits.reduce((s, h) => s + CHUNKS[h.i].pos[a] * h.score, 0) / tw);
      for (let a = 0; a < 3; a++) qPos[a] += (tgt[a] - qPos[a]) * sm(6);
    }
    CHUNKS.forEach((c, i) => {
      const p = pts[i];
      const isA = active ? c.project === active : querying && hitSet.has(i);
      const isD = (!!active || querying) && !isA;
      p.acc += ((isA ? 1 : 0) - p.acc) * sm(12);
      p.dim += ((isD ? 1 : 0) - p.dim) * sm(10);
    });

    // ---- Draw ----
    ctx.clearRect(0, 0, W, H);
    const introEdge = reduce ? 1 : easeOut(clamp(elapsed / 1.8));
    const mono = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    const O = P([0, 0, 0]);
    ctx.lineWidth = 1;

    // Axes through the origin.
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']].forEach(([ax, ay, az, nm]) => {
      const a = P([-ax * 0.9, -ay * 0.9, -az * 0.9]), b = P([ax * 0.9, ay * 0.9, az * 0.9]);
      ctx.strokeStyle = rgba(pal.ink, 0.1 * introEdge);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      const l = P([ax, ay, az]);
      ctx.fillStyle = rgba(pal.ink, 0.4 * introEdge);
      ctx.fillText(nm, l[0], l[1]);
    });

    // Vectors from the origin for whatever is in focus.
    const arrowIdx = active ? members[active] : (querying ? hits.map(h => h.i) : []);
    arrowIdx.forEach(i => {
      const s = S[i];
      const dx = s.x - O[0], dy = s.y - O[1], L = Math.hypot(dx, dy);
      if (L < 8) return;
      const ux = dx / L, uy = dy / L;
      const ex2 = s.x - ux * (s.rad0 + 2), ey2 = s.y - uy * (s.rad0 + 2);
      ctx.strokeStyle = rgba(pal.accent, (CHUNKS[i].main ? 0.5 : 0.28) * introEdge);
      ctx.beginPath();
      ctx.moveTo(O[0], O[1]); ctx.lineTo(ex2, ey2);
      ctx.moveTo(ex2, ey2); ctx.lineTo(ex2 - ux * 6 - uy * 3, ey2 - uy * 6 + ux * 3);
      ctx.moveTo(ex2, ey2); ctx.lineTo(ex2 - ux * 6 + uy * 3, ey2 - uy * 6 - ux * 3);
      ctx.stroke();
    });

    // Hairlines between chunks.
    edges.forEach(([i, j]) => {
      const a = S[i], b = S[j];
      const pi = CHUNKS[i].project, pj = CHUNKS[j].project;
      let col = pal.ink, al = pal.edge;
      if (active) {
        if (pi === active && pj === active) { col = pal.accent; al = 0.6; }
        else if (pi === active || pj === active) { col = pal.accent; al = 0.4; }
        else { al = 0.04; }
      } else if (querying) {
        al = 0.05;
      }
      al *= (0.45 + 0.55 * ((a.d + b.d) / 2)) * introEdge;
      ctx.strokeStyle = rgba(col, al);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    });

    // The print sheet: flat paper with a hairline frame and a mono label.
    if (sheetA > 0.003 && sheetP) {
      const Bx = sheetP.box;
      ctx.fillStyle = rgba(pal.paper, 0.97 * sheetA);
      ctx.fillRect(Bx.sx0, Bx.sy0, Bx.sw, Bx.sh);
      ctx.strokeStyle = rgba(pal.ink, 0.2 * sheetA);
      ctx.strokeRect(Bx.sx0 + 0.5, Bx.sy0 + 0.5, Bx.sw - 1, Bx.sh - 1);
      ctx.font = mono; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = rgba(pal.ink, 0.6 * sheetA);
      ctx.fillText(META[sheetP.key].label.toUpperCase(), Bx.x0, Bx.y0 + Bx.h + 20);
    }

    // Ink dust and print dots, batched by alpha (8 buckets, one fill each).
    for (let b = 0; b < 8; b++) {
      ctx.fillStyle = rgba(pal.ink, (b + 0.5) / 8);
      ctx.beginPath();
      for (let i = 0; i < NP; i++) {
        const al = dA[i];
        if (al < 0.03 || Math.min(7, (al * 8) | 0) !== b) continue;
        const r = dR[i];
        if (r < 0.15) continue;
        const x = px[i], y = py[i];
        if (r < 1) ctx.rect(x - r, y - r, 2 * r, 2 * r);
        else { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
      }
      ctx.fill();
    }

    // Neighbour hairlines and cosine labels for the active project.
    const cS = {};
    KEYS.forEach(k => {
      let sx = 0, sy = 0;
      members[k].forEach(i => { sx += S[i].x; sy += S[i].y; });
      cS[k] = [sx / members[k].length, sy / members[k].length];
    });
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    if (active) {
      nearProjects[active].forEach(nk => {
        const a = cS[active], b = cS[nk];
        ctx.strokeStyle = rgba(pal.accent, 0.4 * introEdge);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.fillStyle = rgba(pal.accent, 0.85 * introEdge);
        ctx.fillText(cosine(centroid[active], centroid[nk]).toFixed(2), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 8);
      });
    }

    // Query point and its retrieved chunks.
    if (qT > 0.01 && hits.length) {
      const q = P(qPos);
      hits.forEach(h => {
        const s = S[h.i];
        ctx.strokeStyle = rgba(pal.accent, 0.5 * qT);
        ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(s.x, s.y); ctx.stroke();
        ctx.fillStyle = rgba(pal.accent, 0.85 * qT);
        ctx.fillText(cosine(qPos, CHUNKS[h.i].pos).toFixed(2), (q[0] + s.x) / 2, (q[1] + s.y) / 2 - 8);
      });
      ctx.strokeStyle = rgba(pal.accent, qT);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, TAU); ctx.stroke();
      ctx.lineWidth = 1;
    }

    // Chunk points. The active project's points are red. Other points
    // under the paper are hidden.
    const order = S.map((s, i) => i).sort((a, b) => S[a].z - S[b].z);
    const sheetOn = sheetA > 0.3 && sheetP ? sheetP.box : null;
    order.forEach(i => {
      const s = S[i], p = pts[i];
      if (sheetOn && !(active && CHUNKS[i].project === active) && inBox(s.x, s.y, sheetOn)) return;
      const x = (0.3 + 0.6 * s.d) * (1 - 0.8 * p.dim);
      const a = x + (0.95 - x) * p.acc;
      const r = s.rad0 * (1 + 0.25 * p.acc);
      ctx.fillStyle = rgba(mix(pal.ink, pal.accent, p.acc), a);
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, TAU);
      ctx.fill();
    });

    if (hoverIdx >= 0) {
      const s = S[hoverIdx];
      const label = META[hovered].label;
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      const w = ctx.measureText(label).width;
      let lx = s.x + 12;
      if (lx + w > W - 12) lx = s.x - 12 - w;
      ctx.fillStyle = rgba(pal.ink, 0.95);
      ctx.fillText(label, lx, s.y - 12);
      // Detail points also show the chunk they hold.
      const txt = CHUNKS[hoverIdx].text;
      if (txt) {
        ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const words = txt.split(' '), lines = [];
        let ln = '';
        words.forEach(wd => {
          const tryLn = ln ? ln + ' ' + wd : wd;
          if (ctx.measureText(tryLn).width > 260 && ln) { lines.push(ln); ln = wd; } else ln = tryLn;
        });
        lines.push(ln);
        const tw = Math.max(...lines.map(l => ctx.measureText(l).width));
        let tx = s.x + 12;
        if (tx + tw > W - 12) tx = s.x - 12 - tw;
        ctx.fillStyle = rgba(pal.ink, 0.6);
        lines.slice(0, 4).forEach((l, n) => ctx.fillText(l, tx, s.y + 8 + n * 16));
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------------
  window.addEventListener('resize', () => {
    resize();
    if (print) layoutPrint(print);
    if (sheetP && sheetP !== print) layoutPrint(sheetP);
    if (selected) drawScrub();
  });
  loadGrids();
  const stored = storedTheme();
  setTheme(stored ? stored === 'dark' : darkMq.matches, false);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
