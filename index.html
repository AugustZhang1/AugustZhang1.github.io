  .top {

  .name { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .role { margin: 0; font-size: 13px; color: var(--muted); }

    display: flex; align-items: center; flex-wrap: wrap;

    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;

  .nav a { text-decoration: none; opacity: 0.7; transition: opacity .2s ease, color .2s ease; }
  .nav a:hover, .nav a:focus-visible { opacity: 1; color: var(--accent); outline: none; }

  .theme {
    width: 28px; height: 28px;
    padding: 0;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .theme:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .theme .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
  }
  :root[data-theme="dark"] .theme .dot { background: transparent; border: 1.5px solid currentColor; }

  .detail {
    position: fixed;
    right: 36px; top: 112px; bottom: 36px;
    width: 340px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
    padding-right: 4px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    z-index: 2;

  .detail::-webkit-scrollbar-track { background: transparent; }

  .detail.open { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }

  .back {
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;

    pointer-events: none;

    width: 100%;
    padding: 8px 2px;
    border: 0; border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    outline: none;
    transition: border-color .2s ease;
  }
  .query input::placeholder { color: var(--muted); }
  .query input:focus { border-color: var(--accent); }

  .peek {
    position: fixed; left: 0; top: 0;
    width: 280px; aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 1;

  .peek iframe {

  // ---------------------------------------------------------------------
  // LAYOUT. Each project is its own galaxy in a void of its own. Centres sit
  // on a loose shell, each project taking the slot nearest its embedding
  // direction, so related work lands nearby. Stars are generated once from
  // the seed; per frame they are only turned and projected.
  // ---------------------------------------------------------------------
  const KEYS = Object.keys(META);
  const NK = KEYS.length;
  const KINDS = ['tight', 'loose', 'barred', 'tight', 'elliptical', 'loose', 'barred', 'tight', 'elliptical', 'loose', 'barred', 'tight'];
  const TIGHT = { tight: 4.2, loose: 2.2, barred: 2.8, elliptical: 0 };

  // The generator stores normalized, quantized rows so this page stays static.
  // EMBEDDING_DECODE_BEGIN
  const EMBED_DATA = window.EMBED;
  const E_DIM = EMBED_DATA.dim;
  function decodeRows(encoded, rows, dim) {
    const raw = atob(encoded), out = [];
    for (let r = 0; r < rows; r++) {
      const row = new Float32Array(dim);
      let n = 0;
      for (let j = 0; j < dim; j++) {
        let q = raw.charCodeAt(r * dim + j);
        if (q > 127) q -= 256;
        row[j] = q / 127;
        n += row[j] * row[j];
      }
      n = Math.sqrt(n) || 1;
      for (let j = 0; j < dim; j++) row[j] /= n;
      out.push(row);
    }
    return out;
  }
  function decodeFloatRows(encoded, rows, dim) {
    const raw = atob(encoded), bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const values = new Float32Array(bytes.buffer), out = [];
    for (let r = 0; r < rows; r++) out.push(values.slice(r * dim, (r + 1) * dim));
    return out;
  }
  const CHUNK_EMB = decodeRows(EMBED_DATA.chunks, CHUNKS.length, E_DIM);
  const VOCAB_EMB = decodeRows(EMBED_DATA.vocab, EMBED_DATA.vocabTerms.length, E_DIM);
  const POS = EMBED_DATA.pos;
  // Project centroids share the centred, reduced space used by chunks/queries.
  const PROJECT_EMB_ROWS = decodeFloatRows(EMBED_DATA.centroids, EMBED_DATA.centroidIds.length, E_DIM);
  const PROJECT_EMB = new Map(EMBED_DATA.centroidIds.map((key, i) => [key, PROJECT_EMB_ROWS[i]]));
  // EMBEDDING_DECODE_END

  const count = {}, dirSum = {};
  CHUNKS.forEach(c => {
    count[c.project] = (count[c.project] || 0) + 1;
    const a = dirSum[c.project] || (dirSum[c.project] = [0, 0, 0]);
    const p = POS[c.id];
    a[0] += p[0]; a[1] += p[1]; a[2] += p[2];
  });

  const shell = [];
  for (let i = 0; i < NK; i++) {
    const y = 1 - 2 * (i + 0.5) / NK, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
    shell.push(unit([Math.cos(th) * r, y, Math.sin(th) * r]));
  }
  const taken = new Array(NK).fill(false);
  const CENTER = {};
  KEYS.forEach(k => {
    const d = unit(dirSum[k]);
    let best = -1, bd = -Infinity;
    shell.forEach((s, j) => {
      const dd = s[0] * d[0] + s[1] * d[1] + s[2] * d[2];
      if (!taken[j] && dd > bd) { bd = dd; best = j; }
    });
    taken[best] = true;
    CENTER[k] = shell[best].map(v => v * (3.6 + 1.4 * rnd()));
  });
  CENTER.pet = [4.4, 2.6, -3.2];   // the black hole sits at the edge of the projects

  // Galaxies: bulge (bucket 3), arm stars (1, 2), halo (0). Each galaxy
  // gets a seeded morphology, tilt, spin, palette and star field.
  const GAL = {};
  KEYS.forEach((k, idx) => {
    const hole = k === 'pet';
    const kind = hole ? 'hole' : KINDS[idx % KINDS.length];
    const elliptical = kind === 'elliptical';
    const n = count[k];
    const R = hole ? 0.32 : 0.14 + 0.03 * n;
    const arms = elliptical ? 1 : kind === 'tight' ? 2 + Math.floor(rnd() * 3) : 2;
    const tw = TIGHT[kind];
    const armAng = (f, a) => a * TAU / arms + tw * Math.log(1 + 3 * f);

    // Random disc orientation (the galaxy's tilt).
    const uz = rnd() * 2 - 1, ph = rnd() * TAU, sq = Math.sqrt(1 - uz * uz);
    const N = [sq * Math.cos(ph), sq * Math.sin(ph), uz];
    const E1 = unit(cross(N, Math.abs(N[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    const E2 = cross(N, E1);

    const Ns = 2000 + 500 * Math.min(n, 4);
    const nBulge = Math.round(Ns * (elliptical ? 0.7 : 0.12));
    const nHalo = Math.round(Ns * (elliptical ? 0.3 : 0.18));
    const nArm = elliptical ? 0 : Ns - nBulge - nHalo;
    const bk = [[], [], [], []];
    const put = (b, x, y, z) => bk[b].push(x, y, z);
    if (hole) {
      // Accretion disc: thin, hottest and densest near the horizon.
      for (let i = 0; i < Ns; i++) {
        const f = 0.3 + 0.7 * Math.pow(rnd(), 1.8), th = rnd() * TAU, r = R * f;
        put(f < 0.4 ? 3 : f < 0.55 ? 2 : f < 0.75 ? 1 : 0, r * Math.cos(th), r * Math.sin(th), gauss() * 0.01 * R);
      }
    } else for (let i = 0; i < nBulge; i++) {
      const s = elliptical ? 0.32 : 0.09;
      put(elliptical && rnd() < 0.4 ? 2 : 3, gauss() * s * R, gauss() * s * R * (elliptical ? 0.8 : 1), gauss() * s * R * 0.6);
    }
    if (!hole) for (let i = 0; i < nHalo; i++) put(0, gauss() * 0.45 * R, gauss() * 0.45 * R, gauss() * 0.3 * R);
    if (!hole) for (let i = 0; i < nArm; i++) {
      if (kind === 'barred' && rnd() < 0.25) {
        put(2, (2 * rnd() - 1) * 0.5 * R, gauss() * 0.03 * R, gauss() * 0.01 * R);
        continue;
      }
      const f = 0.1 + 0.9 * Math.pow(rnd(), 0.8);
      const th = armAng(f, Math.floor(rnd() * arms)) + gauss() * (0.06 + 0.05 * f);
      const r = R * f * (1 + 0.05 * gauss());
      put(rnd() < 0.45 ? 2 : 1, r * Math.cos(th), r * Math.sin(th), gauss() * 0.012 * R);
    }

    // Dust lanes sit on the inner edge of each arm.
    const dust = [];
    if (!elliptical && !hole) {
      for (let i = 0; i < 140; i++) {
        const f = 0.25 + 0.7 * rnd();
        const th = armAng(f, Math.floor(rnd() * arms)) - 0.14;
        dust.push(R * f * Math.cos(th), R * f * Math.sin(th), gauss() * 0.004 * R);
      }
    }

    const X = [], bStart = [0];
    bk.forEach(arr => { for (let i = 0; i < arr.length; i++) X.push(arr[i]); bStart.push(X.length / 3); });

    // Chunks become brighter stars on the arms, in their stored order.
    const chunkIdx = [];
    let j = 0;
    CHUNKS.forEach((c, i) => {
      if (c.project !== k) return;
      const f = 0.3 + 0.6 * ((Math.floor(j / arms) + 0.5) / Math.ceil(n / arms));
      const th = elliptical || hole ? j * 2.4 : armAng(f, j % arms), r = R * (hole ? 0.6 + 0.2 * f : f);
      c.local = [r * Math.cos(th), r * Math.sin(th), 0.01 * R * gauss()];
      chunkIdx.push(i);
      j++;
    });

    // Stars nearest the core first, for plugin animations.
    const Xf = new Float32Array(X), Nst = Xf.length / 3;
    const rad2 = q => Xf[3 * q] ** 2 + Xf[3 * q + 1] ** 2 + Xf[3 * q + 2] ** 2;
    const inner = Int32Array.from(Array.from({ length: Nst }, (_, q) => q)
      .sort((a, b) => rad2(a) - rad2(b)));

    const core = hole ? [255, 214, 160] : CORE_PAL[Math.floor(rnd() * CORE_PAL.length)];
    const arm = hole ? [255, 130, 70] : ARM_PAL[Math.floor(rnd() * ARM_PAL.length)];
    GAL[k] = {
      key: k, kind, R, N: hole ? [0, 1, 0] : N, E1: hole ? [1, 0, 0] : E1, E2: hole ? [0, 0, -1] : E2, A: [0, 0, 0], B: [0, 0, 0],
      core: CENTER[k],
      phase: rnd() * TAU,
      omega: hole ? 0.5 : (rnd() < 0.5 ? -1 : 1) * (0.05 + 0.06 * rnd()),   // rad/s, own axis
      hole,
      delay: rnd(),
      bcol: [arm, mix(arm, core, 0.35), mix(core, arm, 0.45), core],
      ccol: mix(core, WHITE, 0.5),
      X: Xf, bStart, Ns: Nst, inner,
      D: new Float32Array(dust), nDust: dust.length / 3,
      chunkIdx,
      gi: 0, alpha: 0, acc: 0, dim: 0, lit: 0,
      vis: false, sx: 0, sy: 0, k: 1, px: 0
    };
  });

  // Embedding centroid per project (real data), for cosine labels.
  // SEARCH_COSINE_BEGIN
  const embCosine = (a, b) => {
    let d = 0, aa = 0, bb = 0;
    for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; aa += a[i] * a[i]; bb += b[i] * b[i]; }
    return d / (Math.sqrt(aa * bb) || 1);
  };
  // SEARCH_COSINE_END
  const EMB = {};
  KEYS.forEach(k => {
    EMB[k] = PROJECT_EMB.get(k);
  });

  const nearProjects = {};
  KEYS.forEach(k => {
    nearProjects[k] = KEYS.filter(o => o !== k)
      .sort((a, b) => embCosine(EMB[k], EMB[b]) - embCosine(EMB[k], EMB[a]))
      .slice(0, 2);
  });

  const root = document.documentElement;
  const cv = document.getElementById('cloud');
  const ctx = cv.getContext('2d');
  const themeBtn = document.getElementById('themeBtn');
  const detail = document.getElementById('detail');
  const backBtn = document.getElementById('backBtn');
  const dCat = document.getElementById('dCat');
  const dSub = document.getElementById('dSub');
  const dTitle = document.getElementById('dTitle');
  const dStats = document.getElementById('dStats');
  const dDesc = document.getElementById('dDesc');
  const dTech = document.getElementById('dTech');
  const dLinks = document.getElementById('dLinks');
  const scrubWrap = document.getElementById('scrubWrap');
  const scCanvas = document.getElementById('scrubCanvas');
  const sctx = scCanvas.getContext('2d');

  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMq.matches;
  reduceMq.addEventListener('change', e => { reduce = e.matches; });

  // ---------------------------------------------------------------------
  // THEME
  // ---------------------------------------------------------------------
  const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  let dark = false;
  let pal = PAL.light;
  function storedTheme() {
    try { return localStorage.getItem('theme'); } catch (e) { return null; }
  }
  function setTheme(isDark, persist) {
    dark = isDark;
    pal = dark ? PAL.dark : PAL.light;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    if (persist) { try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} }
    if (selected) drawScrub();
  }
  themeBtn.addEventListener('click', () => setTheme(!dark, true));
  darkMq.addEventListener('change', e => { if (!storedTheme()) setTheme(e.matches, false); });

  // ---------------------------------------------------------------------
  // CANVAS SIZE
  // ---------------------------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // STATE, CAMERA AND PROJECTION
  // ---------------------------------------------------------------------
  const CAM = 7;          // reference camera distance (scale 1 at the focus)
  const CAM0 = 12;        // overview camera distance
  let cam = CAM0;         // current camera distance; zooming out dollies back
  let zoomGoal = 1;       // wheel target for userZoom (eased)
  const cluster = { on: false, x: 0, y: 0, r: 0 };   // "my projects" ring when zoomed far out
  const ZIN = 10;         // zoom multiplier when flown into a galaxy
  const OVER = 0.13;      // overview scale, fraction of min(W, H) per unit
  const INTRO_S = 2.2;    // galaxy fade-in length, seconds
  const ZERO = [0, 0, 0];
  const t0 = performance.now();
  let last = t0;
  let t = 0;               // seconds, drives spin

        const p = nb.d;
        const x1 = cyN * p[0] + syN * p[2], z1 = -syN * p[0] + cyN * p[2];
        const z2 = sbN * p[1] + cbN * z1;
        if (z2 > 0.3) return;
        const y1 = cbN * p[1] - sbN * z1;
        nb.blobs.forEach(b => drawGlow(ctx, cxD + (x1 + b[0]) * R0, cyD - (y1 + b[1]) * R0, b[2] * R0, nb.a * fade, nb.col));
      });
    }
    // Starfield layers: each rotates a little less than the last, for parallax.
    if (sky && sky.ok()) ctx.drawImage(sky.layers({ W, H, DPR, R0, fade, dark, base, angX, angY }), 0, 0, W, H);
    else LAYERS.forEach(L => {
      if (!dark && L.a < 0.85) return;
      const cy = Math.cos(angY * L.f), sy = Math.sin(angY * L.f);
      const cb = Math.cos(angX * L.f), sb = Math.sin(angX * L.f);
      L.byTint.forEach((pts, ti) => {
        ctx.fillStyle = rgba(dark ? STAR_TINT[ti] : base, L.a * (dark ? 1 : 0.1) * fade);
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          const x1 = cy * p[0] + sy * p[2], z1 = -sy * p[0] + cy * p[2];
          const z2 = sb * p[1] + cb * z1;
          if (z2 >= 0) continue;
          ctx.fillRect(cxD + x1 * R0, cyD - (cb * p[1] - sb * z1) * R0, L.size, L.size);
        }
      });
    });
    // Far galaxies.
    const cyG = Math.cos(angY * 0.25), syG = Math.sin(angY * 0.25);
    const cbG = Math.cos(angX * 0.25), sbG = Math.sin(angX * 0.25);
    DEEP.forEach(G => {
      const p = G.d;
      const x1 = cyG * p[0] + syG * p[2], z1 = -syG * p[0] + cyG * p[2];
      const z2 = sbG * p[1] + cbG * z1;
      if (z2 >= 0) return;
      const y1 = cbG * p[1] - sbG * z1;
      const cx = cxD + x1 * R0, cy2 = cyD - y1 * R0, h = G.half;
      if (cx < -h || cx > W + h || cy2 < -h || cy2 > H + h) return;
      ctx.globalAlpha = clamp(0.4 - 0.6 * z2, 0.2, 1) * fade * (dark ? 1 : 0.15);
      ctx.drawImage(G.spr, cx - h, cy2 - h, 2 * h, 2 * h);
    });
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------
  // IMAGE GRIDS. A project's screenshot, logo or title becomes a luminance grid
  // that plugins can read through api.grid().
  // ---------------------------------------------------------------------
  const GCOLS = 60;
  const GRID = {};   // key -> { cols, rows, lum: Float32Array }

  function storeGrid(key, src, sw, sh, fit) {
    const ar = sw > 0 && sh > 0 ? sh / sw : 0.625;
    const cols = GCOLS;
    const rows = clamp(Math.round(cols * ar), 38, 64);
    const c = document.createElement('canvas');
    c.width = cols; c.height = rows;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    if (fit === 'contain') {
      // The whole logo, centred with about 12% padding. The padding stays transparent.
      const s = Math.min(cols * 0.76 / sw, rows * 0.76 / sh), dw = sw * s, dh = sh * s;
      g.drawImage(src, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    } else {
      g.drawImage(src, 0, 0, cols, rows);
    }
    const data = g.getImageData(0, 0, cols, rows).data;
    const lum = new Float32Array(cols * rows), al = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) {
      lum[i] = (0.2126 * data[i * 4] + 0.7152 * data[i * 4 + 1] + 0.0722 * data[i * 4 + 2]) / 255;
      al[i] = data[i * 4 + 3] / 255;
    }
    GRID[key] = { cols, rows, lum, al };
  }
  // Fallback: the project title as text, drawn to a canvas and sampled the same way.
  function titleGrid(key) {
    try {
      const c = document.createElement('canvas');
      c.width = 600; c.height = 400;
      const g = c.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, 600, 400);
      g.fillStyle = '#000000';
      g.font = '600 52px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      const lines = [];
      let ln = '';
      META[key].title.split(' ').forEach(w => {
        const tryLn = ln ? ln + ' ' + w : w;
        if (g.measureText(tryLn).width > 500 && ln) { lines.push(ln); ln = w; } else ln = tryLn;
      });
      lines.push(ln);
      const lh = 64, y0 = 200 - (lines.length - 1) * lh / 2;
      lines.forEach((l, n) => g.fillText(l, 300, y0 + n * lh));
      storeGrid(key, c, 600, 400);
    } catch (e) { /* no grid for this project */ }
  }
  function loadPortrait(k) {
    // Only projects with image grids load one for their plugin.
    if (!PORTRAIT_KEYS.includes(k)) return;
    const file = PEEK[k].logo || PEEK[k].img;
    if (!file) { titleGrid(k); return; }
    const img = new Image();
    img.onload = () => {
      try { storeGrid(k, img, img.naturalWidth || img.width, img.naturalHeight || img.height, PEEK[k].fit); }
      catch (e) { titleGrid(k); return; }   // unreadable (e.g. opened from file://)
    };
    img.onerror = () => titleGrid(k);
    img.src = IMG + file;
  }

  // ---------------------------------------------------------------------
  // SOLAR SYSTEM. One sun per chunk, one planet per key term in its text.
  // ---------------------------------------------------------------------
  function hash01(s, salt) {
    let h = 2166136261 ^ salt;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 10000) / 10000;
  }
  // Planet ellipses around the sun (screen space, camera-facing).
  function solarCaptionLines(c) {
    ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    return wrapLines(c.text, 340).slice(0, 4);
  }
  function solarPlanets(c, cx, cy, minWH) {
    const planets = c.terms.map((term, j) => {
      const h1 = hash01(term, 1), h2 = hash01(term, 2), h3 = hash01(term, 3);
      const a = minWH * (0.14 + 0.085 * j) * zs;
      const b = a * (0.45 + 0.4 * h1);
      const tilt = (h2 - 0.5) * 1.1;
      const speed = (0.5 / (0.7 + j * 0.5)) * (0.75 + 0.5 * h1) * (reduce ? 0 : 1);
      const ang = h3 * TAU + speed * t;
      const lx = a * Math.cos(ang), ly = b * Math.sin(ang);
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      return { term, a, b, tilt, r: 2 + 1.5 * h2, x: cx + lx * ct - ly * st, y: cy + lx * st + ly * ct };
    });
    const maxB = planets.reduce((m, p) => Math.max(m, p.b), 0);
    const lines = solarCaptionLines(c);
    const bottom = W <= 720 ? H * 0.44 : H - 24;
    const room = bottom - cy - 30 - (lines.length - 1) * 16 - 4;
    const fit = maxB > 0 ? Math.max(0, Math.min(1, room / maxB)) : 1;
    return fit < 1 ? planets.map(p => ({ ...p, a: p.a * fit, b: p.b * fit, x: cx + (p.x - cx) * fit, y: cy + (p.y - cy) * fit })) : planets;
  }

  // ---------------------------------------------------------------------
  // BREADCRUMB. Universe / galaxy / solar system, each crumb clickable.
  // ---------------------------------------------------------------------
  const crumbsEl = document.getElementById('crumbs');
  let crumbKey = '';
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '...' : s);
  function updateCrumbs() {
    const key = selected + '|' + sun;
    if (key === crumbKey) return;
    crumbKey = key;
    crumbsEl.innerHTML = '';
    crumbsEl.hidden = !selected;
    if (!selected) return;
    const items = [['Universe', closeProject], [META[selected].label, exitSun]];
    if (sun >= 0) items.push([clip(CHUNKS[sun].text, 42), null]);
    items.forEach(([label, fn], i) => {
      if (i) { const sep = document.createElement('span'); sep.textContent = '/'; sep.className = 'sep'; crumbsEl.appendChild(sep); }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'crumb'; b.textContent = label;
      if (fn) b.addEventListener('click', fn);
      crumbsEl.appendChild(b);
    });
  }

  // ---------------------------------------------------------------------
  // IN-GALAXY ANIMATIONS. Each plugin uses its galaxy's own stars, with flat
  // dots in the galaxy palette and one accent for key moments.
  // Time only runs while you are inside. Reduced motion shows a static end state.
  // ---------------------------------------------------------------------
  const ANIM_KEYS = ['league', 'minecraft', 'rag', 'arbitrage', 'audiobook', 'ark-eagle', 'medihub', 'arkproject', 'jobapply', 'sinai', 'senseway', 'reels', 'clerk', 'snake'];
  const PORTRAIT_KEYS = ['minecraft', 'league', 'sinai', 'senseway'];
  const MONO = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const ease3 = x => { const u = clamp(x); return 1 - Math.pow(1 - u, 3); };
  // Flat helpers use the supplied colour as given.
  const dotC = (c, x, y, r, col, a) => { if (a < 0.01) return; c.fillStyle = rgba(col, clamp(a)); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  const ringC = (c, x, y, r, col, a, lw = 1) => { if (a < 0.01) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); };
  const arcC = (c, x, y, r, a0, a1, col, a, lw = 1) => { if (a < 0.01 || a1 <= a0) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); };
  const lineC = (c, x0, y0, x1, y1, col, a, lw = 1) => { if (a < 0.01) return; c.strokeStyle = rgba(col, clamp(a)); c.lineWidth = lw; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); };
  const txtC = (c, s, x, y, col, a) => { if (a < 0.01) return; c.font = MONO; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = rgba(col, clamp(a)); c.fillText(s, x, y); };

  const ANIMS = {};
  // API handed to each anims/<key>.js plugin. Screen-space; R is the galaxy radius in px.
  function makeApi(k, rng) {
    const g = GAL[k];
    let sx = new Float32Array(0), sy = new Float32Array(0), sb = new Uint8Array(0), sFrame = -1;
    const bucketOf = i => { let b = 0; while (b < 3 && i >= g.bStart[b + 1]) b++; return b; };
    return {
      key: k, rng, TAU, clamp, mix, rgba, ease3, mono: MONO,
      meta: META[k],
      chunks: CHUNKS.filter(c => c.project === k && c.text),
      dark: () => dark,
      accent: () => pal.accent,
      ink: INK,
      // Galaxy star colours, faint to bright (4 x [r,g,b]), already toned for the theme.
      colors: () => g.bcol.map(c => (dark ? c : mix(c, INK, 0.55))),
      // Image grid of the project logo or screenshot, or null: { cols, rows, lum, al }.
      grid: () => GRID[k] || null,
      // This frame's screen positions of the galaxy's stars, innermost first (up to max).
      // Returns { n, x, y, b } where b is the brightness bucket 0..3.
      stars(max = 1500) {
        if (sFrame === frameNo && sx.length >= Math.min(max, g.inner.length)) return { n: Math.min(max, g.inner.length), x: sx, y: sy, b: sb };
        const n = Math.min(max, g.inner.length);
        if (sx.length < n) { sx = new Float32Array(n); sy = new Float32Array(n); sb = new Uint8Array(n); }
        for (let j = 0; j < n; j++) {
          const i = g.inner[j], q = 3 * i;
          if (toScreen(g, g.X[q], g.X[q + 1], g.X[q + 2])) { sx[j] = P[0]; sy[j] = P[1]; } else { sx[j] = -1e4; sy[j] = -1e4; }
          sb[j] = bucketOf(i);
        }
        sFrame = frameNo;
        return { n, x: sx, y: sy, b: sb };
      },
      dot: dotC, ring: ringC, arc: arcC, line: lineC, text: txtC,
      // Light theme: ink on paper carries less weight than glow on black, so a plugin can call
      // api.lightBoost() first to raise alphas, dot sizes and line widths in light only; text gets
      // darker ink (the accent is kept). Dark passes straight through. { dots: false } skips dots.
      lightBoost({ dots = true } = {}) {
        const A = this, D = A.dot, Rg = A.ring, Ln = A.line, Ar = A.arc, Tx = A.text, Rb = A.rgba;
        const lt = (a, k = 1.4) => Math.min(1, a * k);
        if (dots) A.dot = (c, x, y, r, col, a) => dark ? D(c, x, y, r, col, a) : D(c, x, y, r * 1.12, col, lt(a));
        A.ring = (c, x, y, r, col, a, lw = 1) => dark ? Rg(c, x, y, r, col, a, lw) : Rg(c, x, y, r, col, lt(a), lw * 1.15);
        A.arc = (c, x, y, r, a0, a1, col, a, lw = 1) => dark ? Ar(c, x, y, r, a0, a1, col, a, lw) : Ar(c, x, y, r, a0, a1, col, lt(a), lw * 1.15);
        A.line = (c, x0, y0, x1, y1, col, a, lw = 1) => dark ? Ln(c, x0, y0, x1, y1, col, a, lw) : Ln(c, x0, y0, x1, y1, col, lt(a), lw * 1.15);
        A.text = (c, s, x, y, col, a) => {
          if (dark) return Tx(c, s, x, y, col, a);
          const ac = pal.accent, isAcc = col[0] === ac[0] && col[1] === ac[1] && col[2] === ac[2];
          return Tx(c, s, x, y, isAcc ? col : mix(col, INK, 0.45), lt(a, 1.6));
        };
        A.rgba = (col, a) => dark ? Rb(col, a) : Rb(col, lt(a));
      }
    };
  }

  // Built on first use. Reduced motion runs the animation forward once, then holds that static end state.
  function animFor(k) {
    if (k in ANIMS) return ANIMS[k];
    const rng = mulberry32(101 + ANIM_KEYS.indexOf(k) * 977);
    // Each animation is registered by its plugin in anims/<key>.js.
    const plug = window.GALAXY_ANIMS[k];
    const an = plug ? plug(makeApi(k, rng)) : null;
    return an ? (ANIMS[k] = an) : null;
  }

  // ---------------------------------------------------------------------
  // LEVELS AND PANEL. Universe > galaxy (selected) > solar system (sun).
  // Opening a galaxy flies the camera in; closing flies back out.
  // ---------------------------------------------------------------------
  const holeCv = document.getElementById('hole');
  let blackHole = null, holeA = 0, holeShown = false;
  // Its shader builds in the background soon after load, so opening the project doesn't freeze.
  if (window.createBlackHole) setTimeout(() => { blackHole = window.createBlackHole(holeCv, () => { blackHole = null; }); }, 1500);
  function openProject(k) {
    if (selected !== k) sun = -1;
    selected = k;
    queryForm.classList.add('hidden');
    fillPanel(k);
    detail.classList.add('open');
    detail.scrollTop = 0;
  }
  function closeProject() {
    selected = null;
    constel = null;
    queryForm.classList.remove('hidden');
    sun = -1;
    detail.classList.remove('open');
  }
  function enterSun(i) { if (selected && GAL[selected].chunkIdx.includes(i)) { sun = i; tappedPlanet = -1; } }
  function exitSun() { sun = -1; tappedPlanet = -1; lastPlanets = []; }
  // Back and Esc go up one level.
  function goUp() {
    if (sun >= 0) exitSun();
    else if (selected) closeProject();
  }
  // Arrow keys at the solar level step between the galaxy's chunk stars.
  function stepSun(d) {
    const idx = GAL[selected].chunkIdx;
    const j = idx.indexOf(sun);
    sun = idx[(j + d + idx.length) % idx.length];
  }
  function fillPanel(k) {
    const m = META[k];
    dCat.textContent = m.cat;
    dSub.textContent = m.sub || '';
    dSub.hidden = !m.sub;
    dTitle.textContent = m.title;
    dStats.innerHTML = m.stats.map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`).join('');
    dStats.hidden = !m.stats.length;
    dDesc.textContent = m.desc;
    dTech.innerHTML = m.tech.map(x => `<li>${x}</li>`).join('');
    dLinks.innerHTML = m.links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join('');
    scrubWrap.hidden = !m.scrub;
    if (m.scrub) {
      scrubIdx = 30;
      drawScrub();
    }
  }
  backBtn.addEventListener('click', goUp);
  window.addEventListener('keydown', e => {
    const typing = e.target === qInput;
    if (tour.on && e.key === 'Escape') { e.preventDefault(); stopTour(); return; }
    // The search tour owns the keys: Esc cancels, Space tap skips, hold boosts.
    if (tour.on && !typing && !e.target.closest('button, a')) {
      if (/^[1-9]$/.test(e.key)) { e.preventDefault(); jumpTour(+e.key - 1); }
      else if (e.key === 'Enter' && tour.phase === 'dwell') { e.preventDefault(); openTourStop(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); skipTour(); }
      else if (e.key === ' ') { e.preventDefault(); if (!tour.spaceDown) { tour.spaceDown = true; tour.spaceAt = performance.now(); } }
      return;
    }
    if (e.key === 'Escape') { if (!typing) goUp(); }
    // A focused button or link keeps Enter; the panel keeps its keys (scrolling, the scrubber).
    else if (typing || e.target.closest('#detail') || (e.key === 'Enter' && e.target.closest('button, a'))) return;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const step = e.key === 'ArrowRight' ? 1 : -1;
      if (!selected) openProject(step > 0 ? KEYS[0] : KEYS[KEYS.length - 1]);
      else if (sun >= 0) stepSun(step);
      else openProject(KEYS[(KEYS.indexOf(selected) + step + KEYS.length) % KEYS.length]);
    } else if (selected && sun < 0 && (e.key === 'Enter' || e.key === 'ArrowDown')) {
      e.preventDefault();
      enterSun(GAL[selected].chunkIdx[0]);
    } else if (selected && e.key === 'ArrowUp') {
      e.preventDefault();
      goUp();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key !== ' ') return;
    const tap = tour.on && tour.spaceDown && performance.now() - tour.spaceAt < 180;
    tour.spaceDown = false;
    tour.boost = tour.on && tour.phase === 'flight' && tour.pointerDown && performance.now() - tour.pointerAt >= 180;
    tour.fast = tour.boost ? 2.5 : ((tour.phase === 'flight' || tour.phase === 'ignite') ? tour.skipRate : 1);
    if (tap && !tour.pointerDown) skipTour();
  });
  window.addEventListener('blur', () => { tour.pointerDown = false; tour.spaceDown = false; tour.boost = false; tour.fast = 1; });

  // Win-probability series (61 samples over 30 minutes) from anims/league.js.
  const SERIES = new Array(61).fill(0.5);
  let seriesReady = false;
  function loadSeries() {
    if (seriesReady) return;
    const an = animFor('league');
    if (!an || !an.wp) return;
    for (let i = 0; i <= 60; i++) SERIES[i] = an.wp[i * 2];
    seriesReady = true;
  }

  // ---------------------------------------------------------------------
  // WIN-PROBABILITY SCRUBBER (LeagueVODreview)
  // ---------------------------------------------------------------------
  let scrubIdx = 30;
  let scrubDrag = false;
  function drawScrub() {
    loadSeries();
    scCanvas.setAttribute('aria-valuenow', scrubIdx / 2);
    scCanvas.setAttribute('aria-valuetext', 'minute ' + (scrubIdx / 2).toFixed(1) + ', ' + Math.round(SERIES[scrubIdx] * 100) + '% win probability');
    const w = scCanvas.clientWidth, h = scCanvas.clientHeight;
    if (!w || !h) return;
    scCanvas.width = Math.round(w * DPR);
    scCanvas.height = Math.round(h * DPR);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.clearRect(0, 0, w, h);

    const top = 26, bot = h - 8;
    const X = i => (i / (SERIES.length - 1)) * w;
    const Y = p => top + (1 - p) * (bot - top);

    sctx.setLineDash([2, 3]);
    sctx.strokeStyle = rgba(pal.line, 0.22);
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, Y(0.5)); sctx.lineTo(w, Y(0.5)); sctx.stroke();
    sctx.setLineDash([]);

    sctx.strokeStyle = rgba(pal.line, 0.85);
    sctx.lineWidth = 1.5;
    sctx.lineJoin = 'round';
    sctx.beginPath();
    SERIES.forEach((p, i) => (i ? sctx.lineTo(X(i), Y(p)) : sctx.moveTo(X(i), Y(p))));
    sctx.stroke();

    const mx = X(scrubIdx), my = Y(SERIES[scrubIdx]);
    sctx.lineWidth = 1;
    sctx.strokeStyle = rgba(pal.line, 0.25);
    sctx.beginPath(); sctx.moveTo(mx, top - 6); sctx.lineTo(mx, bot); sctx.stroke();
    sctx.fillStyle = rgba(pal.accent, 1);
    sctx.beginPath(); sctx.arc(mx, my, 4, 0, Math.PI * 2); sctx.fill();

    sctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = rgba(pal.line, 0.6);
    sctx.textBaseline = 'top';
    sctx.textAlign = 'left';
    sctx.fillText(Math.round(SERIES[scrubIdx] * 100) + '%', 0, 2);
    sctx.textAlign = 'right';
    sctx.fillText('min ' + (scrubIdx / 2).toFixed(1), w, 2);
  }
  function setScrubFromEvent(e) {
    const r = scCanvas.getBoundingClientRect();
    const f = clamp((e.clientX - r.left) / r.width);
    scrubIdx = Math.round(f * (SERIES.length - 1));
    drawScrub();
  }
  scCanvas.addEventListener('pointerdown', e => {
    scrubDrag = true;
    scCanvas.setPointerCapture(e.pointerId);
    setScrubFromEvent(e);
  });
  scCanvas.addEventListener('pointermove', e => { if (scrubDrag) setScrubFromEvent(e); });
  const endScrubDrag = () => { scrubDrag = false; };
  scCanvas.addEventListener('pointerup', endScrubDrag);
  scCanvas.addEventListener('pointercancel', endScrubDrag);
  scCanvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      scrubIdx = clamp(scrubIdx + (e.key === 'ArrowRight' ? 1 : -1), 0, SERIES.length - 1);
      drawScrub();
    }
  });

  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // DRAW
  // ---------------------------------------------------------------------
  const toneC = c => (dark ? c : mix(c, INK, 0.68));
  // Screen position of a world point, or null if it is behind the camera.
  function pr(x, y, z) { return project(x, y, z) ? [P[0], P[1]] : null; }
  // Galaxy-local point to world.
  function localToWorld(g, loc, out) {
    for (let a = 0; a < 3; a++) out[a] = g.core[a] + loc[0] * g.A[a] + loc[1] * g.B[a] + loc[2] * g.N[a];
    return out;
  }
  function wrapLines(txt, maxW) {
    const words = txt.split(' '), lines = [];
    let ln = '';
    words.forEach(wd => {
      const tryLn = ln ? ln + ' ' + wd : wd;
      if (ctx.measureText(tryLn).width > maxW && ln) { lines.push(ln); ln = wd; } else ln = tryLn;
    });
    lines.push(ln);
    return lines;
  }

  // Thin axes through the scene origin. Hidden once you are inside a galaxy.
  function drawAxes(al) {
    if (al < 0.005) return;
    ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    [[1, 0, 0, 'x'], [0, 1, 0, 'y'], [0, 0, 1, 'z']].forEach(([ax, ay, az, nm]) => {
      const a = pr(-ax * 3.2, -ay * 3.2, -az * 3.2), b = pr(ax * 3.2, ay * 3.2, az * 3.2);
      const l = pr(ax * 3.0, ay * 3.0, az * 3.0);
      if (!a || !b || !l) return;
      ctx.strokeStyle = rgba(pal.line, 0.07 * al);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      ctx.fillStyle = rgba(pal.line, 0.25 * al);
      ctx.fillText(nm, l[0], l[1]);
    });
  }

  // Arrow from o to e, with a small head at e.
  function arrow(o, e, col, al) {
    const dx = e[0] - o[0], dy = e[1] - o[1], L = Math.hypot(dx, dy);
    if (L < 8) return;
    const ux = dx / L, uy = dy / L;
    ctx.strokeStyle = rgba(col, al);
    ctx.beginPath();
    ctx.moveTo(o[0], o[1]); ctx.lineTo(e[0], e[1]);
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[0] - ux * 6 - uy * 3, e[1] - uy * 6 + ux * 3);
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[0] - ux * 6 + uy * 3, e[1] - uy * 6 - ux * 3);
    ctx.stroke();
  }

  // BLACK HOLE, in the style of the film render: a thin white-gold disc, seen near
  // edge-on, crosses in front of the shadow, and light from the disc's far side is bent
  // into a thick bright halo over the top and a thinner one under the bottom. The disc
  // lies in the hole's 3D plane, so rotating the scene changes the view (edge-on to
  // face-on); the halo fades as the view opens up. Brightness is even on both sides, as
  // in the film (no Doppler beaming).
  const HOLE_HOT = [255, 244, 226], HOLE_GOLD = [255, 206, 140], HOLE_WARM = [255, 160, 80];
  const holeN = [0, 0, 0];
  const HOLE_P = (() => {
    const r = mulberry32(5), out = [];
    for (let i = 0; i < 320; i++) out.push([Math.pow(r(), 1.3), r() * TAU, 0.4 + 0.6 * r()]);
    return out;
  })();
  function holeGrad(r0, r1, stops) {
    const gr = ctx.createRadialGradient(0, 0, r0, 0, 0, r1);
    stops.forEach(([o, c, a]) => gr.addColorStop(o, rgba(c, a)));
    return gr;
  }
  function annulus(r0, r1) {
    ctx.beginPath(); ctx.arc(0, 0, r1, 0, TAU); ctx.arc(0, 0, r0, 0, TAU, true);
  }
  function drawHole(g, ga) {
    const rs = g.px * 0.2;   // shadow radius
    if (rs < 1.2) {
      ringC(ctx, g.sx, g.sy, Math.max(1.5, rs * 2), HOLE_GOLD, 0.9 * ga, 1);
      return;
    }
    // Disc orientation on screen from its normal in camera space.
    const Nc = rotPoint(g.N, holeN);
    let M = [Nc[1], -Nc[0], 0];
    const ML = Math.hypot(M[0], M[1]);
    M = ML < 1e-3 ? [1, 0, 0] : [M[0] / ML, M[1] / ML, 0];
    const m = cross(Nc, M);
    const rot = Math.atan2(-M[1], M[0]);
    const ry = Math.max(0.03, Math.abs(Nc[2]));
    const sg = Math.sign(-Math.sin(rot) * m[0] - Math.cos(rot) * m[1]) || 1;
    const flip = sg * m[2] > 0 ? 1 : -1;   // local +y is then the near half
    const lens = clamp(1 - 0.85 * ry);
    const glowOp = dark ? 'lighter' : 'source-over';

    ctx.save();
    ctx.translate(g.sx, g.sy);
    ctx.rotate(rot);
    ctx.scale(1, flip);
    ctx.globalCompositeOperation = glowOp;
    drawGlow(ctx, 0, 0, rs * 7, 0.22 * ga, HOLE_WARM);
    drawGlow(ctx, 0, 0, rs * 3, 0.3 * ga, HOLE_GOLD);

    const DISC0 = 1.3, DISC1 = 4.6;
    const spin = reduce ? 0 : t * 0.8;
    // One half of the disc (near = local y > 0): a smooth radial gradient squashed to the
    // viewing angle, plus streaming clumps of gas for texture and motion.
    const disc = near => {
      ctx.save();
      ctx.beginPath(); ctx.rect(-rs * 6, near ? 0 : -rs * 6, rs * 12, rs * 6); ctx.clip();
      ctx.scale(1, ry);
      ctx.globalAlpha = ga;
      ctx.fillStyle = holeGrad(rs * DISC0, rs * DISC1, [
        [0, HOLE_HOT, 0], [0.015, HOLE_HOT, 1], [0.12, HOLE_HOT, 0.85],
        [0.35, HOLE_GOLD, 0.45], [0.7, HOLE_WARM, 0.14], [1, HOLE_WARM, 0]
      ]);
      annulus(rs * DISC0, rs * DISC1); ctx.fill();
      ctx.restore();
      ctx.fillStyle = rgba(HOLE_HOT, 1);
      HOLE_P.forEach(([u, ph, b]) => {
        const an = ((ph + spin / Math.pow(0.3 + u, 1.5)) % TAU + TAU) % TAU;
        if ((an < Math.PI) !== near) return;
        const r = rs * (DISC0 + (DISC1 - DISC0) * 0.8 * u);
        ctx.globalAlpha = ga * 0.55 * b * (1 - u);
        ctx.fillRect(Math.cos(an) * r - 1.2, Math.sin(an) * r * ry - 0.5, 2.4, 1);
      });
    };

    disc(false);   // far half, behind the shadow
    // Lensed image of the far disc: a thick bright halo over the top, thinner underneath.
    if (lens > 0.01) {
      ctx.save();
      ctx.globalAlpha = ga * lens;
      ctx.beginPath(); ctx.rect(-rs * 6, -rs * 6, rs * 12, rs * 6 + rs * 0.02); ctx.clip();
      ctx.fillStyle = holeGrad(rs * 1.02, rs * 2.5, [
        [0, HOLE_HOT, 1], [0.08, HOLE_HOT, 0.9], [0.3, HOLE_GOLD, 0.5], [0.65, HOLE_WARM, 0.15], [1, HOLE_WARM, 0]
      ]);
      annulus(rs * 1.02, rs * 2.5); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = ga * lens * 0.8;
      ctx.beginPath(); ctx.rect(-rs * 6, 0, rs * 12, rs * 6); ctx.clip();
      ctx.fillStyle = holeGrad(rs * 1.02, rs * 1.5, [
        [0, HOLE_HOT, 1], [0.2, HOLE_GOLD, 0.55], [1, HOLE_WARM, 0]
      ]);
      annulus(rs * 1.02, rs * 1.5); ctx.fill();
      ctx.restore();
    }
    // Shadow, then the thin photon ring at its edge.
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba([0, 0, 0], clamp(ga * 1.3));
    ctx.beginPath(); ctx.arc(0, 0, rs, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = glowOp;
    ctx.globalAlpha = ga;
    ctx.strokeStyle = rgba(HOLE_HOT, 0.95);
    ctx.lineWidth = Math.max(1, rs * 0.03);
    ctx.beginPath(); ctx.arc(0, 0, rs * 1.015, 0, TAU); ctx.stroke();
    disc(true);    // near half, in front of the shadow
    ctx.restore();
  }

  function drawGalaxy(g) {
    if (!g.vis) return;
    const ga = guard(g.alpha, 'galaxy alpha');
    if (ga < 0.01) return;
    const tint = c => toneC(mix(c, pal.accent, g.acc * 0.35));
    const bcol = g.bcol.map(tint);
    const BA = dark ? [0.28, 0.5, 0.75, 0.92] : [0.38, 0.62, 0.85, 0.98];
    const BS = dark ? [0.9, 1.0, 1.35, 1.8] : [1.15, 1.3, 1.65, 2.15];
    // Level of detail: fewer stars when the galaxy is small on screen.
    const target = clamp(g.px * g.px * 0.5, 120, g.Ns);
    const stride = Math.max(1, Math.round(g.Ns / target));
    const dStride = Math.max(1, Math.round(g.nDust / Math.max(20, target * 0.25)));
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';

    // Beacon: when the galaxy is small on screen (zoomed far out), a glow of fixed
    // size keeps it findable among the background galaxies.
    if (g.px < 10 && !selected) {
      const bA = ga * clamp(1 - g.px / 10) * (dark ? 0.9 : 0.5);
      drawGlow(ctx, g.sx, g.sy, 11, bA, dark ? bcol[3] : pal.accent);
      ctx.fillStyle = rgba(dark ? WHITE : pal.accent, bA);
      ctx.beginPath(); ctx.arc(g.sx, g.sy, 1.6, 0, TAU); ctx.fill();
    }
    const anD = g.key === selected && ANIMS[g.key] ? clamp(ANIMS[g.key].spiralDim || 0) : 0;
    // Soft core glow (dark theme only).
    if (dark && g.px > 3 && !g.hole) {
      const rad = g.px * 0.5;
      // Wide halo so project galaxies outshine the background ones.
      const hr = g.px * 1.3 * (1 - 0.8 * zt);
      if (hr > 2) {
        const hg = ctx.createRadialGradient(g.sx, g.sy, 0, g.sx, g.sy, hr);
        hg.addColorStop(0, rgba(bcol[2], 0.22 * ga * (1 - anD)));
        hg.addColorStop(1, rgba(bcol[2], 0));
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(g.sx, g.sy, hr, 0, TAU); ctx.fill();
      }
      const grd = ctx.createRadialGradient(g.sx, g.sy, 0, g.sx, g.sy, rad);
      grd.addColorStop(0, rgba(bcol[3], 0.5 * ga * (1 - anD)));
      grd.addColorStop(0.35, rgba(bcol[3], 0.14 * ga * (1 - anD)));
      grd.addColorStop(1, rgba(bcol[3], 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(g.sx, g.sy, rad, 0, TAU); ctx.fill();
    }

    const spir = ga * (1 - anD);

    // Dust lanes, one batched fill.
    ctx.fillStyle = rgba(pal.dust, pal.dustA * spir);
    for (let i = 0; i < g.nDust; i += dStride) {
      if (!toScreen(g, g.D[3 * i], g.D[3 * i + 1], g.D[3 * i + 2])) continue;
      ctx.fillRect(P[0], P[1], 1.2, 1.2);
    }

    // At the solar level the 4x zoom would blow the hole up over the panel, so it fades out.
    const holeA = g.key === selected ? ga * (1 - zs) : ga;
    if (g.hole && holeA > 0.01) drawHole(g, holeA);

    // Arm, bulge and halo stars, one fill per brightness bucket.
    const X = g.X;
    if (!g.hole) for (let b = 0; b < 4; b++) {
      ctx.fillStyle = rgba(bcol[b], BA[b] * spir * (dark ? 1 : 1.15));
      const s1 = g.bStart[b + 1];
      for (let i = g.bStart[b]; i < s1; i += stride) {
        const q = 3 * i;
        if (!toScreen(g, X[q], X[q + 1], X[q + 2])) continue;
        const sx = P[0], sy = P[1];
        if (sx < -2 || sx > W + 2 || sy < -2 || sy > H + 2) continue;
        const s = BS[b] * clamp(P[2], 0.7, 1.4) * (dark ? 1 : 1.1);
        ctx.fillRect(sx, sy, s, s);
      }
    }

    if (g.key !== selected || sun >= 0) drawChunks(g);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Inside, chunk stars sit above the animation. Hover and search hits take the accent.
  function drawChunks(g) {
    if (!g.vis || g.alpha < 0.01) return;
    const ga = guard(g.alpha, 'chunk alpha');
    const inside = g.key === selected && sun < 0 ? zt : 0;
    const col = toneC(mix(g.ccol, pal.accent, g.acc * 0.35));
    const cFill = rgba(col, 0.95 * ga);
    const quiet = inside > 0 && ANIMS[g.key] && ANIMS[g.key].quietChunks;
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    g.chunkIdx.forEach(i => {
      if (i === sun) return;   // the sun is drawn over its own star
      const c = CHUNKS[i];
      if (!toScreen(g, c.local[0], c.local[1], c.local[2])) return;
      const hot = hoverIdx === i;
      const hitStar = !hot && qT > 0.01 && hitSet.has(i);
      if (inside > 0 && (!quiet || hot || hitStar)) {
        const breath = reduce ? 0 : Math.sin(t * TAU / 3.6 + i * 2.4);
        ctx.lineWidth = 0.75;
        ctx.strokeStyle = rgba(hot || hitStar ? pal.accent : col, (0.3 + 0.05 * breath) * ga * inside);
        ctx.beginPath(); ctx.arc(P[0], P[1], 6.5 + 0.5 * breath, 0, TAU); ctx.stroke();
      }
      const calm = quiet && !hot && !hitStar;
      ctx.fillStyle = hot || hitStar ? rgba(pal.accent, ga) : calm ? rgba(col, 0.3 * ga) : cFill;
      const r = calm ? 1.2 : ((hot ? 2.6 : hitStar ? 2.2 : 1.5) + 0.9 * inside) * clamp(P[2], 0.7, 1.4);
      ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, TAU); ctx.fill();
    });
    ctx.lineWidth = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // The solar system of the open chunk: a sun, orbits, planets and a caption.
  function drawSolar(g, c, planets, hovP) {
    const k = zs;
    const sx = sunSX, sy = sunSY;
    const Rs = Math.min(W, H) * 0.022;
    const sunC = toneC(g.bcol[3]);
    const pc = toneC(g.ccol);
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    ctx.lineWidth = 1;
    let maxB = 0;
    planets.forEach(p => {
      maxB = Math.max(maxB, p.b);
      ctx.strokeStyle = rgba(pal.line, 0.1 * k);
      ctx.beginPath(); ctx.ellipse(sx, sy, p.a, p.b, p.tilt, 0, TAU); ctx.stroke();
    });
    if (dark) {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, Rs * 6);
      grd.addColorStop(0, rgba(sunC, 0.45 * k));
      grd.addColorStop(0.25, rgba(sunC, 0.12 * k));
      grd.addColorStop(1, rgba(sunC, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, Rs * 6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = rgba(sunC, k);
    ctx.beginPath(); ctx.arc(sx, sy, Rs, 0, TAU); ctx.fill();
    planets.forEach((p, j) => {
      const hot = j === hovP;
      ctx.fillStyle = hot ? rgba(pal.accent, k) : rgba(pc, 0.9 * k);
      ctx.beginPath(); ctx.arc(p.x, p.y, hot ? p.r * 1.6 : p.r, 0, TAU); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';

    ctx.textBaseline = 'alphabetic';
    if (hovP >= 0) {
      const p = planets[hovP];
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = rgba(pal.accent, k);
      ctx.fillText(p.term, p.x + 10, p.y - 8);
    }
    // Caption: the chunk text, small, below the orbits.
    ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(pal.line, 0.7 * k);
    wrapLines(c.text, 340).slice(0, 4).forEach((l, n) => ctx.fillText(l, sx, sy + maxB + 30 + n * 16));
  }

  // ---------------------------------------------------------------------
  // SEARCH TOUR DRAWING: speed streaks, the ribbon trail, the constellation, the
  // project card and the ship.
  // ---------------------------------------------------------------------
  const TRAIL_LIFE = 1.5;   // seconds the ribbon takes to fade
  const sstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const drawShip = window.createShip ? window.createShip() : null;
  const STREAKS = (() => { const r = mulberry32(11); return Array.from({ length: 70 }, () => [r(), r(), 0.4 + 0.6 * r()]); })();
  const CA = [0, 0, 0], CB = [0, 0, 0], CC = [0, 0, 0];

  // One line of the figure, drawn along the path the ship flew. p = how far it has got.
  function drawLink(ha, hb, local, p, alpha, bend) {
    starWorld(ha, CA); starWorld(hb, CB);
    arcPoint(CA, CB, arcOf(local), CC);
    if (bend && !local) for (let a = 0; a < 3; a++) CC[a] = (CA[a] + CB[a]) / 2 + bend[a];
    const steps = local ? 1 : 24;
    ctx.strokeStyle = rgba(pal.accent, alpha);
    ctx.beginPath();
    let pen = false;
    for (let n = 0; n <= steps; n++) {
      const e = n / steps * p, f = 1 - e;
      const ok = project(f * f * CA[0] + 2 * f * e * CC[0] + e * e * CB[0], f * f * CA[1] + 2 * f * e * CC[1] + e * e * CB[1], f * f * CA[2] + 2 * f * e * CC[2] + e * e * CB[2]);
      if (!ok) { pen = false; continue; }
      if (pen) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]);
      pen = true;
    }
    ctx.stroke();
  }
  function drawNode(c, a, active) {
    if (!c.vis) return;
    if (dark) ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, c.sx, c.sy, active ? 14 : 9, (active ? 0.6 : 0.4) * a, pal.accent);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(pal.accent, a);
    ctx.beginPath(); ctx.arc(c.sx, c.sy, active ? 3 : 2.2, 0, TAU); ctx.fill();
    if (active) { ctx.strokeStyle = rgba(pal.accent, 0.7 * a); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(c.sx, c.sy, 9, 0, TAU); ctx.stroke(); }
  }
  // The star the ship is inside: faint planet orbits while it is there, and a ring that
  // flashes outward as it enters and again as it leaves.
  function drawStarSystem(c) {
    if (!c.vis) return;
    const a = tour.inside;
    ctx.lineWidth = 1;
    [[17, 0.9, 0.4], [28, -0.55, 2.2]].forEach(([r, speed, phase]) => {
      ctx.strokeStyle = rgba(pal.accent, 0.3 * a);
      ctx.beginPath(); ctx.ellipse(c.sx, c.sy, r, r * 0.46, -0.3, 0, TAU); ctx.stroke();
      const an = phase + t * speed, x = Math.cos(an) * r, y = Math.sin(an) * r * 0.46, co = Math.cos(-0.3), si = Math.sin(-0.3);
      ctx.fillStyle = rgba(pal.accent, 0.9 * a);
      ctx.beginPath(); ctx.arc(c.sx + x * co - y * si, c.sy + x * si + y * co, 1.7, 0, TAU); ctx.fill();
    });
  }
  function drawFlash(c, u) {
    if (!c || !c.vis || u >= 1) return;
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = rgba(pal.accent, 0.7 * (1 - u));
    ctx.beginPath(); ctx.arc(c.sx, c.sy, 8 + 30 * u, 0, TAU); ctx.stroke();
  }
  function drawConstellation() {
    const landed = !tour.on && constel && selected === constel;
    if (!tour.on && !landed) return;
    const fade = landed ? 1 - zs : 1;
    if (fade < 0.01) return;
    const revealed = tour.on ? tour.revealA : 0;
    ctx.lineWidth = 1;
    for (let j = 1; j < tour.stops.length; j++) {
      const p = tour.lp[j];
      if (p <= 0) continue;
      const same = stopProject(j) === stopProject(j - 1);
      if (landed && (!same || stopProject(j) !== constel)) continue;
      drawLink(tour.stops[j - 1], tour.stops[j], same, p, (same ? 0.8 : 0.42 + 0.3 * revealed) * fade, tour.bend[j]);
    }
    tour.extras.forEach(x => {
      if (revealed <= 0) return;
      const to = tour.stops[x.to];
      drawLink(to, x.h, CHUNKS[to.i].project === CHUNKS[x.h.i].project, revealed, 0.3 * revealed);
      drawNode(CHUNKS[x.h.i], 0.6 * revealed, false);
    });
    tour.stops.forEach((h, n) => {
      if (n > tour.reached) return;
      const c = CHUNKS[h.i];
      if (landed && c.project !== constel) return;
      drawNode(c, fade, tour.on && n === tour.cap);
    });
    if (!tour.on) return;
    const here = tour.stops[tour.j] && CHUNKS[tour.stops[tour.j].i];
    if (tour.inside > 0.02 && here && tour.phase !== 'reveal') drawStarSystem(here);
    if (tour.phase === 'dwell') drawFlash(here, tour.u / 0.5);
    if (tour.phase === 'flight' && tour.j > 0) drawFlash(CHUNKS[tour.stops[tour.j - 1].i], tour.u / 0.35);
  }
  function drawTour(sm, dt) {
    if (rocketA < 0.01 && capA < 0.01 && !trailCount && !tour.on && !constel) return;
    captionBox.visible = false;
    const hasRp = project(tour.pos[0], tour.pos[1], tour.pos[2]);
    const rpx = hasRp ? P[0] : -1e4, rpy = hasRp ? P[1] : -1e4;
    const flying = tour.on && (tour.phase === 'flight' || tour.phase === 'ignite');
    const orienting = tour.on && tour.phase !== 'idle';
    // Nose along the velocity, smoothed so turns at a stop swing round. The depth part
    // of the velocity pitches the ship, so it foreshortens as it flies in or out.
    if (hasRp && orienting) {
      const hasAp = project(tour.pos[0] + tour.tan[0] * 0.02, tour.pos[1] + tour.tan[1] * 0.02, tour.pos[2] + tour.tan[2] * 0.02);
      const apx = hasAp ? P[0] : rpx, apy = hasAp ? P[1] : rpy;
      if (hasAp && Math.hypot(apx - rpx, apy - rpy) > 0.01) {
        let d = Math.atan2(apy - rpy, apx - rpx) - rocketAng;
        d = Math.atan2(Math.sin(d), Math.cos(d));
        rocketAng += d * sm(8);
      }
      const v = rotPoint(tour.tan, CC), vl = Math.hypot(v[0], v[1], v[2]) || 1;
      shipPitch += (clamp(v[2] / vl, -0.6, 0.6) - shipPitch) * sm(5);
    }
    const turn = Math.atan2(Math.sin(rocketAng - lastRocketAng), Math.cos(rocketAng - lastRocketAng));
    const angularVelocity = dt > 0 ? turn / dt : 0;
    rocketRoll += (clamp(angularVelocity * 0.035, -0.32, 0.32) - rocketRoll) * sm(7); lastRocketAng = rocketAng;
    shipScale += ((tour.local ? 0.8 : 1) - shipScale) * sm(4);
    // The ship shrinks into a star on arrival and grows back out as it leaves.
    const inStar = tour.on && (tour.phase === 'dwell' || tour.phase === 'reveal' || tour.phase === 'land');
    tour.inside += ((inStar ? 1 : 0) - tour.inside) * sm(inStar ? 9 : 14);

    // (click it to fly back); once they spread apart, each gets its name.
    const nameA = (selected || tour.on) ? 0 : (1 - zt) * (1 - tourT);
    const farA = (1 - zt) * clamp((0.5 - userZoom) / 0.2);
    cluster.on = false;
    if (nameA > 0.01) {
      const vk = KEYS.filter(k => GAL[k].vis && k !== 'pet');
      const bh = GAL.pet;
      ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      const placed = [];
      if (hovered && GAL[hovered] && GAL[hovered].vis && sun < 0) {
        const ax = GAL[hovered].sx, ay = GAL[hovered].sy;
        const hw = ctx.measureText(META[hovered].label).width;
        let lx = ax + 12;
        if (lx + hw > W - 12) lx = Math.max(12, ax - 12 - hw);
        placed.push({ x0: lx - 4, y0: ay - 24, x1: lx + hw + 4, y1: ay + 2 });
      }
      const placeName = (g, text, alpha) => {
        const w = ctx.measureText(text).width, off = g.px + 6;
        const preferLeft = g.sx + off + w > W - 8;
        const candidates = preferLeft ? [
          [g.sx - off - w, g.sy],
          [g.sx - off - w, g.sy + 12],
          [g.sx - off - w, g.sy - 12],
          [g.sx + off, g.sy],
          [g.sx + off, g.sy + 12],
          [g.sx + off, g.sy - 12]
        ] : [
          [g.sx + off, g.sy],
          [g.sx + off, g.sy + 12],
          [g.sx + off, g.sy - 12],
          [g.sx - off - w, g.sy],
          [g.sx - off - w, g.sy + 12],
          [g.sx - off - w, g.sy - 12]
        ];
        for (let i = 0; i < candidates.length; i++) {
          const cx = candidates[i][0], cy = candidates[i][1];
          const nx = clamp(cx, 8, Math.max(8, W - 8 - w));
          const ny = clamp(cy, 10, H - 10);
          const b = { x0: nx - 2, y0: ny - 6, x1: nx + w + 2, y1: ny + 6 };
          if (!placed.some(p => !(b.x1 < p.x0 || b.x0 > p.x1 || b.y1 < p.y0 || b.y0 > p.y1))) {
            placed.push(b);
            ctx.fillStyle = rgba(pal.line, alpha);
            ctx.fillText(text, nx, ny);
            break;
          }
        }
      };
      if (bh.vis && hovered !== 'pet') {
        ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
        ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        placeName(bh, 'black hole?', 0.5 * nameA * bh.alpha);
      }
      if (vk.length) {
        let mx = 0, my = 0;
        vk.forEach(k => { mx += GAL[k].sx; my += GAL[k].sy; });
        mx /= vk.length; my /= vk.length;
        const spread = Math.max(...vk.map(k => Math.hypot(GAL[k].sx - mx, GAL[k].sy - my)));
        const packA = clamp((140 - spread) / 50);   // 1 when packed tight
        ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
        ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        if (packA < 1) vk.slice().sort((a, b) => GAL[b].k - GAL[a].k).forEach(k => {
          const g = GAL[k];
          if (k === hovered) return;
          placeName(g, META[k].short || META[k].label, 0.5 * nameA * (1 - packA) * g.alpha);
        });
        if (packA > 0 && farA > 0.01) {
          const r = spread + 18, a = farA * packA;
          Object.assign(cluster, { on: true, x: mx, y: my, r });
          ctx.strokeStyle = rgba(pal.accent, 0.55 * a);
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 4]);
          ctx.beginPath(); ctx.arc(mx, my, r, 0, TAU); ctx.stroke();
          ctx.setLineDash([]);
          ctx.textAlign = 'center';
          ctx.fillStyle = rgba(pal.accent, 0.9 * a);
          ctx.fillText('MY PROJECTS', mx, my - r - 12);
          ctx.fillStyle = rgba(pal.line, 0.45 * a);
          ctx.fillText('click to fly in', mx, my + r + 12);
        }
      }
    }

    const mono = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.font = mono; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';

    // Hover: faint lines to the 2 nearest galaxies, each with a cosine.
    if (hovered && !selected) {
      const g = GAL[hovered];
      if (g.vis) {
        nearProjects[hovered].forEach(nk => {
          const n2 = GAL[nk];
          if (!n2.vis) return;
          ctx.strokeStyle = rgba(pal.accent, 0.35 * g.gi);
          ctx.beginPath(); ctx.moveTo(g.sx, g.sy); ctx.lineTo(n2.sx, n2.sy); ctx.stroke();
          ctx.fillStyle = rgba(pal.accent, 0.85 * g.gi);
          ctx.fillText(cosine(EMB[hovered], EMB[nk]).toFixed(2), (g.sx + n2.sx) / 2, (g.sy + n2.sy) / 2 - 8);
        });
      }
    }

    // Query marker in the void, with lines and retrieval scores to its hit stars.
    if (qT > 0.01 && hits.length && sun < 0) {
      const q = pr(qWorld[0], qWorld[1], qWorld[2]);
      // When the hits sit in one galaxy the marker lands on top of it; push it to the side
      // (across the line from the origin) so the lines and scores can be read.
      const vh = hits.filter(h => CHUNKS[h.i].vis);
      if (q && O && vh.length) {
        const cx = vh.reduce((s, h) => s + CHUNKS[h.i].sx, 0) / vh.length;
        const cy = vh.reduce((s, h) => s + CHUNKS[h.i].sy, 0) / vh.length;
        // On the tour the marker returns to its true place: the rocket's launch point.
        const push = 110 * clamp(1 - Math.hypot(q[0] - cx, q[1] - cy) / 110) * (tour.on ? 0 : 1 - tourT);
        const ox = cx - O[0], oy = cy - O[1], ol = Math.hypot(ox, oy) || 1;
        q[0] -= oy / ol * push; q[1] += ox / ol * push;
      }
      if (q) {
        const labels = [];
        hits.forEach(h => {
          const c = CHUNKS[h.i];
          if (!c.vis) return;
          ctx.strokeStyle = rgba(pal.accent, 0.5 * qT * (1 - tourT));
          ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(c.sx, c.sy); ctx.stroke();
          ctx.fillStyle = rgba(pal.accent, 0.85 * qT * (1 - tourT));   // the stop caption shows the score
          const x = (q[0] + c.sx) / 2;
          let y = (q[1] + c.sy) / 2 - 8;
          while (labels.some(p => Math.abs(p.x - x) < 32 && Math.abs(p.y - y) < 14)) y += 14;
          labels.push({ x, y });
          ctx.fillText(h.score.toFixed(2), x, y);
        });
        ctx.strokeStyle = rgba(pal.accent, qT);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, TAU); ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    drawTour(sm, dt);

    // Hover label at the galaxy and galaxy levels: project name, plus the chunk text over a chunk.
    if (hovered && sun < 0) {
      const inside = hoverIdx >= 0;
      const ax = inside ? CHUNKS[hoverIdx].sx : GAL[hovered].sx;
      const ay = inside ? CHUNKS[hoverIdx].sy : GAL[hovered].sy;
      ctx.font = '500 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      const label = META[hovered].label;
      const w = ctx.measureText(label).width;
      // The name goes left when the peek card sits to the right, so the card never hides it.
      const peekRight = !inside && peekKey === hovered && peekSide && peekSide.startsWith('right');
      let lx = ax + 12;
      if (lx + w > W - 12 || peekRight) lx = Math.max(12, ax - 12 - w);
      ctx.fillStyle = rgba(pal.line, 0.95);
      ctx.fillText(label, lx, ay - 12);
      const txt = inside ? CHUNKS[hoverIdx].text : '';
      if (txt) {
        ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const lines = wrapLines(txt, 260);
        const tw = Math.max(...lines.map(l => ctx.measureText(l).width));
        let tx = ax + 12;
        if (tx + tw > W - 12) tx = ax - 12 - tw;
        ctx.fillStyle = rgba(pal.line, 0.6);
        lines.slice(0, 4).forEach((l, n) => ctx.fillText(l, tx, ay + 8 + n * 16));
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------------
  window.addEventListener('resize', () => {
    resize();
    if (selected) drawScrub();
  });
  KEYS.forEach(loadPortrait);
  if (QS.get('open') && META[QS.get('open')]) setTimeout(() => openProject(QS.get('open')), 100);
  window.__galaxy = {
    open: openProject, close: closeProject, enterSun,
    tour: q => { qInput.value = q; stopTour(); runQuery(); submitSearch(); },
    view: () => ({ angY, userTilt, zoomGoal }),
    tourState: () => {
      const h = tour.j >= 0 ? tour.stops[tour.j] : null, hasRp = project(tour.pos[0], tour.pos[1], tour.pos[2]);
      const phase = tour.phase === 'ignite' ? 'ignition' : tour.phase === 'land' ? 'landing' : tour.phase;
      return { on: tour.on, j: tour.j, pos: tour.pos.slice(), tan: tour.tan.slice(), bend: tour.bend, fly: tour.fly, phase, u: tour.u, dur: tour.dur, e: tour.e, fast: tour.fast, boost: tour.boost, thrust: tour.thrust,
        stops: tour.stops.map(x => ({ i: x.i, score: x.score, project: CHUNKS[x.i].project })), lines: tour.lp.filter(p => p >= 1).length, inside: tour.inside, groups: tour.groups, extras: tour.extras.length, z: tourZ, constel, selected, sun, pos: tour.pos.slice(),
        rocket: hasRp ? { x: renderRocketX, y: renderRocketY, angle: rocketAng, roll: rocketRoll, L: W > 720 ? 62 : 40 } : null,
        star: h && CHUNKS[h.i] ? { x: CHUNKS[h.i].sx, y: CHUNKS[h.i].sy } : null, caption: captionBox.visible ? { x: captionBox.x, y: captionBox.y, w: captionBox.w, h: captionBox.h, visible: true } : null, pips: Array.from({ length: pipCount }, (_, n) => ({ x: pipHits[n].x, y: pipHits[n].y, j: pipHits[n].j })), exhaustCount: trailCount };
    }
  };
  const stored = storedTheme();
  setTheme(stored ? stored === 'dark' : darkMq.matches, false);
  resize();
  requestAnimationFrame(frame);
})();
</script>

        async src="//gc.zgo.at/count.js"></script>
